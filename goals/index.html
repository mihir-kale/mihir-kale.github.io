<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Inter", -apple-system, sans-serif;
      font-weight: 400;
      background: #070707;
      color: #fff;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
      -webkit-font-smoothing: antialiased;
    }
    .header-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 24px; gap: 12px; flex-wrap: wrap; }
    .page-title { font-size: 13px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; color: #fff; }
    .header-actions { display: flex; align-items: center; gap: 12px; }
    .back-link { font-size: 12px; color: #0a84ff; text-decoration: none; transition: opacity .2s; }
    .back-link:hover { opacity: .7; }
    .logout-btn { background: none; border: 1px solid #333; color: #888; font-family: inherit; font-size: 11px; padding: 4px 10px; cursor: pointer; transition: color .2s, border-color .2s; }
    .logout-btn:hover { color: #fff; border-color: #fff; }

    .cycle-section { background: #111; border: 1px solid #222; border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
    .cycle-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .cycle-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; color: #0a84ff; }
    .cycle-label.meso { color: #30d158; }
    .cycle-label.macro { color: #ff9f0a; }
    .cycle-dates { font-size: 11px; color: #666; }
    .empty-cycle { padding: 8px 0; color: #555; font-size: 13px; }
    .add-cycle-btn { background: none; border: 1px solid #0a84ff; color: #0a84ff; font-family: inherit; font-size: 11px; font-weight: 500; padding: 5px 14px; border-radius: 6px; cursor: pointer; transition: all .2s; margin-top: 8px; }
    .add-cycle-btn:hover { background: #0a84ff; color: #000; }

    .goal-item { padding: 10px 12px; background: #141414; border: 1px solid #1e1e1e; border-radius: 8px; margin-bottom: 8px; transition: border-color .2s; }
    .goal-item.color-border { border-left: 3px solid; }
    .goal-item-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .goal-item-title { font-size: 14px; font-weight: 500; color: #fff; }
    .goal-item-dates { font-size: 11px; color: #555; }
    .goal-item-desc { font-size: 12px; color: #777; margin-top: 4px; line-height: 1.4; }
    .goal-item-actions { display: flex; gap: 4px; flex-shrink: 0; align-items: center; }
    .goal-item-btn { background: none; border: 1px solid #333; color: #666; font-family: inherit; font-size: 10px; padding: 2px 8px; border-radius: 4px; cursor: pointer; transition: all .15s; }
    .goal-item-btn:hover { color: #fff; border-color: #fff; }
    .goal-item-btn.del:hover { color: #ff453a; border-color: #ff453a; }
    .goal-item-btn.assign { border-color: #30d158; color: #30d158; }
    .goal-item-btn.assign:hover { background: #30d158; color: #000; }
    .color-swatch { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #333; cursor: pointer; transition: border-color .15s; flex-shrink: 0; }
    .color-swatch:hover { border-color: #fff; }
    .color-picker-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .color-opt { width: 18px; height: 18px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: all .15s; }
    .color-opt:hover, .color-opt.active { border-color: #fff; transform: scale(1.15); }

    .edit-form { display: none; margin-top: 10px; padding: 12px; background: #1a1a1a; border-radius: 8px; border: 1px solid #2a2a2a; }
    .edit-form.open { display: block; }
    .edit-row { display: flex; gap: 10px; margin-bottom: 8px; align-items: center; }
    .edit-label { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; width: 50px; flex-shrink: 0; }
    .edit-input { flex: 1; padding: 5px 8px; border: 1px solid #333; border-radius: 6px; background: #111; color: #fff; font-size: 12px; font-family: inherit; outline: none; }
    .edit-input:focus { border-color: #0a84ff; }
    .edit-input::placeholder { color: #555; }
    .edit-textarea { width: 100%; padding: 6px 8px; border: 1px solid #333; border-radius: 6px; background: #111; color: #fff; font-size: 12px; font-family: inherit; outline: none; resize: vertical; min-height: 50px; }
    .edit-textarea:focus { border-color: #0a84ff; }
    .edit-actions { display: flex; gap: 6px; margin-top: 8px; }
    .save-btn { background: #0a84ff; border: none; color: #fff; font-family: inherit; font-size: 11px; font-weight: 500; padding: 4px 12px; border-radius: 6px; cursor: pointer; transition: opacity .2s; }
    .save-btn:hover { opacity: .85; }
    .cancel-btn { background: none; border: 1px solid #333; color: #666; font-family: inherit; font-size: 11px; padding: 4px 12px; border-radius: 6px; cursor: pointer; transition: all .2s; }
    .cancel-btn:hover { color: #fff; border-color: #fff; }

    .week-section { background: #111; border: 1px solid #222; border-radius: 12px; padding: 18px 20px; }
    .week-nav { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .week-nav-btn { background: none; border: 1px solid #333; color: #666; font-size: 14px; width: 28px; height: 28px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .2s; }
    .week-nav-btn:hover { color: #fff; border-color: #fff; }
    .week-label { font-size: 12px; color: #888; }
    .time-grid { display: grid; grid-template-columns: 48px repeat(5, 1fr); border: 1px solid #1e1e1e; border-radius: 8px; overflow: hidden; max-height: 520px; overflow-y: auto; }
    .time-grid-header { position: sticky; top: 0; z-index: 2; display: contents; }
    .time-grid-header > div { background: #1a1a1a; border-bottom: 1px solid #222; padding: 6px 4px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: #555; text-align: center; }
    .time-grid-header > div:first-child { color: #333; }
    .time-grid-header > div.today-header { color: #0a84ff; }
    .time-label { background: #141414; border-bottom: 1px solid #1e1e1e; border-right: 1px solid #1e1e1e; padding: 2px 4px; font-size: 9px; color: #555; text-align: right; height: 36px; display: flex; align-items: flex-start; justify-content: flex-end; }
    .time-cell { background: #111; border-bottom: 1px solid #1e1e1e; border-right: 1px solid #1e1e1e; padding: 2px 3px; min-height: 36px; cursor: pointer; transition: background .1s; position: relative; }
    .time-cell:hover { background: #1a1a1a; }
    .time-cell.drag-over { background: #0a84ff14; }
    .time-cell.today-col { background: #0a84ff05; }
    .time-cell .cell-tasks { display: flex; flex-direction: column; gap: 2px; }
    .time-cell .cell-task { display: flex; align-items: center; gap: 2px; padding: 2px 4px; background: #1e1e1e; border: 1px solid #2a2a2a; border-radius: 3px; font-size: 10px; color: #ccc; cursor: grab; transition: all .1s; }
    .time-cell .cell-task:hover { border-color: #444; background: #252525; }
    .time-cell .cell-task.dragging { opacity: 0.4; }
    .time-cell .cell-task-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .time-cell .cell-task-btn { background: none; border: none; color: #444; font-size: 9px; cursor: pointer; padding: 0 1px; opacity: 0; transition: all .1s; flex-shrink: 0; }
    .time-cell .cell-task:hover .cell-task-btn { opacity: 1; }
    .time-cell .cell-task-btn:hover { color: #fff; }
    .time-cell .cell-task-btn.copy:hover { color: #0a84ff; }
    .time-cell .cell-task-btn.del:hover { color: #ff453a; }
    .time-cell-add { display: none; gap: 2px; margin-top: 2px; }
    .time-cell:focus-within .time-cell-add { display: flex; }
    .time-cell-add input { flex: 1; padding: 2px 4px; border: 1px solid #2a2a2a; border-radius: 3px; background: #111; color: #fff; font-size: 10px; font-family: inherit; outline: none; }
    .time-cell-add input:focus { border-color: #0a84ff; }
    .time-cell-add button { background: none; border: 1px solid #2a2a2a; color: #555; font-size: 9px; padding: 1px 4px; border-radius: 3px; cursor: pointer; }
    .time-cell-add button:hover { color: #fff; border-color: #0a84ff; }

    #loginForm { display: none; max-width: 320px; margin: 120px auto; }
    #loginForm h2 { font-size: 18px; font-weight: 500; color: #fff; margin-bottom: 24px; }
    .login-field { margin-bottom: 12px; }
    .login-field input { width: 100%; padding: 10px 12px; background: #111; border: 1px solid #333; border-radius: 8px; color: #fff; font-family: inherit; font-size: 14px; outline: none; transition: border-color .2s; }
    .login-field input:focus { border-color: #0a84ff; }
    .login-field input::placeholder { color: #555; }
    .login-btn { width: 100%; padding: 10px; background: #0a84ff; border: none; border-radius: 8px; color: #fff; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 4px; transition: opacity .2s; }
    .login-btn:hover { opacity: .85; }
    .login-error { color: #ff453a; font-size: 12px; margin-top: 8px; display: none; }

    #themeToggle { position: fixed; right: 14px; bottom: 14px; z-index: 100; width: 30px; height: 30px; border-radius: 50%; border: 1px solid #333; background: #111; color: #888; font-size: 14px; line-height: 1; cursor: pointer; opacity: .55; transition: opacity .2s, color .2s, border-color .2s, background .2s; }
    #themeToggle:hover { opacity: 1; color: #fff; border-color: #fff; }

    body.light-mode { background: #f4f5f7; color: #111; }
    body.light-mode .page-title { color: #111; }
    body.light-mode .back-link { color: #0a84ff; }
    body.light-mode .logout-btn { border-color: #ccc; color: #666; }
    body.light-mode .logout-btn:hover { color: #111; border-color: #111; }
    body.light-mode .cycle-section, body.light-mode .week-section { background: #fff; border-color: #e3e4e8; }
    body.light-mode .cycle-dates { color: #999; }
    body.light-mode .goal-item { background: #f5f6f8; border-color: #e3e4e8; }
    body.light-mode .goal-item-title { color: #111; }
    body.light-mode .goal-item-dates { color: #999; }
    body.light-mode .goal-item-desc { color: #666; }
    body.light-mode .edit-form { background: #f5f6f8; border-color: #e3e4e8; }
    body.light-mode .edit-input { background: #fff; border-color: #ccc; color: #111; }
    body.light-mode .edit-textarea { background: #fff; border-color: #ccc; color: #111; }
    body.light-mode .cancel-btn { border-color: #ccc; color: #777; }
    body.light-mode .cancel-btn:hover { color: #111; border-color: #111; }
    body.light-mode .week-nav-btn { border-color: #ccc; color: #777; }
    body.light-mode .week-nav-btn:hover { color: #111; border-color: #111; }
    body.light-mode .week-label { color: #666; }
    body.light-mode .day-col { background: #fff; border-color: #e3e4e8; }
    body.light-mode .day-col.today { border-color: #0a84ff55; background: #f0f7ff; }
    body.light-mode .day-col.drag-over { border-color: #0a84ff; background: #e8f4ff; }
    body.light-mode .day-col-header { color: #999; }
    body.light-mode .day-col-date { color: #111; }
    body.light-mode .day-col.today .day-col-header, body.light-mode .day-col.today .day-col-date { color: #0a84ff; }
    body.light-mode .day-task { background: #f5f6f8; border-color: #e3e4e8; }
    body.light-mode .day-task:hover { background: #eceef1; border-color: #d0d2d6; }
    body.light-mode .day-task-text { color: #333; }
    body.light-mode .day-add-input { background: #fff; border-color: #e3e4e8; color: #111; }
    body.light-mode .day-add-btn { border-color: #e3e4e8; color: #999; }
    body.light-mode #themeToggle { background: #fff; border-color: #ccc; color: #666; }
    body.light-mode #themeToggle:hover { color: #111; border-color: #111; }

    @media (max-width: 900px) { .week-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 600px) { .week-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <div id="loginForm">
    <h2>Goals</h2>
    <form id="authForm">
      <div class="login-field"><input type="email" id="authEmail" placeholder="Email" required /></div>
      <div class="login-field"><input type="password" id="authPass" placeholder="Password" required /></div>
      <button type="submit" class="login-btn">Sign in</button>
      <div class="login-error" id="authError"></div>
    </form>
  </div>

  <div id="authGate">
    <div class="header-row">
      <div class="page-title">Goals</div>
      <div class="header-actions">
        <a href="/dashboard/" class="back-link">&larr; Dashboard</a>
        <button class="logout-btn" id="logoutBtn">Sign out</button>
      </div>
    </div>

    <div class="cycle-section">
      <div class="cycle-header">
        <span class="cycle-label macro">Macro Cycle</span>
        <span class="cycle-dates" id="macroDates"></span>
      </div>
      <div id="macroContent"></div>
      <button class="add-cycle-btn" data-add-cycle="macro">+ Add macro goal</button>
      <div class="edit-form" id="macroForm">
        <div class="edit-row"><span class="edit-label">Title</span><input class="edit-input" id="macroTitle" placeholder="e.g., Launch side project" /></div>
        <textarea class="edit-textarea" id="macroDesc" placeholder="Qualitative goal description..."></textarea>
        <div class="edit-row"><span class="edit-label">Start</span><input class="edit-input" id="macroStart" type="date" /><span class="edit-label" style="width:auto">End</span><input class="edit-input" id="macroEnd" type="date" /></div>
        <div class="edit-row"><span class="edit-label">Color</span><div class="color-picker-row" id="macroColorPicker"></div></div>
        <div class="edit-actions"><button class="save-btn" id="macroSave">Save</button><button class="cancel-btn" id="macroCancel">Cancel</button></div>
      </div>
    </div>

    <div class="cycle-section">
      <div class="cycle-header">
        <span class="cycle-label meso">Meso Cycle (4 weeks)</span>
        <span class="cycle-dates" id="mesoDates"></span>
      </div>
      <div id="mesoContent"></div>
      <button class="add-cycle-btn" data-add-cycle="meso">+ Add meso goal</button>
      <div class="edit-form" id="mesoForm">
        <div class="edit-row"><span class="edit-label">Title</span><input class="edit-input" id="mesoTitle" placeholder="e.g., Build MVP" /></div>
        <textarea class="edit-textarea" id="mesoDesc" placeholder="Qualitative goal description..."></textarea>
        <div class="edit-row"><span class="edit-label">Start</span><input class="edit-input" id="mesoStart" type="date" /><span class="edit-label" style="width:auto">End</span><input class="edit-input" id="mesoEnd" type="date" /></div>
        <div class="edit-actions"><button class="save-btn" id="mesoSave">Save</button><button class="cancel-btn" id="mesoCancel">Cancel</button></div>
      </div>
    </div>

    <div class="cycle-section">
      <div class="cycle-header">
        <span class="cycle-label">Weekly Goals</span>
        <span class="cycle-dates" id="microDates"></span>
      </div>
      <div id="microContent"></div>
      <button class="add-cycle-btn" data-add-cycle="micro">+ Add weekly goal</button>
      <div class="edit-form" id="microForm">
        <div class="edit-row"><span class="edit-label">Title</span><input class="edit-input" id="microTitle" placeholder="e.g., Sprint 1: Foundation" /></div>
        <textarea class="edit-textarea" id="microDesc" placeholder="Qualitative goal description..."></textarea>
        <div class="edit-row"><span class="edit-label">Start</span><input class="edit-input" id="microStart" type="date" /><span class="edit-label" style="width:auto">End</span><input class="edit-input" id="microEnd" type="date" /></div>
        <div class="edit-actions"><button class="save-btn" id="microSave">Save</button><button class="cancel-btn" id="microCancel">Cancel</button></div>
      </div>
    </div>

    <div class="week-section">
      <div class="cycle-header">
        <span class="cycle-label">Weekly Planner</span>
        <div class="week-nav">
          <button class="week-nav-btn" id="weekPrev">&larr;</button>
          <span class="week-label" id="weekLabel"></span>
          <button class="week-nav-btn" id="weekNext">&rarr;</button>
          <button class="goal-item-btn" id="weekToday">Today</button>
        </div>
      </div>
      <div id="weekContent"><div class="no-goal-msg">Add a weekly goal to start planning</div></div>
    </div>
  </div>

  <button id="themeToggle" title="Toggle color scheme">&#9680;</button>

  <script>
    var SUPABASE_URL = "https://heyrtjzntnicqsfemcmi.supabase.co";
    var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhleXJ0anpudG5pY3FzZmVtY21pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3OTU3NDksImV4cCI6MjA5OTM3MTc0OX0.MwivwC-MUgI7J4-bH5ahjuL8YLQYPsR1vzcRVlpoTNo";
    var db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    var TZ = "America/New_York";
    var DAY_NAMES = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
    var MONTH_NAMES = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
    var GOAL_COLORS = ["#0a84ff", "#30d158", "#ff9f0a", "#ff453a", "#bf5af2", "#64d2ff", "#ffd60a", "#ff6482"];

    function esc(s) { return s === null || s === undefined ? "" : String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }
    function todayEt() { return new Date().toLocaleDateString("en-CA", { timeZone: TZ }); }
    function generateId() { var c = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789"; var v = crypto.getRandomValues(new Uint8Array(21)); return v.reduce(function(a, x) { return a + c[x & 63]; }, ""); }
    function formatDate(s) { if (!s) return ""; var d = new Date(s + "T12:00:00"); return MONTH_NAMES[d.getMonth()] + " " + d.getDate(); }
    function addDays(s, n) { var d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return d.toLocaleDateString("en-CA", { timeZone: TZ }); }
    function getMonday(s) { var d = new Date(s + "T12:00:00"); var day = d.getDay(); d.setDate(d.getDate() - day + (day === 0 ? -6 : 1)); return d.toLocaleDateString("en-CA", { timeZone: TZ }); }

    function getColor(g) {
      if (g.color) return g.color;
      if (g.cycle_type === "meso" && g.parent_id) {
        var macro = state.goals.find(function(x) { return x.id === g.parent_id; });
        if (macro && macro.color) return macro.color;
      }
      if (g.cycle_type === "micro" && g.parent_id) {
        var meso = state.goals.find(function(x) { return x.id === g.parent_id; });
        if (meso && meso.color) return meso.color;
        if (meso && meso.parent_id) {
          var macro2 = state.goals.find(function(x) { return x.id === meso.parent_id; });
          if (macro2 && macro2.color) return macro2.color;
        }
      }
      return null;
    }

    var state = { goals: [], goalTasks: [], weekOffset: 0, editingId: null, editingType: null };
    var dragState = { taskId: null, fromDate: null };

    async function loadAll() {
      var r = await Promise.all([
        db.from("goals").select("*").order("created_at", { ascending: false }),
        db.from("goal_tasks").select("*").order("day_date", { ascending: true }),
      ]);
      if (r[0].error) throw r[0].error;
      if (r[1].error) throw r[1].error;
      state.goals = r[0].data || [];
      state.goalTasks = r[1].data || [];
    }

    function renderAll() {
      renderCycle("macro");
      renderCycle("meso");
      renderCycle("micro");
      renderWeek();
    }

    function renderCycle(type) {
      var goals = state.goals.filter(function(g) { return g.cycle_type === type && g.status === "active"; });
      var el = document.getElementById(type + "Content");
      var datesEl = document.getElementById(type + "Dates");

      if (type === "macro") {
        datesEl.textContent = formatDate(getQuarterEnd());
      } else if (type === "meso") {
        var today = todayEt();
        var monday = getMonday(today);
        var mesoEnd = addDays(monday, 27);
        var qEnd = getQuarterEnd();
        if (mesoEnd > qEnd) mesoEnd = qEnd;
        datesEl.textContent = formatDate(mesoEnd);
      } else {
        var today = todayEt();
        var monday = getMonday(today);
        var weekEnd = addDays(monday, 6);
        datesEl.textContent = formatDate(weekEnd);
      }

      if (!goals.length) {
        el.innerHTML = '<div class="empty-cycle">No ' + type + ' goals yet</div>';
      } else {
        el.innerHTML = goals.map(function(g) {
          var color = getColor(g);
          var borderClass = color ? ' color-border' : '';
          var borderColor = color ? ' style="border-left-color:' + esc(color) + '"' : '';
          var assignBtn = "";
          if (type === "meso" && !g.parent_id) {
            assignBtn = '<button class="goal-item-btn assign" data-assign-macro="' + esc(g.id) + '">Link</button>';
          } else if (type === "micro" && !g.parent_id) {
            assignBtn = '<button class="goal-item-btn assign" data-assign-meso="' + esc(g.id) + '">Link</button>';
          }
          return '<div class="goal-item' + borderClass + '"' + borderColor + '>' +
            '<div class="goal-item-header">' +
              '<div class="goal-item-title">' + esc(g.title) + '</div>' +
              '<div class="goal-item-actions">' +
                assignBtn +
                '<button class="goal-item-btn" data-edit-goal="' + esc(g.id) + '">Edit</button>' +
                '<button class="goal-item-btn del" data-del-goal="' + esc(g.id) + '">&times;</button>' +
              '</div>' +
            '</div>' +
            (g.description ? '<div class="goal-item-desc">' + esc(g.description) + '</div>' : '') +
          '</div>';
        }).join("");

        el.querySelectorAll("[data-edit-goal]").forEach(function(btn) {
          btn.addEventListener("click", function() {
            var g = state.goals.find(function(x) { return x.id === btn.dataset.editGoal; });
            if (g) openEditForm(type, g);
          });
        });
        el.querySelectorAll("[data-del-goal]").forEach(function(btn) {
          btn.addEventListener("click", function() {
            deleteGoal(btn.dataset.delGoal);
          });
        });
        el.querySelectorAll("[data-assign-macro]").forEach(function(btn) {
          btn.addEventListener("click", function() {
            assignToParent(btn.dataset.assignMacro, "macro");
          });
        });
        el.querySelectorAll("[data-assign-meso]").forEach(function(btn) {
          btn.addEventListener("click", function() {
            assignToParent(btn.dataset.assignMeso, "meso");
          });
        });
      }
      document.getElementById(type + "Form").classList.remove("open");
    }

    function getQuarterEnd() {
      var today = new Date();
      var y = today.getFullYear();
      var m = today.getMonth();
      if (m < 3) return y + "-03-31";
      if (m < 6) return y + "-06-30";
      if (m < 9) return y + "-09-30";
      return y + "-12-31";
    }

    function getQuarterStart() {
      var today = new Date();
      var y = today.getFullYear();
      var m = today.getMonth();
      if (m < 3) return (y - 1) + "-10-01";
      if (m < 6) return y + "-01-01";
      if (m < 9) return y + "-04-01";
      return y + "-07-01";
    }

    function openEditForm(type, goal) {
      var form = document.getElementById(type + "Form");
      document.getElementById(type + "Title").value = goal ? goal.title : "";
      document.getElementById(type + "Desc").value = goal ? (goal.description || "") : "";
      if (goal) {
        document.getElementById(type + "Start").value = goal.start_date;
        document.getElementById(type + "End").value = goal.end_date;
        state.editingId = goal.id;
      } else {
        var today = todayEt();
        var monday = getMonday(today);
        if (type === "macro") {
          var qStart = getQuarterStart();
          document.getElementById(type + "Start").value = qStart;
          document.getElementById(type + "End").value = getQuarterEnd();
        } else if (type === "meso") {
          document.getElementById(type + "Start").value = monday;
          var mesoEnd = addDays(monday, 27);
          if (mesoEnd > getQuarterEnd()) mesoEnd = getQuarterEnd();
          document.getElementById(type + "End").value = mesoEnd;
        } else {
          document.getElementById(type + "Start").value = monday;
          document.getElementById(type + "End").value = addDays(monday, 4);
        }
        state.editingId = null;
      }
      if (type === "macro") {
        var picker = document.getElementById("macroColorPicker");
        var selectedColor = goal ? (goal.color || GOAL_COLORS[0]) : GOAL_COLORS[0];
        picker.innerHTML = GOAL_COLORS.map(function(c) {
          var active = c === selectedColor ? ' active' : '';
          return '<div class="color-opt' + active + '" data-color="' + c + '" style="background:' + c + '"></div>';
        }).join("");
        picker.querySelectorAll(".color-opt").forEach(function(opt) {
          opt.addEventListener("click", function() {
            picker.querySelectorAll(".color-opt").forEach(function(o) { o.classList.remove("active"); });
            opt.classList.add("active");
          });
        });
      }
      state.editingType = type;
      form.classList.add("open");
      document.getElementById(type + "Title").focus();
    }

    function renderWeek() {
      var el = document.getElementById("weekContent");
      var labelEl = document.getElementById("weekLabel");
      var weekGoals = state.goals.filter(function(g) { return g.cycle_type === "micro" && g.status === "active"; });

      if (!weekGoals.length) {
        el.innerHTML = '<div class="no-goal-msg">Add a weekly goal to start planning</div>';
        labelEl.textContent = "";
        return;
      }

      var today = todayEt();
      var monday = getMonday(today);
      var weekStart = addDays(monday, state.weekOffset * 7);
      var weekEnd = addDays(monday, 6);
      labelEl.textContent = formatDate(weekStart) + " \u2192 " + formatDate(weekEnd);

      var weekGoalIds = weekGoals.map(function(g) { return g.id; });
      var days = [];
      for (var i = 0; i < 5; i++) {
        var date = addDays(weekStart, i);
        var d = new Date(date + "T12:00:00");
        days.push({ date: date, dayName: DAY_NAMES[d.getDay()], dayNum: d.getDate(), isToday: date === today });
      }

      var hours = [];
      for (var h = 6; h <= 22; h++) {
        hours.push({ h: h, label: h === 0 ? "12a" : h < 12 ? h + "a" : h === 12 ? "12p" : (h - 12) + "p" });
      }

      var html = '<div class="time-grid">';
      html += '<div class="time-grid-header"><div></div>';
      days.forEach(function(day) {
        var cls = day.isToday ? ' today-header' : '';
        html += '<div class="' + cls + '">' + day.dayName + ' ' + day.dayNum + '</div>';
      });
      html += '</div>';

      hours.forEach(function(hour) {
        html += '<div class="time-label">' + hour.label + '</div>';
        days.forEach(function(day) {
          var timeStr = (hour.h < 10 ? "0" : "") + hour.h + ":00";
          var cellTasks = state.goalTasks.filter(function(t) {
            return weekGoalIds.indexOf(t.goal_id) !== -1 && t.day_date === day.date && t.start_time === timeStr;
          });
          var todayCls = day.isToday ? ' today-col' : '';

          var tasksHtml = cellTasks.map(function(t) {
            var gName = weekGoals.find(function(g) { return g.id === t.goal_id; });
            var tag = weekGoals.length > 1 ? '<span style="font-size:8px;color:#0a84ff">' + esc(gName ? gName.title.substring(0, 6) : "") + ':</span>' : '';
            return '<div class="cell-task" draggable="true" data-task-id="' + esc(t.id) + '" data-task-date="' + esc(day.date) + '" data-task-time="' + esc(timeStr) + '">' +
              tag + '<span class="cell-task-text">' + esc(t.description) + '</span>' +
              '<button class="cell-task-btn copy" data-copy="' + esc(t.id) + '" title="Copy">&rarr;</button>' +
              '<button class="cell-task-btn del" data-del-task="' + esc(t.id) + '" title="Delete">&times;</button>' +
            '</div>';
          }).join("");

          html += '<div class="time-cell' + todayCls + '" data-day="' + esc(day.date) + '" data-time="' + esc(timeStr) + '">' +
            '<div class="cell-tasks">' + tasksHtml + '</div>' +
            '<div class="time-cell-add">' +
              '<input placeholder="..." data-cell-input="' + esc(day.date) + '-' + esc(timeStr) + '" />' +
              '<button data-cell-add="' + esc(day.date) + '-' + esc(timeStr) + '">+</button>' +
            '</div>' +
          '</div>';
        });
      });
      html += '</div>';
      el.innerHTML = html;

      el.querySelectorAll("[data-cell-input]").forEach(function(input) {
        input.addEventListener("keydown", function(e) {
          if (e.key === "Enter" && input.value.trim()) {
            var parts = input.dataset.cellInput.split("-");
            var date = parts[0];
            var time = parts[1];
            var goalId = weekGoals[0].id;
            if (weekGoals.length > 1) {
              var select = input.closest(".time-cell").querySelector("[data-goal-select]");
              if (select) goalId = select.value;
            }
            addGoalTask(goalId, date, input.value.trim(), time);
            input.value = "";
          }
        });
      });
      el.querySelectorAll("[data-cell-add]").forEach(function(btn) {
        btn.addEventListener("click", function() {
          var key = btn.dataset.cellAdd;
          var parts = key.split("-");
          var date = parts[0];
          var time = parts[1];
          var input = el.querySelector('[data-cell-input="' + key + '"]');
          if (input && input.value.trim()) {
            var goalId = weekGoals[0].id;
            if (weekGoals.length > 1) {
              var select = btn.closest(".time-cell").querySelector("[data-goal-select]");
              if (select) goalId = select.value;
            }
            addGoalTask(goalId, date, input.value.trim(), time);
            input.value = "";
          }
        });
      });
      el.querySelectorAll("[data-del-task]").forEach(function(btn) {
        btn.addEventListener("click", function(e) { e.stopPropagation(); deleteGoalTask(btn.dataset.delTask); });
      });
      el.querySelectorAll("[data-copy]").forEach(function(btn) {
        btn.addEventListener("click", function(e) { e.stopPropagation(); copyGoalTask(btn.dataset.copy); });
      });

      el.querySelectorAll(".cell-task").forEach(function(taskEl) {
        taskEl.addEventListener("dragstart", function(e) {
          dragState.taskId = taskEl.dataset.taskId;
          dragState.fromDate = taskEl.dataset.taskDate;
          taskEl.classList.add("dragging");
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData("text/plain", taskEl.dataset.taskId);
        });
        taskEl.addEventListener("dragend", function() {
          taskEl.classList.remove("dragging");
          dragState = { taskId: null, fromDate: null };
          el.querySelectorAll(".time-cell").forEach(function(c) { c.classList.remove("drag-over"); });
        });
      });
      el.querySelectorAll(".time-cell").forEach(function(cell) {
        cell.addEventListener("dragover", function(e) { e.preventDefault(); e.dataTransfer.dropEffect = "move"; cell.classList.add("drag-over"); });
        cell.addEventListener("dragleave", function() { cell.classList.remove("drag-over"); });
        cell.addEventListener("drop", function(e) {
          e.preventDefault(); cell.classList.remove("drag-over");
          var taskId = e.dataTransfer.getData("text/plain");
          if (taskId) moveGoalTask(taskId, cell.dataset.day, cell.dataset.time);
        });
      });
    }

    async function saveGoal(type) {
      var title = document.getElementById(type + "Title").value.trim();
      var desc = document.getElementById(type + "Desc").value.trim();
      var start = document.getElementById(type + "Start").value;
      var end = document.getElementById(type + "End").value;
      if (!title || !start || !end) return;
      var now = new Date().toISOString();

      var color = null;
      if (type === "macro") {
        var activeOpt = document.querySelector("#macroColorPicker .color-opt.active");
        color = activeOpt ? activeOpt.dataset.color : GOAL_COLORS[0];
      }

      if (state.editingId) {
        var patch = { title: title, description: desc, start_date: start, end_date: end, updated_at: now };
        if (type === "macro") patch.color = color;
        await db.from("goals").update(patch).eq("id", state.editingId);
        var g = state.goals.find(function(x) { return x.id === state.editingId; });
        if (g) Object.assign(g, patch);
      } else {
        var id = generateId();
        var goal = { id: id, title: title, description: desc, cycle_type: type, start_date: start, end_date: end, status: "active", created_at: now, updated_at: now };
        if (type === "macro") goal.color = color;
        await db.from("goals").insert(goal);
        state.goals.push(goal);
      }
      state.editingId = null;
      renderAll();
    }

    async function deleteGoal(id) {
      var g = state.goals.find(function(x) { return x.id === id; });
      if (!g) return;
      if (!confirm('Delete goal "' + g.title + '"?')) return;
      await db.from("goals").delete().eq("id", id);
      state.goals = state.goals.filter(function(x) { return x.id !== id; });
      state.goalTasks = state.goalTasks.filter(function(t) { return t.goal_id !== id; });
      renderAll();
    }

    async function assignToParent(childId, parentType) {
      var parents = state.goals.filter(function(g) { return g.cycle_type === parentType && g.status === "active"; });
      if (!parents.length) return;
      var child = state.goals.find(function(g) { return g.id === childId; });
      if (!child) return;
      var currentParentId = child.parent_id || "";

      var btn = document.querySelector('[data-assign-' + (parentType === "macro" ? 'macro' : 'meso') + '="' + childId + '"]');
      if (!btn) return;

      var select = document.createElement("select");
      select.className = "day-add-input";
      select.style.cssText = "flex:0 0 auto;width:auto;padding:2px 4px;font-size:10px";
      select.innerHTML = '<option value="">None</option>' +
        parents.map(function(g) {
          var sel = g.id === currentParentId ? ' selected' : '';
          return '<option value="' + esc(g.id) + '"' + sel + '>' + esc(g.title.substring(0, 20)) + '</option>';
        }).join("");

      btn.replaceWith(select);
      select.focus();

      select.addEventListener("change", async function() {
        var parentId = select.value || null;
        var now = new Date().toISOString();
        await db.from("goals").update({ parent_id: parentId, updated_at: now }).eq("id", childId);
        child.parent_id = parentId;
        renderAll();
      });

      select.addEventListener("blur", function() {
        renderAll();
      });
    }

    async function addGoalTask(goalId, date, description, startTime) {
      var id = generateId();
      var now = new Date().toISOString();
      var task = { id: id, goal_id: goalId, day_date: date, description: description, status: "pending", created_at: now, updated_at: now };
      if (startTime) task.start_time = startTime;
      state.goalTasks.push(task);
      renderWeek();
      try { await db.from("goal_tasks").insert(task); } catch (e) {
        state.goalTasks = state.goalTasks.filter(function(t) { return t.id !== id; });
        renderWeek();
      }
    }

    async function deleteGoalTask(id) {
      state.goalTasks = state.goalTasks.filter(function(t) { return t.id !== id; });
      renderWeek();
      try { await db.from("goal_tasks").delete().eq("id", id); } catch (e) {}
    }

    async function copyGoalTask(id) {
      var orig = state.goalTasks.find(function(t) { return t.id === id; });
      if (!orig) return;
      var newDate = addDays(orig.day_date, 1);
      var newId = generateId();
      var now = new Date().toISOString();
      var task = { id: newId, goal_id: orig.goal_id, day_date: newDate, description: orig.description, status: "pending", created_at: now, updated_at: now };
      if (orig.start_time) task.start_time = orig.start_time;
      state.goalTasks.push(task);
      renderWeek();
      try { await db.from("goal_tasks").insert(task); } catch (e) {
        state.goalTasks = state.goalTasks.filter(function(t) { return t.id !== newId; });
        renderWeek();
      }
    }

    async function moveGoalTask(id, newDate, newTime) {
      var task = state.goalTasks.find(function(t) { return t.id === id; });
      if (!task) return;
      if (task.day_date === newDate && task.start_time === newTime) return;
      task.day_date = newDate;
      if (newTime) task.start_time = newTime;
      renderWeek();
      try { await db.from("goal_tasks").update({ day_date: newDate, start_time: newTime, updated_at: new Date().toISOString() }).eq("id", id); } catch (e) {}
    }

    function showGoals() { document.getElementById("loginForm").style.display = "none"; document.getElementById("authGate").style.display = "block"; refresh(); }
    function showLogin() { document.getElementById("loginForm").style.display = "block"; document.getElementById("authGate").style.display = "none"; }
    async function refresh() { try { await loadAll(); renderAll(); } catch (e) { console.error("Refresh failed:", e); } }

    document.getElementById("authForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      var errEl = document.getElementById("authError");
      errEl.style.display = "none";
      var r = await db.auth.signInWithPassword({ email: document.getElementById("authEmail").value, password: document.getElementById("authPass").value });
      if (r.error) { errEl.textContent = r.error.message; errEl.style.display = "block"; } else { showGoals(); }
    });
    document.getElementById("logoutBtn").addEventListener("click", async function() { await db.auth.signOut(); showLogin(); });

    document.querySelectorAll("[data-add-cycle]").forEach(function(btn) {
      btn.addEventListener("click", function() { state.editingId = null; openEditForm(btn.dataset.addCycle, null); });
    });
    ["macro", "meso", "micro"].forEach(function(type) {
      document.getElementById(type + "Save").addEventListener("click", function() { saveGoal(type); });
      document.getElementById(type + "Cancel").addEventListener("click", function() { document.getElementById(type + "Form").classList.remove("open"); state.editingId = null; });
    });

    document.getElementById("weekPrev").addEventListener("click", function() { state.weekOffset--; renderWeek(); });
    document.getElementById("weekNext").addEventListener("click", function() { state.weekOffset++; renderWeek(); });
    document.getElementById("weekToday").addEventListener("click", function() { state.weekOffset = 0; renderWeek(); });

    document.getElementById("themeToggle").addEventListener("click", function() {
      document.body.classList.toggle("light-mode");
      localStorage.setItem("theme", document.body.classList.contains("light-mode") ? "light" : "dark");
    });
    if (localStorage.getItem("theme") === "light") document.body.classList.add("light-mode");

    db.auth.getSession().then(function(r) { if (r.data.session) showGoals(); else showLogin(); });
  </script>
</body>
</html>
