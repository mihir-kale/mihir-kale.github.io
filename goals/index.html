<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Inter", -apple-system, sans-serif;
      font-weight: 400;
      background: #070707;
      color: #fff;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
      -webkit-font-smoothing: antialiased;
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 24px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .page-title { font-size: 13px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; color: #fff; }
    .header-actions { display: flex; align-items: center; gap: 12px; }
    .back-link { font-size: 12px; color: #0a84ff; text-decoration: none; transition: opacity .2s; }
    .back-link:hover { opacity: .7; }
    .logout-btn { background: none; border: 1px solid #333; color: #888; font-family: inherit; font-size: 11px; padding: 4px 10px; cursor: pointer; transition: color .2s, border-color .2s; }
    .logout-btn:hover { color: #fff; border-color: #fff; }

    .cycle-section { background: #111; border: 1px solid #222; border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
    .cycle-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .cycle-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; color: #0a84ff; }
    .cycle-label.meso { color: #30d158; }
    .cycle-label.macro { color: #ff9f0a; }
    .cycle-dates { font-size: 11px; color: #666; }
    .cycle-title { font-size: 16px; font-weight: 500; color: #fff; margin-bottom: 6px; }
    .cycle-desc { font-size: 13px; color: #888; line-height: 1.5; }
    .cycle-edit-btn { background: none; border: 1px solid #333; color: #666; font-family: inherit; font-size: 11px; padding: 3px 10px; border-radius: 6px; cursor: pointer; transition: all .2s; }
    .cycle-edit-btn:hover { color: #fff; border-color: #fff; }
    .empty-cycle { padding: 16px 0; color: #555; font-size: 13px; }
    .add-cycle-btn { background: none; border: 1px solid #0a84ff; color: #0a84ff; font-family: inherit; font-size: 11px; font-weight: 500; padding: 5px 14px; border-radius: 6px; cursor: pointer; transition: all .2s; }
    .add-cycle-btn:hover { background: #0a84ff; color: #000; }

    .edit-form { display: none; margin-top: 12px; padding: 14px; background: #1a1a1a; border-radius: 8px; border: 1px solid #2a2a2a; }
    .edit-form.open { display: block; }
    .edit-row { display: flex; gap: 12px; margin-bottom: 10px; align-items: center; }
    .edit-label { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; width: 70px; flex-shrink: 0; }
    .edit-input { flex: 1; padding: 6px 10px; border: 1px solid #333; border-radius: 6px; background: #111; color: #fff; font-size: 13px; font-family: inherit; outline: none; }
    .edit-input:focus { border-color: #0a84ff; }
    .edit-input::placeholder { color: #555; }
    .edit-textarea { width: 100%; padding: 8px 10px; border: 1px solid #333; border-radius: 6px; background: #111; color: #fff; font-size: 13px; font-family: inherit; outline: none; resize: vertical; min-height: 60px; }
    .edit-textarea:focus { border-color: #0a84ff; }
    .edit-actions { display: flex; gap: 8px; margin-top: 10px; }
    .save-btn { background: #0a84ff; border: none; color: #fff; font-family: inherit; font-size: 12px; font-weight: 500; padding: 5px 14px; border-radius: 6px; cursor: pointer; transition: opacity .2s; }
    .save-btn:hover { opacity: .85; }
    .cancel-btn { background: none; border: 1px solid #333; color: #666; font-family: inherit; font-size: 12px; padding: 5px 14px; border-radius: 6px; cursor: pointer; transition: all .2s; }
    .cancel-btn:hover { color: #fff; border-color: #fff; }
    .delete-btn { background: none; border: 1px solid #ff453a55; color: #ff453a; font-family: inherit; font-size: 12px; padding: 5px 14px; border-radius: 6px; cursor: pointer; margin-left: auto; transition: all .2s; }
    .delete-btn:hover { background: #ff453a; color: #fff; }

    .week-section { background: #111; border: 1px solid #222; border-radius: 12px; padding: 18px 20px; }
    .week-nav { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .week-nav-btn { background: none; border: 1px solid #333; color: #666; font-size: 14px; width: 28px; height: 28px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .2s; }
    .week-nav-btn:hover { color: #fff; border-color: #fff; }
    .week-label { font-size: 12px; color: #888; }
    .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
    .day-col { background: #141414; border: 1px solid #1e1e1e; border-radius: 8px; padding: 10px; min-height: 140px; transition: background .15s, border-color .15s; }
    .day-col.today { border-color: #0a84ff55; background: #0a84ff08; }
    .day-col.drag-over { border-color: #0a84ff; background: #0a84ff14; }
    .day-col-header { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: #555; margin-bottom: 4px; }
    .day-col.today .day-col-header { color: #0a84ff; }
    .day-col-date { font-size: 18px; font-weight: 500; color: #fff; margin-bottom: 10px; }
    .day-col.today .day-col-date { color: #0a84ff; }
    .day-tasks { display: flex; flex-direction: column; gap: 4px; min-height: 40px; }
    .day-task { display: flex; align-items: center; gap: 4px; padding: 4px 6px; background: #1a1a1a; border: 1px solid #222; border-radius: 4px; cursor: grab; transition: all .15s; }
    .day-task:active { cursor: grabbing; }
    .day-task:hover { border-color: #333; background: #1e1e1e; }
    .day-task.dragging { opacity: 0.4; border-color: #0a84ff; }
    .day-task-text { flex: 1; font-size: 12px; color: #ccc; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .day-task-btn { background: none; border: none; color: #444; font-size: 11px; cursor: pointer; padding: 0 2px; opacity: 0; transition: all .15s; flex-shrink: 0; }
    .day-task:hover .day-task-btn { opacity: 1; }
    .day-task-btn:hover { color: #fff; }
    .day-task-btn.copy:hover { color: #0a84ff; }
    .day-task-btn.del:hover { color: #ff453a; }
    .day-add-row { display: flex; gap: 4px; margin-top: 6px; }
    .day-add-input { flex: 1; padding: 3px 6px; border: 1px solid #2a2a2a; border-radius: 4px; background: #111; color: #fff; font-size: 11px; font-family: inherit; outline: none; }
    .day-add-input:focus { border-color: #0a84ff; }
    .day-add-input::placeholder { color: #444; }
    .day-add-btn { background: none; border: 1px solid #2a2a2a; color: #555; font-size: 11px; padding: 2px 6px; border-radius: 4px; cursor: pointer; transition: all .15s; }
    .day-add-btn:hover { color: #fff; border-color: #0a84ff; }
    .no-goal-msg { padding: 20px 0; color: #555; font-size: 13px; text-align: center; }

    #loginForm { display: none; max-width: 320px; margin: 120px auto; }
    #loginForm h2 { font-size: 18px; font-weight: 500; color: #fff; margin-bottom: 24px; }
    .login-field { margin-bottom: 12px; }
    .login-field input { width: 100%; padding: 10px 12px; background: #111; border: 1px solid #333; border-radius: 8px; color: #fff; font-family: inherit; font-size: 14px; outline: none; transition: border-color .2s; }
    .login-field input:focus { border-color: #0a84ff; }
    .login-field input::placeholder { color: #555; }
    .login-btn { width: 100%; padding: 10px; background: #0a84ff; border: none; border-radius: 8px; color: #fff; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 4px; transition: opacity .2s; }
    .login-btn:hover { opacity: .85; }
    .login-error { color: #ff453a; font-size: 12px; margin-top: 8px; display: none; }

    #themeToggle { position: fixed; right: 14px; bottom: 14px; z-index: 100; width: 30px; height: 30px; border-radius: 50%; border: 1px solid #333; background: #111; color: #888; font-size: 14px; line-height: 1; cursor: pointer; opacity: .55; transition: opacity .2s, color .2s, border-color .2s, background .2s; }
    #themeToggle:hover { opacity: 1; color: #fff; border-color: #fff; }

    body.light-mode { background: #f4f5f7; color: #111; }
    body.light-mode .page-title { color: #111; }
    body.light-mode .back-link { color: #0a84ff; }
    body.light-mode .logout-btn { border-color: #ccc; color: #666; }
    body.light-mode .logout-btn:hover { color: #111; border-color: #111; }
    body.light-mode .cycle-section, body.light-mode .week-section { background: #fff; border-color: #e3e4e8; }
    body.light-mode .cycle-title { color: #111; }
    body.light-mode .cycle-desc { color: #666; }
    body.light-mode .cycle-dates { color: #999; }
    body.light-mode .cycle-edit-btn { border-color: #ccc; color: #777; }
    body.light-mode .cycle-edit-btn:hover { color: #111; border-color: #111; }
    body.light-mode .edit-form { background: #f5f6f8; border-color: #e3e4e8; }
    body.light-mode .edit-input { background: #fff; border-color: #ccc; color: #111; }
    body.light-mode .edit-textarea { background: #fff; border-color: #ccc; color: #111; }
    body.light-mode .cancel-btn { border-color: #ccc; color: #777; }
    body.light-mode .cancel-btn:hover { color: #111; border-color: #111; }
    body.light-mode .week-nav-btn { border-color: #ccc; color: #777; }
    body.light-mode .week-nav-btn:hover { color: #111; border-color: #111; }
    body.light-mode .week-label { color: #666; }
    body.light-mode .day-col { background: #fff; border-color: #e3e4e8; }
    body.light-mode .day-col.today { border-color: #0a84ff55; background: #f0f7ff; }
    body.light-mode .day-col.drag-over { border-color: #0a84ff; background: #e8f4ff; }
    body.light-mode .day-col-header { color: #999; }
    body.light-mode .day-col-date { color: #111; }
    body.light-mode .day-col.today .day-col-header, body.light-mode .day-col.today .day-col-date { color: #0a84ff; }
    body.light-mode .day-task { background: #f5f6f8; border-color: #e3e4e8; }
    body.light-mode .day-task:hover { background: #eceef1; border-color: #d0d2d6; }
    body.light-mode .day-task-text { color: #333; }
    body.light-mode .day-add-input { background: #fff; border-color: #e3e4e8; color: #111; }
    body.light-mode .day-add-btn { border-color: #e3e4e8; color: #999; }
    body.light-mode #themeToggle { background: #fff; border-color: #ccc; color: #666; }
    body.light-mode #themeToggle:hover { color: #111; border-color: #111; }

    @media (max-width: 900px) {
      .week-grid { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 600px) {
      .week-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div id="loginForm">
    <h2>Goals</h2>
    <form id="authForm">
      <div class="login-field"><input type="email" id="authEmail" placeholder="Email" required /></div>
      <div class="login-field"><input type="password" id="authPass" placeholder="Password" required /></div>
      <button type="submit" class="login-btn">Sign in</button>
      <div class="login-error" id="authError"></div>
    </form>
  </div>

  <div id="authGate">
    <div class="header-row">
      <div class="page-title">Goals</div>
      <div class="header-actions">
        <a href="/dashboard/" class="back-link">&larr; Dashboard</a>
        <button class="logout-btn" id="logoutBtn">Sign out</button>
      </div>
    </div>

    <div class="cycle-section">
      <div class="cycle-header">
        <span class="cycle-label macro">Macro Cycle (12 weeks)</span>
        <span class="cycle-dates" id="macroDates"></span>
      </div>
      <div id="macroContent"><div class="empty-cycle">No macro goal set</div></div>
      <div class="edit-form" id="macroForm">
        <div class="edit-row"><span class="edit-label">Title</span><input class="edit-input" id="macroTitle" placeholder="e.g., Launch side project" /></div>
        <textarea class="edit-textarea" id="macroDesc" placeholder="Qualitative goal description..."></textarea>
        <div class="edit-row"><span class="edit-label">Start</span><input class="edit-input" id="macroStart" type="date" /><span class="edit-label" style="width:auto">End</span><input class="edit-input" id="macroEnd" type="date" /></div>
        <div class="edit-actions"><button class="save-btn" id="macroSave">Save</button><button class="cancel-btn" id="macroCancel">Cancel</button><button class="delete-btn hidden" id="macroDelete">Delete</button></div>
      </div>
    </div>

    <div class="cycle-section">
      <div class="cycle-header">
        <span class="cycle-label meso">Meso Cycle (6 weeks)</span>
        <span class="cycle-dates" id="mesoDates"></span>
      </div>
      <div id="mesoContent"><div class="empty-cycle">No meso goal set</div></div>
      <div class="edit-form" id="mesoForm">
        <div class="edit-row"><span class="edit-label">Title</span><input class="edit-input" id="mesoTitle" placeholder="e.g., Build MVP" /></div>
        <textarea class="edit-textarea" id="mesoDesc" placeholder="Qualitative goal description..."></textarea>
        <div class="edit-row"><span class="edit-label">Start</span><input class="edit-input" id="mesoStart" type="date" /><span class="edit-label" style="width:auto">End</span><input class="edit-input" id="mesoEnd" type="date" /></div>
        <div class="edit-actions"><button class="save-btn" id="mesoSave">Save</button><button class="cancel-btn" id="mesoCancel">Cancel</button><button class="delete-btn hidden" id="mesoDelete">Delete</button></div>
      </div>
    </div>

    <div class="cycle-section">
      <div class="cycle-header">
        <span class="cycle-label">Weekly Goal</span>
        <span class="cycle-dates" id="microDates"></span>
      </div>
      <div id="microContent"><div class="empty-cycle">No weekly goal set</div></div>
      <div class="edit-form" id="microForm">
        <div class="edit-row"><span class="edit-label">Title</span><input class="edit-input" id="microTitle" placeholder="e.g., Sprint 1: Foundation" /></div>
        <textarea class="edit-textarea" id="microDesc" placeholder="Qualitative goal description..."></textarea>
        <div class="edit-row"><span class="edit-label">Start</span><input class="edit-input" id="microStart" type="date" /><span class="edit-label" style="width:auto">End</span><input class="edit-input" id="microEnd" type="date" /></div>
        <div class="edit-actions"><button class="save-btn" id="microSave">Save</button><button class="cancel-btn" id="microCancel">Cancel</button><button class="delete-btn hidden" id="microDelete">Delete</button></div>
      </div>
    </div>

    <div class="week-section">
      <div class="cycle-header">
        <span class="cycle-label">Weekly Planner</span>
        <div class="week-nav">
          <button class="week-nav-btn" id="weekPrev">&larr;</button>
          <span class="week-label" id="weekLabel"></span>
          <button class="week-nav-btn" id="weekNext">&rarr;</button>
          <button class="cycle-edit-btn" id="weekToday">Today</button>
        </div>
      </div>
      <div id="weekContent"><div class="no-goal-msg">Set a weekly goal to start planning</div></div>
    </div>
  </div>

  <button id="themeToggle" title="Toggle color scheme">&#9680;</button>

  <script>
    const SUPABASE_URL = "https://heyrtjzntnicqsfemcmi.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhleXJ0anpudG5pY3FzZmVtY21pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3OTU3NDksImV4cCI6MjA5OTM3MTc0OX0.MwivwC-MUgI7J4-bH5ahjuL8YLQYPsR1vzcRVlpoTNo";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const TZ = "America/New_York";
    const DAY_NAMES = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
    const DAY_NAMES_FULL = ["SUNDAY", "MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY"];
    const MONTH_NAMES = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];

    function esc(s) {
      if (s === null || s === undefined) return "";
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function todayEt() { return new Date().toLocaleDateString("en-CA", { timeZone: TZ }); }
    function generateId() {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
      const values = crypto.getRandomValues(new Uint8Array(21));
      return values.reduce((acc, x) => acc + chars[x & 63], "");
    }
    function formatDate(dateStr) {
      if (!dateStr) return "";
      const d = new Date(dateStr + "T12:00:00");
      return MONTH_NAMES[d.getMonth()] + " " + d.getDate();
    }
    function addDays(dateStr, days) {
      const d = new Date(dateStr + "T12:00:00");
      d.setDate(d.getDate() + days);
      return d.toLocaleDateString("en-CA", { timeZone: TZ });
    }
    function getMonday(dateStr) {
      const d = new Date(dateStr + "T12:00:00");
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1);
      d.setDate(diff);
      return d.toLocaleDateString("en-CA", { timeZone: TZ });
    }

    let state = { goals: [], goalTasks: [], microGoal: null, weekOffset: 0 };
    let dragState = { taskId: null, fromDate: null };

    async function loadAll() {
      const [goalsRes, tasksRes] = await Promise.all([
        db.from("goals").select("*").order("created_at", { ascending: false }),
        db.from("goal_tasks").select("*").order("day_date", { ascending: true }),
      ]);
      if (goalsRes.error) throw goalsRes.error;
      if (tasksRes.error) throw tasksRes.error;
      state.goals = goalsRes.data || [];
      state.goalTasks = tasksRes.data || [];
      state.microGoal = state.goals.find(g => g.cycle_type === "micro" && g.status === "active");
    }

    function renderAll() {
      renderCycle("macro");
      renderCycle("meso");
      renderCycle("micro");
      renderWeek();
    }

    function renderCycle(type) {
      const goal = state.goals.find(g => g.cycle_type === type && g.status === "active");
      const contentEl = document.getElementById(type + "Content");
      const datesEl = document.getElementById(type + "Dates");
      const form = document.getElementById(type + "Form");
      const deleteBtn = document.getElementById(type + "Delete");

      if (goal) {
        datesEl.textContent = formatDate(goal.start_date) + " \u2192 " + formatDate(goal.end_date);
        contentEl.innerHTML = '<div class="cycle-title">' + esc(goal.title) + '</div>' +
          (goal.description ? '<div class="cycle-desc">' + esc(goal.description) + '</div>' : '') +
          '<button class="cycle-edit-btn" data-edit-cycle="' + type + '">Edit</button>';
        deleteBtn.classList.remove("hidden");
        contentEl.querySelector("[data-edit-cycle=\"" + type + "\"]").addEventListener("click", function() { openEditForm(type, goal); });
      } else {
        datesEl.textContent = "";
        contentEl.innerHTML = '<div class="empty-cycle">No ' + type + ' goal set</div>' +
          '<button class="add-cycle-btn" data-add-cycle="' + type + '">+ Add ' + type + ' goal</button>';
        deleteBtn.classList.add("hidden");
        contentEl.querySelector("[data-add-cycle=\"" + type + "\"]").addEventListener("click", function() { openEditForm(type, null); });
      }
      form.classList.remove("open");
    }

    function openEditForm(type, goal) {
      var form = document.getElementById(type + "Form");
      var titleEl = document.getElementById(type + "Title");
      var descEl = document.getElementById(type + "Desc");
      var startEl = document.getElementById(type + "Start");
      var endEl = document.getElementById(type + "End");

      if (goal) {
        titleEl.value = goal.title;
        descEl.value = goal.description || "";
        startEl.value = goal.start_date;
        endEl.value = goal.end_date;
      } else {
        titleEl.value = "";
        descEl.value = "";
        var today = todayEt();
        var monday = getMonday(today);
        startEl.value = monday;
        endEl.value = addDays(monday, 6);
      }
      form.classList.add("open");
      titleEl.focus();
    }

    function renderWeek() {
      var el = document.getElementById("weekContent");
      var labelEl = document.getElementById("weekLabel");

      if (!state.microGoal) {
        el.innerHTML = '<div class="no-goal-msg">Set a weekly goal to start planning</div>';
        labelEl.textContent = "";
        return;
      }

      var today = todayEt();
      var monday = getMonday(today);
      var weekStart = addDays(monday, state.weekOffset * 7);
      var weekEnd = addDays(weekStart, 6);

      labelEl.textContent = formatDate(weekStart) + " \u2192 " + formatDate(weekEnd);

      var days = [];
      for (var i = 0; i < 7; i++) {
        var date = addDays(weekStart, i);
        var d = new Date(date + "T12:00:00");
        days.push({
          date: date,
          dayName: DAY_NAMES[d.getDay()],
          dayNum: d.getDate(),
          month: MONTH_NAMES[d.getMonth()],
          isToday: date === today,
        });
      }

      var html = '<div class="week-grid">';
      days.forEach(function(day) {
        var tasks = state.goalTasks.filter(function(t) {
          return t.goal_id === state.microGoal.id && t.day_date === day.date;
        });

        var tasksHtml = tasks.map(function(t) {
          return '<div class="day-task" draggable="true" data-task-id="' + esc(t.id) + '" data-task-date="' + esc(day.date) + '">' +
            '<span class="day-task-text">' + esc(t.description) + '</span>' +
            '<button class="day-task-btn copy" data-copy="' + esc(t.id) + '" title="Copy">&rarr;</button>' +
            '<button class="day-task-btn del" data-del-task="' + esc(t.id) + '" title="Delete">&times;</button>' +
          '</div>';
        }).join("");

        html += '<div class="day-col' + (day.isToday ? ' today' : '') + '" data-day="' + esc(day.date) + '">' +
          '<div class="day-col-header">' + day.dayName + '</div>' +
          '<div class="day-col-date">' + day.dayNum + '</div>' +
          '<div class="day-tasks">' + tasksHtml + '</div>' +
          '<div class="day-add-row">' +
            '<input class="day-add-input" placeholder="Add..." data-add-input="' + esc(day.date) + '" />' +
            '<button class="day-add-btn" data-add-btn="' + esc(day.date) + '">+</button>' +
          '</div>' +
        '</div>';
      });
      html += '</div>';
      el.innerHTML = html;

      el.querySelectorAll("[data-add-input]").forEach(function(input) {
        input.addEventListener("keydown", function(e) {
          if (e.key === "Enter" && input.value.trim()) {
            addGoalTask(input.dataset.addInput, input.value.trim());
            input.value = "";
          }
        });
      });

      el.querySelectorAll("[data-add-btn]").forEach(function(btn) {
        btn.addEventListener("click", function() {
          var input = el.querySelector("[data-add-input=\"" + btn.dataset.addBtn + "\"]");
          if (input && input.value.trim()) {
            addGoalTask(btn.dataset.addBtn, input.value.trim());
            input.value = "";
          }
        });
      });

      el.querySelectorAll("[data-del-task]").forEach(function(btn) {
        btn.addEventListener("click", function(e) {
          e.stopPropagation();
          deleteGoalTask(btn.dataset.delTask);
        });
      });

      el.querySelectorAll("[data-copy]").forEach(function(btn) {
        btn.addEventListener("click", function(e) {
          e.stopPropagation();
          copyGoalTask(btn.dataset.copy);
        });
      });

      var taskEls = el.querySelectorAll(".day-task");
      taskEls.forEach(function(taskEl) {
        taskEl.addEventListener("dragstart", function(e) {
          dragState.taskId = taskEl.dataset.taskId;
          dragState.fromDate = taskEl.dataset.taskDate;
          taskEl.classList.add("dragging");
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData("text/plain", taskEl.dataset.taskId);
        });
        taskEl.addEventListener("dragend", function() {
          taskEl.classList.remove("dragging");
          dragState = { taskId: null, fromDate: null };
          el.querySelectorAll(".day-col").forEach(function(col) { col.classList.remove("drag-over"); });
        });
      });

      el.querySelectorAll(".day-col").forEach(function(col) {
        col.addEventListener("dragover", function(e) {
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
          col.classList.add("drag-over");
        });
        col.addEventListener("dragleave", function() {
          col.classList.remove("drag-over");
        });
        col.addEventListener("drop", function(e) {
          e.preventDefault();
          col.classList.remove("drag-over");
          var taskId = e.dataTransfer.getData("text/plain");
          var toDate = col.dataset.day;
          if (taskId && toDate) {
            moveGoalTask(taskId, toDate);
          }
        });
      });
    }

    async function saveGoal(type, existingId) {
      var title = document.getElementById(type + "Title").value.trim();
      var desc = document.getElementById(type + "Desc").value.trim();
      var start = document.getElementById(type + "Start").value;
      var end = document.getElementById(type + "End").value;
      if (!title || !start || !end) return;

      var now = new Date().toISOString();
      if (existingId) {
        var patch = { title: title, description: desc, start_date: start, end_date: end, updated_at: now };
        await db.from("goals").update(patch).eq("id", existingId);
        var g = state.goals.find(function(x) { return x.id === existingId; });
        if (g) Object.assign(g, patch);
      } else {
        var id = generateId();
        var goal = { id: id, title: title, description: desc, cycle_type: type, start_date: start, end_date: end, status: "active", created_at: now, updated_at: now };
        await db.from("goals").insert(goal);
        state.goals.push(goal);
      }
      if (type === "micro") {
        state.microGoal = state.goals.find(function(g) { return g.cycle_type === "micro" && g.status === "active"; });
      }
      renderAll();
    }

    async function deleteGoal(type) {
      var goal = state.goals.find(function(g) { return g.cycle_type === type && g.status === "active"; });
      if (!goal) return;
      if (!confirm("Delete " + type + ' goal "' + goal.title + '"?')) return;
      await db.from("goals").delete().eq("id", goal.id);
      state.goals = state.goals.filter(function(g) { return g.id !== goal.id; });
      state.goalTasks = state.goalTasks.filter(function(t) { return t.goal_id !== goal.id; });
      if (type === "micro") state.microGoal = null;
      renderAll();
    }

    async function addGoalTask(date, description) {
      var id = generateId();
      var now = new Date().toISOString();
      var task = { id: id, goal_id: state.microGoal.id, day_date: date, description: description, status: "pending", created_at: now, updated_at: now };
      state.goalTasks.push(task);
      renderWeek();
      try { await db.from("goal_tasks").insert(task); } catch (e) {
        state.goalTasks = state.goalTasks.filter(function(t) { return t.id !== id; });
        renderWeek();
        console.error("Add failed:", e);
      }
    }

    async function deleteGoalTask(id) {
      state.goalTasks = state.goalTasks.filter(function(t) { return t.id !== id; });
      renderWeek();
      try { await db.from("goal_tasks").delete().eq("id", id); } catch (e) { console.error("Delete failed:", e); }
    }

    async function copyGoalTask(id) {
      var orig = state.goalTasks.find(function(t) { return t.id === id; });
      if (!orig) return;
      var newDate = addDays(orig.day_date, 1);
      var newId = generateId();
      var now = new Date().toISOString();
      var task = { id: newId, goal_id: orig.goal_id, day_date: newDate, description: orig.description, status: "pending", created_at: now, updated_at: now };
      state.goalTasks.push(task);
      renderWeek();
      try { await db.from("goal_tasks").insert(task); } catch (e) {
        state.goalTasks = state.goalTasks.filter(function(t) { return t.id !== newId; });
        renderWeek();
        console.error("Copy failed:", e);
      }
    }

    async function moveGoalTask(id, newDate) {
      var task = state.goalTasks.find(function(t) { return t.id === id; });
      if (!task || task.day_date === newDate) return;
      task.day_date = newDate;
      renderWeek();
      try { await db.from("goal_tasks").update({ day_date: newDate, updated_at: new Date().toISOString() }).eq("id", id); } catch (e) {
        console.error("Move failed:", e);
      }
    }

    function showGoals() {
      document.getElementById("loginForm").style.display = "none";
      document.getElementById("authGate").style.display = "block";
      refresh();
    }
    function showLogin() {
      document.getElementById("loginForm").style.display = "block";
      document.getElementById("authGate").style.display = "none";
    }
    async function refresh() {
      try { await loadAll(); renderAll(); } catch (e) { console.error("Refresh failed:", e); }
    }

    document.getElementById("authForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      var email = document.getElementById("authEmail").value;
      var pass = document.getElementById("authPass").value;
      var errEl = document.getElementById("authError");
      errEl.style.display = "none";
      var result = await db.auth.signInWithPassword({ email: email, password: pass });
      if (result.error) { errEl.textContent = result.error.message; errEl.style.display = "block"; }
      else { showGoals(); }
    });

    document.getElementById("logoutBtn").addEventListener("click", async function() { await db.auth.signOut(); showLogin(); });

    ["macro", "meso", "micro"].forEach(function(type) {
      document.getElementById(type + "Save").addEventListener("click", function() {
        var goal = state.goals.find(function(g) { return g.cycle_type === type && g.status === "active"; });
        saveGoal(type, goal ? goal.id : null);
      });
      document.getElementById(type + "Cancel").addEventListener("click", function() {
        document.getElementById(type + "Form").classList.remove("open");
      });
      document.getElementById(type + "Delete").addEventListener("click", function() {
        deleteGoal(type);
      });
    });

    document.getElementById("weekPrev").addEventListener("click", function() { state.weekOffset--; renderWeek(); });
    document.getElementById("weekNext").addEventListener("click", function() { state.weekOffset++; renderWeek(); });
    document.getElementById("weekToday").addEventListener("click", function() { state.weekOffset = 0; renderWeek(); });

    document.getElementById("themeToggle").addEventListener("click", function() {
      document.body.classList.toggle("light-mode");
      localStorage.setItem("theme", document.body.classList.contains("light-mode") ? "light" : "dark");
    });
    if (localStorage.getItem("theme") === "light") document.body.classList.add("light-mode");

    db.auth.getSession().then(function(result) {
      if (result.data.session) showGoals(); else showLogin();
    });
  </script>
</body>
</html>
