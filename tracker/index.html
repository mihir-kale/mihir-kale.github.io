<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Planning Tree</title>
    <link rel="stylesheet" crossorigin href="./assets/index-kTQDwIqS.css?v=2">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = "https://heyrtjzntnicqsfemcmi.supabase.co";
      const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhleXJ0anpudG5pY3FzZmVtY21pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3OTU3NDksImV4cCI6MjA5OTM3MTc0OX0.MwivwC-MUgI7J4-bH5ahjuL8YLQYPsR1vzcRVlpoTNo";
      const _db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const _PPT_KEY = "ppt-tree-state";

      window.syncToSupabase = async function(state) {
        try {
          const nodes = state.nodes.map(n => ({
            id: n.id,
            parent_id: n.parentId,
            path: n.path,
            title: n.title,
            description: n.description || "",
            status: n.status || "ready",
            priority: n.priority || "medium",
            order_index: n.orderIndex || 0,
            estimate_minutes: n.estimateMinutes,
            due_date: n.dueDate,
            hidden_today: n.hiddenToday || false,
            recurring: n.recurring || false,
            created_at: n.createdAt,
            updated_at: n.updatedAt
          }));
          if (nodes.length === 0) {
            await _db.from("nodes").delete().neq("id", "__none__");
          } else {
            await _db.from("nodes").upsert(nodes, { onConflict: "id" });
            const ids = nodes.map(n => n.id);
            await _db.from("nodes").delete().not("id", "in", `(${ids.join(",")})`);
          }
        } catch (e) {
          console.error("Sync to Supabase failed:", e);
        }
      };

      window.loadFromSupabase = async function() {
        try {
          const { data, error } = await _db.from("nodes").select("*");
          if (error || !data || data.length === 0) return null;
          return {
            nodes: data.map(n => ({
              id: n.id,
              parentId: n.parent_id,
              path: n.path,
              title: n.title,
              description: n.description,
              status: n.status,
              priority: n.priority,
              orderIndex: n.order_index,
              estimateMinutes: n.estimate_minutes,
              dueDate: n.due_date,
              hiddenToday: n.hidden_today,
              recurring: n.recurring,
              createdAt: n.created_at,
              updatedAt: n.updated_at
            }))
          };
        } catch (e) {
          console.error("Load from Supabase failed:", e);
          return null;
        }
      };

      function showLogin() {
        document.getElementById("loginForm").style.display = "flex";
        document.getElementById("authGate").style.display = "none";
      }

      function showTracker() {
        document.getElementById("authGate").style.display = "block";
        document.getElementById("loginForm").style.display = "none";
        import("./assets/index-CY4Ktyp3.js?v=4");
      }

      document.getElementById("authForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("authEmail").value;
        const pass = document.getElementById("authPass").value;
        const errEl = document.getElementById("authError");
        errEl.style.display = "none";
        const { error } = await _db.auth.signInWithPassword({ email, password: pass });
        if (error) {
          errEl.textContent = error.message;
          errEl.style.display = "block";
        } else {
          showTracker();
        }
      });

      document.getElementById("logoutBtn").addEventListener("click", async () => {
        await _db.auth.signOut();
        showLogin();
      });

      (async () => {
        const { data: { session } } = await _db.auth.getSession();
        if (session) {
          showTracker();
        } else {
          showLogin();
        }
      })();
    </script>
  </head>
  <body>
    <div id="loginForm" style="display:none; min-height:100vh; align-items:center; justify-content:center; background:#000; color:#fff; font-family:Inter, sans-serif;">
      <form id="authForm" style="background:#111; border:1px solid #333; border-radius:12px; padding:32px; width:320px;">
        <h1 style="font-size:18px; margin-bottom:16px;">Sign in to continue</h1>
        <input id="authEmail" type="email" required placeholder="Email" style="width:100%; box-sizing:border-box; margin-bottom:10px; padding:10px; border-radius:6px; border:1px solid #333; background:#000; color:#fff;">
        <input id="authPass" type="password" required placeholder="Password" style="width:100%; box-sizing:border-box; margin-bottom:10px; padding:10px; border-radius:6px; border:1px solid #333; background:#000; color:#fff;">
        <div id="authError" style="display:none; color:#ff6b6b; font-size:13px; margin-bottom:10px;"></div>
        <button type="submit" style="width:100%; padding:10px; border-radius:6px; border:none; background:#4a7cff; color:#fff; cursor:pointer;">Sign in</button>
      </form>
    </div>
    <div id="authGate" style="display:none;">
      <div style="position:fixed; top:0; right:0; z-index:9999; padding:10px;">
        <button id="logoutBtn" style="padding:8px 14px; border-radius:6px; border:1px solid #333; background:#111; color:#fff; cursor:pointer;">Log out</button>
      </div>
      <div id="root"></div>
    </div>
  </body>
</html>
