name: Sync media feeds

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-media-feeds
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sync RSS feeds
        run: node media/scripts/sync_feeds.mjs
      - name: Commit feed updates
        run: |
          if git diff --quiet -- media/data/feeds.json; then
            echo "No feed changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/data/feeds.json
          git commit -m "media: sync RSS feeds"
          git push
