<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard — Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Inter", -apple-system, sans-serif;
      font-weight: 400;
      background: #000;
      color: #fff;
      padding: 24px;
      max-width: 1400px;
      -webkit-font-smoothing: antialiased;
    }

    .date-header {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fff;
    }

    .columns {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
      align-items: start;
    }

    .left-col, .right-col {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .widget {
      background: #111;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 20px;
      text-align: left;
    }

    #workoutContainer .task-due {
      color: #0a84ff;
    }

    .widget h2 {
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #fff;
      margin-bottom: 0;
    }
    .widget h2 a {
      color: inherit;
      text-decoration: none;
    }
    .widget h2 a:hover {
      color: #0a84ff;
    }

    /* Calendar */
    .widget-header { display: flex; align-items: center; justify-content: space-between; }
    .widget-header h2 { margin: 0; }
    .widget-add-btn {
      background: none;
      border: 1px solid #333;
      color: #666;
      font-size: 14px;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color .2s, border-color .2s;
    }
    .widget-add-btn:hover { color: #fff; border-color: #fff; }
    .cal-add-form {
      display: flex;
      gap: 6px;
      padding: 10px 0;
    }
    .cal-add-form input {
      flex: 1;
      padding: 6px 8px;
      border: 1px solid #333;
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
    }
    .cal-add-form input::placeholder { color: #555; }
    .cal-add-form input:focus { outline: none; border-color: #444; }
    .cal-add-submit {
      padding: 6px 12px;
      border: 1px solid #0a84ff;
      border-radius: 6px;
      background: transparent;
      color: #0a84ff;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: background .2s, color .2s;
    }
    .cal-add-submit:hover { background: #0a84ff; color: #000; }
    .calendar-list { list-style: none; max-height: 560px; overflow-y: auto; }

    .cal-day {
      margin-bottom: 16px;
    }

    .cal-day:last-child { margin-bottom: 0; }

    .cal-day-label {
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #fff;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid #1a1a1a;
    }

    .cal-day-label.today { color: #0a84ff; }

    .cal-event {
      padding: 6px 0;
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .cal-event-time {
      font-size: 14px;
      color: #fff;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .cal-event-time.today {
      color: #0a84ff;
    }

    .cal-event-title {
      font-size: 15px;
      color: #fff;
      font-weight: 400;
      flex: 1;
    }

    .cal-event-loc {
      font-size: 12px;
      color: #fff;
      margin-top: 2px;
    }

    /* Tasks */
    .task-parent {
      font-size: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #0a84ff;
      margin-bottom: 6px;
      margin-top: 12px;
    }

    .task-parent:first-child {
      margin-top: 0;
    }

    .task-list { list-style: none; }

    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #1a1a1a;
      cursor: pointer;
      transition: opacity .2s;
    }

    .task-item:hover { opacity: .7; }

    .task-item:last-child { border-bottom: none; }

    .task-check {
      width: 18px;
      height: 18px;
      border: 1.5px solid #444;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .2s;
    }

    .task-item:hover .task-check {
      border-color: #fff;
    }

    .task-check svg {
      width: 10px;
      height: 10px;
      opacity: 0;
      transition: opacity .2s;
    }

    .task-item:hover .task-check svg {
      opacity: .5;
    }

    .task-title { flex: 1; font-size: 14px; font-weight: 400; color: #fff; }

    .task-due {
      font-size: 11px;
      font-weight: 600;
      color: #ff453a;
      white-space: nowrap;
    }

    .task-item.high-priority .task-title { color: #0a84ff; }

    .task-add-btn {
      opacity: 0;
      background: none;
      border: none;
      color: #666;
      font-size: 16px;
      cursor: pointer;
      padding: 0 4px;
      transition: opacity .2s, color .2s;
      flex-shrink: 0;
    }
    .task-item:hover .task-add-btn { opacity: 1; }
    .task-add-btn:hover { color: #fff; }

    .task-dl-btn {
      opacity: 0;
      background: none;
      border: none;
      color: #666;
      font-size: 12px;
      cursor: pointer;
      padding: 0 4px;
      transition: opacity .2s, color .2s;
      flex-shrink: 0;
    }
    .task-item:hover .task-dl-btn { opacity: 1; }
    .task-dl-btn:hover { color: #ff453a; }

    .task-dl-popup {
      position: fixed;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 8px;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(0,0,0,.5);
    }
    .task-dl-popup input[type="text"] {
      background: var(--bg);
      color: var(--text);
      border: 1px solid #333;
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 13px;
      font-family: inherit;
      width: 60px;
    }
    .task-dl-popup input[type="text"]:focus { outline: none; border-color: #444; }
    .task-dl-popup button {
      background: none;
      border: none;
      color: #666;
      font-size: 14px;
      cursor: pointer;
      padding: 2px 4px;
    }
    .task-dl-popup button:hover { color: #fff; }

    .task-child-input {
      display: flex;
      gap: 6px;
      padding: 6px 0 6px 32px;
    }
    .task-child-input input {
      flex: 1;
      padding: 6px 8px;
      border: 1px solid #333;
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
    }
    .task-child-input input::placeholder { color: #666; }
    .task-child-input input:focus { outline: none; border-color: #444; }

    .empty-state {
      padding: 40px 20px;
      color: #fff;
      font-size: 13px;
    }

    .loading {
      padding: 8px 0;
      color: #fff;
      font-size: 13px;
    }

    /* Strava */
    .stat-row {
      display: flex;
      gap: 12px;
      margin-top: 12px;
    }

    .stat-box {
      flex: 1;
      background: #1a1a1a;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 600;
      color: #fff;
    }

    .stat-unit {
      font-size: 11px;
      color: #fff;
      margin-top: 2px;
    }

    .last-run {
      background: #1a1a1a;
      border-radius: 8px;
      padding: 14px;
    }

    .last-run-name {
      font-size: 14px;
      font-weight: 500;
      color: #fff;
      margin-bottom: 6px;
    }

    .last-run-meta {
      font-size: 12px;
      color: #fff;
      display: flex;
      gap: 12px;
    }

    .pr-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #1a1a1a;
    }

    .pr-item:last-child { border-bottom: none; }

    .pr-name {
      font-size: 13px;
      color: #fff;
    }

    .pr-weight {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
    }

    /* Workout Card */
    .workout-card {
      background: #111;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #222;
      margin-top: 8px;
    }

    .workout-card-header {
      padding: 16px 18px 12px;
      background: linear-gradient(135deg, #0a84ff22 0%, #0a84ff0a 100%);
      border-bottom: 1px solid #1e1e1e;
    }

    .workout-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .workout-card-title {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
    }

    .workout-card-badge {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: 3px 8px;
      border-radius: 6px;
      background: #0a84ff28;
      color: #0a84ff;
    }

    .workout-card-badge.strength { background: #0a84ff20; color: #0a84ff; }
    .workout-card-badge.cardio   { background: #0a84ff20; color: #0a84ff; }
    .workout-card-badge.run      { background: #0a84ff20; color: #0a84ff; }

    .workout-card-date {
      font-size: 12px;
      color: #666;
      margin-top: 2px;
    }

    .workout-card-exercises {
      padding: 6px 0;
    }

    .workout-card-exercise {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px;
      border-bottom: 1px solid #1a1a1a;
    }

    .workout-card-exercise:last-child { border-bottom: none; }

    .workout-card-exercise-name {
      font-size: 13px;
      color: #fff;
      font-weight: 400;
    }

    .workout-card-exercise-detail {
      font-size: 12px;
      color: #888;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .workout-card-rest {
      padding: 16px 18px;
      font-size: 13px;
      color: #666;
      font-style: italic;
    }

    @media (max-width: 900px) {
      .columns {
        grid-template-columns: 1fr;
      }
    }

    /* Nutrition widget */
    .nutrition-widget { padding: 0; }
    .nutrition-header { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 16px 18px 8px; }
    .nutrition-header h2 { margin: 0; }
    .nutrition-total { font-size: 13px; color: #0a84ff; font-weight: 500; }
    .chevron { font-size: 14px; transition: transform 0.2s; color: var(--text); }
    .nutrition-widget.collapsed .nutrition-header { padding-bottom: 16px; }
    .nutrition-widget.collapsed .chevron { transform: rotate(-90deg); }
    .nutrition-body { overflow: hidden; max-height: 200px; transition: max-height 0.2s ease, padding 0.2s ease; padding: 0 18px 14px; }
    .nutrition-widget.collapsed .nutrition-body { max-height: 0; padding: 0 18px 0; }
    .nutrition-entry { display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px solid #2a2a2a; font-size: 13px; }
    .nutrition-entry:first-child { border-top: 1px solid #2a2a2a; margin-top: 6px; }
    .nutrition-entry .food-name { font-weight: 500; }
    .nutrition-entry .macros { color: var(--text-muted); }
    .nutrition-empty { color: var(--text-muted); font-size: 13px; margin-top: 8px; }

    .meal-next {
      background: #1a1a1a;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: opacity .2s;
    }
    .meal-next:hover { background: #222; }
    .meal-next.logged { opacity: 0.4; pointer-events: none; }
    .meal-next-check {
      width: 18px;
      height: 18px;
      border: 1.5px solid #444;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .2s;
    }
    .meal-next:hover .meal-next-check { border-color: #fff; }
    .meal-next.logged .meal-next-check { background: #0a84ff; border-color: #0a84ff; }
    .meal-next-check svg {
      width: 10px;
      height: 10px;
      opacity: 0;
      transition: opacity .2s;
    }
    .meal-next:hover .meal-next-check svg { opacity: .5; }
    .meal-next.logged .meal-next-check svg { opacity: 1; }
    .meal-next-info { flex: 1; min-width: 0; }
    .meal-snack { background: none; padding: 0; border-radius: 0; }
    .meal-next-name { font-size: 13px; font-weight: 500; color: #0a84ff; }
    .meal-next-macro { font-size: 12px; color: #0a84ff; margin-top: 2px; }
    .meal-snack .meal-next-info { display: flex; gap: 6px; align-items: center; }
    .meal-snack-name, .meal-snack-cal {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 13px;
      font-family: inherit;
      padding: 0;
      outline: none;
      min-width: 0;
    }
    .meal-snack-name { flex: 1; }
    .meal-snack-name::placeholder, .meal-snack-cal::placeholder { color: #555; }
    .meal-snack-cal { width: 50px; text-align: right; font-variant-numeric: tabular-nums; }

    /* Top bar */
    .header-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 24px; }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .demo-badge {
      background: #0a84ff20;
      color: #0a84ff;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 4px 10px;
      border-radius: 6px;
    }
    /* Pomodoro timer */
    .pomodoro-timer {
      font-size: 48px;
      font-weight: 300;
      text-align: center;
      padding: 16px 0 12px;
      font-variant-numeric: tabular-nums;
    }
    .pomodoro-controls {
      display: flex;
      gap: 8px;
      justify-content: center;
      padding-bottom: 14px;
    }
    .pomodoro-btn {
      background: none;
      border: 1px solid #333;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 12px;
      padding: 6px 16px;
      cursor: pointer;
      transition: color .2s, border-color .2s;
    }
    .pomodoro-btn:hover {
      color: #fff;
      border-color: #fff;
    }

    /* Tour */
    .tour-btn {
      background: none;
      border: 1px solid #333;
      color: #666;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.5px;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: color .2s, border-color .2s;
    }
    .tour-btn:hover { color: #fff; border-color: #fff; }
    .tour-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      pointer-events: none;
    }
    .tour-overlay.active { pointer-events: auto; }
    .tour-mask {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.72);
      z-index: 1000;
      transition: opacity .25s;
    }
    .tour-spotlight {
      position: fixed;
      z-index: 1001;
      border-radius: 12px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,.72);
      transition: top .3s ease, left .3s ease, width .3s ease, height .3s ease;
      pointer-events: none;
      display: none;
    }
    .tour-overlay.active .tour-spotlight { display: block; }
    .tour-tooltip {
      position: fixed;
      z-index: 1002;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 20px;
      max-width: 320px;
      color: #fff;
      transition: top .3s ease, left .3s ease, opacity .2s;
    }
    .tour-tooltip.hidden { opacity: 0; pointer-events: none; }
    .tour-step-label {
      font-size: 10px;
      font-weight: 600;
      color: #0a84ff;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
    }
    .tour-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .tour-desc {
      font-size: 13px;
      color: #999;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .tour-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .tour-dots {
      display: flex;
      gap: 6px;
    }
    .tour-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #333;
      transition: background .2s;
    }
    .tour-dot.active { background: #0a84ff; }
    .tour-btns { display: flex; gap: 8px; }
    .tour-btn-next, .tour-btn-skip {
      background: none;
      border: none;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 6px;
      transition: background .2s, color .2s;
    }
    .tour-btn-next { background: #0a84ff; color: #fff; }
    .tour-btn-next:hover { background: #0974e6; }
    .tour-btn-skip { color: #666; }
    .tour-btn-skip:hover { color: #fff; }

    .hint-banner {
      background: #0a84ff10;
      border: 1px solid #0a84ff30;
      border-radius: 8px;
      padding: 10px 16px;
      margin-bottom: 20px;
      font-size: 12px;
      color: #0a84ff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hint-banner a { color: #0a84ff; text-decoration: underline; text-underline-offset: 2px; }
    .hint-banner a:hover { color: #fff; }

  </style>
</head>
<body>

  <div class="header-row">
    <div class="date-header" id="dateHeader"></div>
    <div class="header-actions">
      <button class="tour-btn" id="tourBtn">Replay Tour</button>
      <span class="demo-badge">Demo</span>
    </div>
  </div>

  <div class="hint-banner">
    This is a live demo — click <a href="/training/">Training</a> and <a href="/tracker-demo/">Tasks</a> to explore the full apps.
  </div>

  <div class="columns">
  <div class="left-col">
    <section class="widget">
      <div class="widget-header">
        <h2>Calendar</h2>
        <button class="widget-add-btn" id="calAddBtn" aria-label="Add event">+</button>
      </div>
      <div id="calAddForm" class="cal-add-form" style="display:none">
        <input type="text" id="calTitle" placeholder="Title" />
        <input type="date" id="calDate" />
        <input type="time" id="calTime" />
        <button class="cal-add-submit" id="calAddSubmit">Add</button>
      </div>
      <div id="calendarContainer" class="loading">Loading...</div>
    </section>

    <section class="widget pomodoro-widget" id="pomodoroWidget">
      <h2>Pomodoro</h2>
      <div class="pomodoro-timer" id="pomodoroTimer">25:00</div>
      <div class="pomodoro-controls">
        <button class="pomodoro-btn" id="pomodoroStart">Start</button>
        <button class="pomodoro-btn" id="pomodoroPause" style="display:none">Pause</button>
        <button class="pomodoro-btn" id="pomodoroReset">Reset</button>
      </div>
    </section>
  </div>

  <section class="widget">
    <h2><a href="/tracker-demo/">Tasks</a></h2>
    <div id="tasksContainer" class="loading">Loading...</div>
  </section>

  <div class="right-col">
    <section class="widget">
      <h2><a href="/training/">Training</a></h2>
      <div id="workoutContainer" class="loading">Loading...</div>
      <div id="stravaContainer"></div>
    </section>

    <section class="widget nutrition-widget collapsed">
      <div class="nutrition-header" id="nutritionToggle">
        <h2>Nutrition</h2>
        <span class="nutrition-total" id="nutritionTotal"></span>
        <span class="chevron" id="nutritionChevron">&#9662;</span>
      </div>
      <div class="nutrition-body" id="nutritionBody">
        <div id="mealQueue"></div>
      </div>
    </section>
  </div>
</div>

  <script>
    /* ── Utilities ─────────────────────────────────── */
    const SUPABASE_URL = "https://heyrtjzntnicqsfemcmi.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhleXJ0anpudG5pY3FzZmVtY21pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3OTU3NDksImV4cCI6MjA5OTM3MTc0OX0.MwivwC-MUgI7J4-bH5ahjuL8YLQYPsR1vzcRVlpoTNo";

    /* ── Calendar ──────────────────────────────────── */
    function renderCalendar(events) {
      const el = document.getElementById("calendarContainer");
      const today = todayEt();
      const cutoff = new Date(today + "T12:00:00");
      cutoff.setDate(cutoff.getDate() + 5);
      const cutoffStr = cutoff.toISOString().slice(0, 10);

      const filtered = events.filter(ev => {
        const date = ev.start.slice(0, 10);
        return date >= today && date <= cutoffStr;
      });

      if (!filtered.length) {
        el.innerHTML = '<div class="empty-state">No upcoming events</div>';
        return;
      }

      const grouped = {};
      filtered.forEach(ev => {
        const date = ev.start.slice(0, 10);
        if (!grouped[date]) grouped[date] = [];
        grouped[date].push(ev);
      });

      el.innerHTML = '<ul class="calendar-list">' + Object.entries(grouped).map(([date, evts]) => {
        const d = new Date(date + "T12:00:00");
        const isToday = date === today;
        const label = `${DAY_NAMES[d.getDay()]}, ${d.getDate()} ${MONTH_NAMES[d.getMonth()]}`;

        const items = evts.map(ev => {
          const startTime = new Date(ev.start);
          const timeStr = ev.allDay ? "All day" : startTime.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZone: "America/New_York" });
          const timeClass = isToday ? "cal-event-time today" : "cal-event-time";
          const loc = ev.location ? `<div class="cal-event-loc">${esc(ev.location)}</div>` : "";
          return `<div class="cal-event">
            <span class="${timeClass}">${esc(timeStr)}</span>
            <span class="cal-event-title">${esc(ev.title)}</span>
          </div>${loc ? `<div style="padding-left:68px">${loc}</div>` : ""}`;
        }).join("");

        return `<li class="cal-day">
          <div class="cal-day-label${isToday ? " today" : ""}">${label}${isToday ? " — TODAY" : ""}</div>
          ${items}
        </li>`;
      }).join("") + "</ul>";
    }

      const end = time ? `${padDate}T${String(parseInt(time.slice(0,2)) + 1).padStart(2,"0")}${time.slice(3)}00` : `${padDate}T100000`;

      const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${start}/${end}&ctz=America/New_York`;

    function renderDate() {
      const now = new Date();
      const day = now.getDate();
      const suffix = (d) => {
        if (d > 3 && d < 21) return "TH";
        switch (d % 10) {
          case 1: return "ST";
          case 2: return "ND";
          case 3: return "RD";
          default: return "TH";
        }
      };
      document.getElementById("dateHeader").textContent =
        `${DAY_NAMES_FULL[now.getDay()]}, ${day}${suffix(day)} ${MONTH_NAMES_FULL[now.getMonth()]}`;
    }

    function formatDate(dateStr) {

    /* ── Tasks ────────────────────────────────────── */
    function renderTasks(grouped) {
      const el = document.getElementById("tasksContainer");
      const totalTasks = Object.values(grouped).reduce((s, arr) => s + arr.length, 0);

      if (!totalTasks) {
        el.innerHTML = '<div class="empty-state">All clear</div>';
        return;
      }

      let html = "";
      for (const [parent, tasks] of Object.entries(grouped)) {
        if (parent) {
          html += `<div class="task-parent">${esc(parent)}</div>`;
        }
        html += '<ul class="task-list">' + tasks.map(t => {
          const daysUntil = t.due_date ? Math.ceil((new Date(t.due_date + "T00:00:00") - new Date(todayEt() + "T00:00:00")) / 86400000) : null;
          const priorityClass = t.priority === "high" ? "high-priority" : "";
          return `<li class="task-item ${priorityClass}" data-id="${esc(t.id)}" role="button" tabindex="0" aria-label="Complete task: ${esc(t.title)}">
            <div class="task-check">
              <svg viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2">
                <polyline points="2 6 5 9 10 3"/>
              </svg>
            </div>
            <span class="task-title">${esc(t.title)}</span>
            ${daysUntil !== null ? `<span class="task-due">${daysUntil}</span>` : ""}
            <button class="task-dl-btn" data-task-id="${esc(t.id)}" data-due="${esc(t.due_date || "")}" aria-label="Set deadline for ${esc(t.title)}">&#128197;</button>
            <button class="task-add-btn" data-parent-id="${esc(t.id)}" aria-label="Add subtask to ${esc(t.title)}">+</button>
          </li>`;
        }).join("") + "</ul>";
      }

      el.innerHTML = html;

      el.querySelectorAll(".task-item").forEach(item => {
        item.addEventListener("click", (e) => {
          if (e.target.closest(".task-add-btn") || e.target.closest(".task-dl-btn") || e.target.closest(".task-dl-popup")) return;
          completeTask(item.dataset.id, item);
        });
        item.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            completeTask(item.dataset.id, item);
          }
        });
      });

      el.querySelectorAll(".task-dl-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const existing = el.querySelector(".task-dl-popup");
          if (existing) { existing.remove(); return; }
          const taskId = btn.dataset.taskId;
          const li = btn.closest(".task-item");
          const due = btn.dataset.due || "";
          const mmdd = due ? due.slice(5).replace("-", "/") : "";
          const popup = document.createElement("div");
          popup.className = "task-dl-popup";
          popup.innerHTML = `<input type="text" value="${mmdd}" placeholder="mm/dd" maxlength="5" /><button class="task-dl-clear" title="Clear deadline">&times;</button>`;
          li.appendChild(popup);
          const rect = btn.getBoundingClientRect();
          popup.style.top = (rect.bottom + 4) + "px";
          popup.style.left = rect.left + "px";
          const dateInput = popup.querySelector("input");
          dateInput.focus();
          const save = (val) => {
            let iso = null;
            if (val && /^\d{1,2}\/\d{1,2}$/.test(val)) {
              const [m, d] = val.split("/").map(Number);
              const y = new Date().getFullYear();
              iso = `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
            }
            const task = demoTasks.find(t => t.id === taskId);
            if (task) task.due_date = iso;
            loadTasks();
          };
          dateInput.addEventListener("keydown", (ev) => { ev.stopPropagation(); if (ev.key === "Enter") { save(dateInput.value); popup.remove(); } if (ev.key === "Escape") popup.remove(); });
          dateInput.addEventListener("blur", () => { setTimeout(() => { if (popup.parentNode) { save(dateInput.value); popup.remove(); } }, 150); });
          popup.querySelector(".task-dl-clear").addEventListener("click", (ev) => { ev.stopPropagation(); save(null); popup.remove(); });
          const close = (ev) => { if (!popup.contains(ev.target) && ev.target !== btn) { popup.remove(); document.removeEventListener("click", close); } };
          setTimeout(() => document.addEventListener("click", close), 0);
        });
      });

      el.querySelectorAll(".task-add-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const existing = el.querySelector(".task-child-input");
          if (existing) existing.remove();
          const li = btn.closest(".task-item");
          const inputRow = document.createElement("div");
          inputRow.className = "task-child-input";
          inputRow.innerHTML = `<input type="text" placeholder="Add subtask..." autofocus />`;
          li.after(inputRow);
          const input = inputRow.querySelector("input");
          input.focus();
          const save = () => {
            const title = input.value.trim();
            if (title) {
              const newId = "demo-" + Math.random().toString(36).slice(2, 9);
              demoTasks.push({ id: newId, parent_id: btn.dataset.parentId, title, status: "ready", priority: "medium", due_date: null });
              loadTasks();
            } else {
              inputRow.remove();
            }
          };
          input.addEventListener("keydown", (ev) => { ev.stopPropagation(); if (ev.key === "Enter") { save(); } if (ev.key === "Escape") inputRow.remove(); });
          input.addEventListener("blur", () => { setTimeout(() => { if (inputRow.parentNode) save(); }, 150); });
        });
      });
    }

    function completeTask(id, item) {
      item.style.opacity = "0.4";
      item.style.pointerEvents = "none";
      setTimeout(() => item.remove(), 300);
    }

    function loadTasks() {
      const today = todayEt();
      const byId = {};
      demoTasks.forEach(n => byId[n.id] = n);

      const childCount = {};
      demoTasks.forEach(n => {
        if (n.parent_id && n.status !== "done") childCount[n.parent_id] = (childCount[n.parent_id] || 0) + 1;
      });

      const pending = demoTasks
        .filter(n => n.status !== "done" && !childCount[n.id])
        .sort((a, b) => {
          if (a.due_date && b.due_date) return a.due_date.localeCompare(b.due_date);
          if (a.due_date) return -1;
          if (b.due_date) return 1;
          return 0;
        });

      const grouped = {};
      pending.forEach(n => {
        const parent = n.parent_id && byId[n.parent_id] ? byId[n.parent_id].title : null;
        if (!grouped[parent || ""]) grouped[parent || ""] = [];
        grouped[parent || ""].push(n);
      });

      renderTasks(grouped);
    }

    /* ── Strava / Training Stats ──────────────────── */
    function getWeekBounds() {
      const end = new Date();
      end.setHours(23, 59, 59, 999);
      const start = new Date(end);
      start.setDate(end.getDate() - 6);
      start.setHours(0, 0, 0, 0);
      return { start, end };
    }

    function renderStrava(data) {
      const el = document.getElementById("stravaContainer");
      const { cardio, workouts } = data;

      const { start, end } = getWeekBounds();
      const weekCardio = cardio.filter(a => {
        const d = new Date(a.date + "T00:00:00");
        return d >= start && d <= end;
      });
      const totalKm = weekCardio.reduce((s, a) => s + a.distance_km, 0).toFixed(1);

      const weekWorkouts = (workouts || []).filter(w => {
        const d = new Date(w.date + "T00:00:00");
        return d >= start && d <= end;
      });
      const totalSets = weekWorkouts.reduce((s, w) =>
        s + (w.exercises || []).reduce((ss, ex) => ss + (ex.sets || 0), 0), 0);
      const totalVolume = weekWorkouts.reduce((s, w) =>
        s + (w.exercises || []).reduce((ss, ex) => ss + (ex.sets || 0) * (ex.reps || 0) * (ex.weight_kg || 0), 0), 0);

      el.innerHTML = `
        <div class="stat-row">
          <div class="stat-box">
            <div class="stat-value">${totalKm}</div>
            <div class="stat-unit">KM</div>
          </div>
          <div class="stat-box">
            <div class="stat-value">${Math.round(totalVolume * 2.20462).toLocaleString()}</div>
            <div class="stat-unit">VOLUME (lbs)</div>
          </div>
          <div class="stat-box">
            <div class="stat-value">${totalSets}</div>
            <div class="stat-unit">SETS</div>
          </div>
        </div>
      `;
    }

    async function loadStrava() {
      try {
        const [actRes, wktRes] = await Promise.all([
          db.from("strava_activities").select("activity_date, distance_km"),
          db.from("strava_workouts").select("id, workout_date, strava_exercises(name, sets, reps, weight_kg)")
        ]);

        const cardio = (actRes.data || []).map(a => ({ date: a.activity_date, distance_km: a.distance_km }));
        const workouts = (wktRes.data || []).map(w => ({
          date: w.workout_date,
          exercises: (w.strava_exercises || []).map(ex => ({
            name: ex.name, sets: ex.sets, reps: ex.reps, weight_kg: ex.weight_kg,
          })),
        }));

        renderStrava({ cardio, workouts });
      } catch (e) {
        document.getElementById("stravaContainer").innerHTML =
          '<div class="empty-state">No data yet</div>';
      }
    }

    /* ── Workout Card ─────────────────────────────── */
    async function loadWorkout() {
      const el = document.getElementById("workoutContainer");
      try {
        const today = todayEt();
        const { data: workouts, error } = await db.from("planned_workouts")
          .select("id, title, workout_date, workout_type")
          .gte("workout_date", today)
          .order("workout_date", { ascending: true })
          .limit(1);

        if (error) throw error;
        if (!workouts || !workouts.length) {
          el.innerHTML = '<div class="empty-state">No workouts planned</div>';
          return;
        }

        const typeColors = { run: "#0a84ff", strength: "#0a84ff", rest: "#555" };
        const w = workouts[0];
        const { data: exercises } = await db.from("planned_exercises")
          .select("name, sets, reps, target_weight_kg, order_index")
          .eq("workout_id", w.id)
          .order("order_index", { ascending: true });

        const d = new Date(w.workout_date + "T12:00:00");
        const dateStr = w.workout_date === today ? "Today" : `${d.getDate()} ${MONTH_NAMES[d.getMonth()]}`;
        const color = typeColors[w.workout_type] || "#0a84ff";

        let detailRows = "";
        if (w.workout_type === "rest") {
          detailRows = '<div style="padding:2px 0 2px 30px;font-size:13px;color:#555;font-style:italic">Active recovery</div>';
        } else if (w.workout_type === "run") {
          detailRows = `<div style="padding:2px 0 2px 30px;display:flex;justify-content:space-between">
            <span style="color:#ccc;font-size:13px">Run</span>
            <span style="color:#888;font-size:13px">${esc(w.title.replace(/^Run\s*/i, ""))}</span>
          </div>`;
        } else if (exercises && exercises.length) {
          detailRows = exercises.map(ex => {
            let detail = "";
            if (w.workout_type === "run") {
              detail = ex.name || "";
            } else {
              const setsReps = ex.sets && ex.reps ? `${ex.sets}×${ex.reps}` : ex.sets ? `${ex.sets} sets` : "";
              const weight = ex.target_weight_kg ? ` · ${ex.target_weight_kg}kg` : "";
              detail = setsReps + weight;
            }
            return `<div class="workout-card-exercise" style="padding:2px 0 2px 30px">
              <span class="workout-card-exercise-name" style="color:#ccc;font-size:13px">${esc(ex.name)}</span>
              <span class="workout-card-exercise-detail" style="color:#888;font-size:13px">${esc(detail)}</span>
            </div>`;
          }).join("");
        }

        el.innerHTML = `
          <ul class="task-list">
            <li class="task-item">
              <div class="task-check" style="border-color:${color}">
                <svg viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2">
                  <polyline points="2 6 5 9 10 3"/>
                </svg>
              </div>
              <span class="task-title">${esc(w.workout_type === "run" ? "Run" : w.title)}</span>
              <span class="task-due">${dateStr}</span>
            </li>
          </ul>
          ${detailRows}
        `;
      } catch (e) {
        console.error("Failed to load workout:", e);
        el.innerHTML = '<div class="empty-state">Failed to load</div>';
      }
    }

            <input type="text" class="meal-snack-cal" placeholder="cal" />
          </div>
        </div>`;

      queueEl.innerHTML = html;

      for (const m of upcoming) {
        queueEl.querySelector(`.meal-next[data-id="${m.id}"]`).addEventListener("click", () => logPlannedMeal(m));
      }

      const snackCard = queueEl.querySelector(".meal-snack");
      snackCard.addEventListener("click", (e) => {
        if (e.target.tagName === "INPUT") return;
        logSnack(snackCard);
      });
      snackCard.querySelector(".meal-snack-cal").addEventListener("keydown", (e) => {
        if (e.key === "Enter") logSnack(snackCard);
      });
    }

    function logPlannedMeal(meal) {
      const card = document.querySelector(`.meal-next[data-id="${meal.id}"]`);
      if (card) card.classList.add("logged");
      demoNutritionLog.push({ food_name: meal.food_name, calories: meal.calories });
      const m = demoMeals.find(x => x.id === meal.id);
      if (m) m.logged = true;
      setTimeout(() => loadNutrition(), 300);
    }

    function logSnack(card) {
      const nameEl = card.querySelector(".meal-snack-name");
      const calEl = card.querySelector(".meal-snack-cal");
      const name = nameEl.value.trim() || "Snack";
      const cal = parseInt(calEl.value.trim(), 10);
      if (isNaN(cal) || cal <= 0) return;
      card.classList.add("logged");
      demoNutritionLog.push({ food_name: name, calories: cal });
      setTimeout(() => loadNutrition(), 300);
    }

    /* ── Pomodoro timer ─────────────────────────── */
    const pomodoroTimer = document.getElementById("pomodoroTimer");
    const pomodoroStart = document.getElementById("pomodoroStart");
    const pomodoroPause = document.getElementById("pomodoroPause");
    const pomodoroReset = document.getElementById("pomodoroReset");

    let pomodoroInterval = null;
    let pomodoroSeconds = 25 * 60;

    function updatePomodoroDisplay() {
      const m = Math.floor(pomodoroSeconds / 60);
      const s = pomodoroSeconds % 60;
      pomodoroTimer.textContent = String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
    }

    function pomodoroTick() {
      if (pomodoroSeconds <= 0) {
        clearInterval(pomodoroInterval);
        pomodoroInterval = null;
        pomodoroStart.style.display = "";
        pomodoroPause.style.display = "none";
        pomodoroTimer.textContent = "00:00";
        return;
      }
      pomodoroSeconds--;
      updatePomodoroDisplay();
    }

    pomodoroStart.addEventListener("click", () => {
      if (pomodoroSeconds <= 0) return;
      pomodoroStart.style.display = "none";
      pomodoroPause.style.display = "";
      pomodoroInterval = setInterval(pomodoroTick, 1000);
    });

    pomodoroPause.addEventListener("click", () => {
      clearInterval(pomodoroInterval);
      pomodoroInterval = null;
      pomodoroStart.style.display = "";
      pomodoroPause.style.display = "none";
    });

    pomodoroReset.addEventListener("click", () => {
      clearInterval(pomodoroInterval);
      pomodoroInterval = null;
      pomodoroSeconds = 25 * 60;
      updatePomodoroDisplay();
      pomodoroStart.style.display = "";
      pomodoroPause.style.display = "none";
    });

    /* ── Init ──────────────────────────────────────── */
    renderDate();
    loadTasks();
    loadStrava();
    renderCalendar(getDummyCalendarEvents());
    loadWorkout();
    loadNutrition();

    /* ── Tour ──────────────────────────────────────── */
    (function() {
      const steps = [
        { sel: ".left-col .widget:first-child", title: "Calendar", desc: "5-day event view synced with your Google Calendar. Add events inline — they persist in local storage." },
        { sel: "#tasksContainer", title: "Tasks", desc: "Hierarchical task planner with checkboxes and priority levels. Click through to the full tracker app." },
        { sel: ".right-col .widget:first-child", title: "Training", desc: "Next scheduled workout and weekly Strava stats. Data pulled live from Supabase — running, lifting, and cardio." },
        { sel: ".nutrition-widget", title: "Nutrition", desc: "Meal queue with calorie targets. Log planned meals with one tap, or quick-add snacks from the library." },
        { sel: "#pomodoroWidget", title: "Pomodoro", desc: "25-minute focus timer. Always visible, no dependencies — start a session anytime." },
      ];

      const overlay = document.createElement("div");
      overlay.className = "tour-overlay";
      overlay.innerHTML = `<div class="tour-spotlight" id="tourSpotlight"></div><div class="tour-tooltip hidden" id="tourTooltip"><div class="tour-step-label" id="tourLabel"></div><div class="tour-title" id="tourTitle"></div><div class="tour-desc" id="tourDesc"></div><div class="tour-controls"><div class="tour-dots" id="tourDots"></div><div class="tour-btns"><button class="tour-btn-skip" id="tourSkip">Skip</button><button class="tour-btn-next" id="tourNext">Next</button></div></div></div>`;
      document.body.appendChild(overlay);

      const spotlight = document.getElementById("tourSpotlight");
      const tooltip = document.getElementById("tourTooltip");
      const label = document.getElementById("tourLabel");
      const title = document.getElementById("tourTitle");
      const desc = document.getElementById("tourDesc");
      const dotsEl = document.getElementById("tourDots");
      const skipBtn = document.getElementById("tourSkip");
      const nextBtn = document.getElementById("tourNext");
      let current = 0;

      dotsEl.innerHTML = steps.map((_, i) => `<div class="tour-dot" data-i="${i}"></div>`).join("");

      function position() {
        const el = document.querySelector(steps[current].sel);
        if (!el) return;
        const r = el.getBoundingClientRect();
        const pad = 10;
        spotlight.style.top = (r.top - pad) + "px";
        spotlight.style.left = (r.left - pad) + "px";
        spotlight.style.width = (r.width + pad * 2) + "px";
        spotlight.style.height = (r.height + pad * 2) + "px";

        tooltip.classList.remove("hidden");
        const tw = 320;
        let tx = r.right + 16;
        if (tx + tw > window.innerWidth - 16) tx = r.left - tw - 16;
        if (tx < 16) tx = Math.max(16, (r.left + r.width / 2) - tw / 2);
        let ty = r.top;
        if (ty + 200 > window.innerHeight) ty = window.innerHeight - 216;
        if (ty < 16) ty = 16;
        tooltip.style.left = tx + "px";
        tooltip.style.top = ty + "px";
      }

      function render() {
        label.textContent = `Step ${current + 1} of ${steps.length}`;
        title.textContent = steps[current].title;
        desc.textContent = steps[current].desc;
        nextBtn.textContent = current === steps.length - 1 ? "Done" : "Next";
        dotsEl.querySelectorAll(".tour-dot").forEach((d, i) => d.classList.toggle("active", i === current));
        position();
      }

      function startTour() {
        current = 0;
        overlay.classList.add("active");
        render();
      }

      function endTour() {
        overlay.classList.remove("active");
        tooltip.classList.add("hidden");
        localStorage.setItem("dashboard_tour_done", "1");
      }

      nextBtn.addEventListener("click", () => {
        if (current < steps.length - 1) { current++; render(); }
        else endTour();
      });
      skipBtn.addEventListener("click", endTour);
      document.getElementById("tourBtn").addEventListener("click", startTour);

      window.addEventListener("resize", () => { if (overlay.classList.contains("active")) position(); });

      if (!localStorage.getItem("dashboard_tour_done")) {
        setTimeout(startTour, 600);
      }
    })();
  </script>
</body>
</html>
