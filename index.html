  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    h1 { all: unset; }
    body {
      font-family: "Inter", -apple-system, sans-serif;
      background: #000;
      color: #888;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      text-align: center;
      padding: 48px 40px;
    }
    .photo-ring {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, #0a84ff, #5e5ce6, #bf5af2);
      margin: 0 auto 28px;
    }
    .photo-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 85%;
      display: block;
      border: 3px solid #000;
    }
    h1 {
      font-size: 14px;
      font-weight: 400;
      margin-bottom: 6px;
      color: inherit;
    }
    .subtitle {
      font-size: 14px;
      margin-bottom: 24px;
      color: inherit;
    }
    .links {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }
    .links a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: inherit;
      text-decoration: none;
      font-size: 14px;
      font-weight: 400;
      transition: color .2s;
    }
    .links a:hover { color: #fff; }
    .links a svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }
    .divider {
      width: 40px;
      height: 1px;
      background: #222;
      margin: 28px auto;
    }
    .demos {
      font-size: 14px;
      color: inherit;
    }
    .demos a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 2px;
      transition: color .2s;
    }
    .demos a:hover { color: #fff; }
  </style>
</head>
