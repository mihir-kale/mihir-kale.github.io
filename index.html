<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mihir kale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Inter", -apple-system, sans-serif;
      background: #000;
      color: #888;
      font-size: 12px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .photo-ring {
      position: absolute;
      left: 33.33%;
      top: 40%;
      transform: translate(-50%, -50%);
      width: 150px;
      height: 150px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, #0a84ff, #5e5ce6, #bf5af2);
    }
    .photo-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 85%;
      display: block;
      border: 3px solid #000;
    }
    .text-block {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translateY(-50%);
    }
    h1 {
      font-size: 14px;
      font-weight: 400;
      color: inherit;
      margin-bottom: 12px;
    }
    .subtitle {
      font-size: 14px;
      color: inherit;
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .links {
      font-size: 12px;
      color: inherit;
      display: flex;
      flex-direction: row;
      gap: 16px;
      margin-bottom: 20px;
    }
    .links a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 2px;
      transition: color .2s;
    }
    .links a:hover { color: #fff; }
    .demos {
      font-size: 14px;
      color: inherit;
    }
    .demos a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 2px;
      transition: color .2s;
    }
    .demos a:hover { color: #fff; }
  </style>
</head>
<body>
  <div class="photo-ring">
    <img src="profile.jpg" alt="mihir kale">
  </div>
  <div class="text-block">
    <h1>hi, i'm mihir!</h1>
    <div class="subtitle">📍 swe intern @ siemens<br>📍 cs & business @ unc</div>
    <div class="links">
      <a href="https://linkedin.com/in/mihirpkale" target="_blank" rel="noopener">linkedin</a>
      <a href="https://www.strava.com/athletes/michelobkultra" target="_blank" rel="noopener">strava</a>
      <a href="https://github.com/mihir-kale" target="_blank" rel="noopener">github</a>
    </div>
    <div class="demos">
      <span>here to see the dashboard demo?: <a href="/dashboard-demo/">click here</a></span>
    </div>
  </div>
</body>
</html>
