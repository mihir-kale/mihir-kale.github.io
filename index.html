<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mihir Kale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Inter", -apple-system, sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      text-align: center;
      padding: 48px 40px;
    }
    .photo-ring {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, #0a84ff, #5e5ce6, #bf5af2);
      margin: 0 auto 28px;
    }
    .photo-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 3px solid #000;
    }
    h1 {
      font-size: 24px;
      font-weight: 500;
      letter-spacing: -0.3px;
      margin-bottom: 24px;
    }
    .links {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }
    .links a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #888;
      text-decoration: none;
      font-size: 14px;
      font-weight: 400;
      transition: color .2s;
    }
    .links a:hover { color: #fff; }
    .links a svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }
    .divider {
      width: 40px;
      height: 1px;
      background: #222;
      margin: 28px auto;
    }
    .demos {
      display: flex;
      gap: 20px;
      justify-content: center;
    }
    .demos a {
      color: #444;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 0.5px;
      transition: color .2s;
    }
    .demos a:hover { color: #0a84ff; }
  </style>
</head>
<body>
  <div class="card">
    <div class="photo-ring">
      <img src="profile.jpg" alt="Mihir Kale">
    </div>
    <h1>Hi, I'm Mihir!</h1>
    <div class="links">
      <a href="https://linkedin.com/in/mihirpkale" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
        LinkedIn
      </a>
      <a href="https://www.strava.com/athletes/michelobkultra" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M15.387 17.944l-2.089-4.116h-3.065L15.387 24l5.15-10.172h-3.066m-7.008-5.599l2.836 5.598h4.172L10.463 0l-7 13.828h4.169"/></svg>
        Strava
      </a>
    </div>
    <div class="divider"></div>
    <div class="demos">
      <a href="/dashboard-demo/">Dashboard</a>
      <a href="/tracker-demo/">Tasks</a>
      <a href="/training/">Training</a>
    </div>
  </div>
</body>
</html>
