<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mihir kale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Inter", -apple-system, sans-serif;
      background: #000;
      color: #888;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      display: flex;
      align-items: center;
      gap: 5vw;
    }
    .photo-ring {
      width: 15vw;
      height: 15vw;
      min-width: 120px;
      min-height: 120px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, #0a84ff, #5e5ce6, #bf5af2);
      flex-shrink: 0;
    }
    .photo-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 85%;
      display: block;
      border: 4px solid #000;
    }
    h1 {
      font-size: clamp(24px, 1.4vw, 28px);
      font-weight: 400;
      color: inherit;
      margin-bottom: 12px;
    }
    .subtitle {
      font-size: clamp(16px, 1.2vw, 22px);
      color: inherit;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    .links {
      font-size: clamp(16px, 1.2vw, 22px);
      color: inherit;
      display: flex;
      flex-direction: row;
      gap: 24px;
      margin-bottom: 24px;
    }
    .links a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: color .2s;
    }
    .links a:hover { color: #fff; }
    .demos {
      font-size: clamp(16px, 1.2vw, 22px);
      color: inherit;
    }
    .demos a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: color .2s;
    }
    .demos a:hover { color: #fff; }
    @media (max-width: 640px) {
      .container {
        flex-direction: column;
        align-items: flex-start;
        padding: 40px 24px;
      }
      .links {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="photo-ring">
      <img src="profile.jpg" alt="mihir kale">
    </div>
    <div class="text-block">
      <h1>hi, i'm mihir!</h1>
      <div class="subtitle">📍 swe intern @ siemens<br>📍 swe intern @ john locke foundation<br>📍 cs & business @ unc</div>
      <div class="links">
        <a href="https://linkedin.com/in/mihirpkale" target="_blank" rel="noopener">linkedin</a>
        <a href="https://www.strava.com/athletes/michelobkultra" target="_blank" rel="noopener">strava</a>
        <a href="https://github.com/mihir-kale" target="_blank" rel="noopener">github</a>
      </div>
      <div class="demos">
        <a href="media/">the commonplace — books · films · music & more</a>
      </div>
    </div>
  </div>
</body>
</html>
