    async function saveCalBlock() {
      const title = $('cTitle').value.trim();
      if (!title) { $('cTitle').focus(); return; }
      const date = $('cDate').value || todayEt();
      const allDay = $('cAllDay').checked;
      const start = allDay ? null : ($('cStart').value || null);
      const end = allDay ? null : ($('cEnd').value || null);
      if (start && end && end <= start) { setError('End time must be after start time.'); return; }
      const rec = {
        title,
        date,
        start_time: start,
        end_time: end,
        all_day: allDay,
        color: calColor,
        location: $('cLocation').value.trim(),
        recur: calRecur || null,
        source: 'manual',
      };
      try {
        if (demoMode) {
          const row = {
            id: editingCalId || nanoid(),
            external_id: null,
            title: rec.title,
            date: rec.date,
            start_time: rec.start_time,
            end_time: rec.end_time,
            allDay: rec.all_day,
            location: rec.location,
            calendar: '',
            color: rec.color,
            recur: rec.recur,
            source: 'manual',
          };
          if (editingCalId) {
            const i = events.findIndex(x => x.id === editingCalId);
            if (i >= 0) events[i] = { ...events[i], ...row };
          } else {
            events.push(row);
          }
          $('calOverlay').classList.remove('open');
          renderEvents();
          showNotice(`Saved "${title}"`);
          return;
        }
        if (editingCalId) {
          const { error } = await client.from('calendar_events').update(rec).eq('id', editingCalId);
          if (error) throw error;
        } else {
          const { error } = await client.from('calendar_events').insert(rec);
          if (error) throw error;
        }
        $('calOverlay').classList.remove('open');
        await loadCalendar();
      } catch (e) {
        setError('Failed to save block: ' + e.message);
      }
    }

    async function deleteCalBlock() {
      if (!editingCalId) return;
      if (demoMode) {
        events = events.filter(x => x.id !== editingCalId);
        $('calOverlay').classList.remove('open');
        renderEvents();
        return;
      }
      try {
        const { error } = await client.from('calendar_events').delete().eq('id', editingCalId);
        if (error) throw error;
        $('calOverlay').classList.remove('open');
        await loadCalendar();
      } catch (e) {
        setError('Failed to delete block: ' + e.message);
      }
    }

    // ---------- Drag task → calendar block ----------
    function fmtHH(h) { return String(h).padStart(2, '0'); }
    function nextHourH() {
      const h = +new Date().toLocaleString('en-US', { timeZone: TZ, hour: 'numeric', hour12: false });
      return h + 1;
    }
    function hourFromDrop(e) {
      const tl = $('calTimeline');
      const grid = tl.querySelector('.tl-grid');
      const r = grid ? grid.getBoundingClientRect() : null;
      if (!r || e.clientY < r.top || e.clientY > r.bottom) return null;
      const relMin = ((e.clientY - r.top) / Math.max(r.height, 1)) * (TL_END - TL_START) * 60;
      return Math.max(TL_START, Math.min(TL_END - 1, TL_START + Math.floor(relMin / 60)));
    }

    function fmtHM(min) {
      return fmtHH(Math.floor(min / 60)) + ':' + String(min % 60).padStart(2, '0');
    }

    async function rescheduleEvent(payload, startH) {
      const durMin = payload.durMin;
      const startMin = startH * 60;
      const endMin = Math.max(startMin + 60, Math.min(startMin + durMin, TL_END * 60));
      const start = fmtHM(startMin);
      const end = fmtHM(endMin);
      if (demoMode) {
        const i = events.findIndex(x => x.id === payload.id);
        if (i >= 0) {
          events[i] = { ...events[i], start_time: start, end_time: end };
          renderEvents();
        }
        showNotice(`Moved "${payload.title}" to ${fmtTime12(start)}–${fmtTime12(end)}`);
        return;
      }
      try {
        const { error } = await client.from('calendar_events')
          .update({ start_time: start, end_time: end })
          .eq('id', payload.id);
        if (error) throw error;
        await loadCalendar();
        showNotice(`Moved "${payload.title}" to ${fmtTime12(start)}–${fmtTime12(end)}`);
      } catch (err) {
        setError('Could not reschedule: ' + err.message);
      }
    }

    async function dropTaskOnCalendar(e) {
      e.preventDefault();
      const tl = $('calTimeline');
      tl.classList.remove('drag-over');
      // Calendar event dragged onto the timeline → reschedule it (manual blocks only).
      const rawCal = e.dataTransfer.getData('application/x-cal-event');
      if (rawCal) {
        let payload;
        try { payload = JSON.parse(rawCal); } catch (err) { return; }
        if (!payload.id || payload.source !== 'manual' || !payload.durMin) return;
        if (calMode !== 'today') return;
        const h = hourFromDrop(e);
        if (h == null) return;
        await rescheduleEvent(payload, h);
        return;
      }

      // Task dragged onto the calendar → create a 1-hour manual block.
      const id = e.dataTransfer.getData('text/plain');
      const t = tasks.find(x => x.id === id);
      if (!t) return;

      let startH;
      if (calMode === 'today') {
        const h = hourFromDrop(e);
        startH = (h != null) ? h : nextHourH();
      } else {
        startH = nextHourH();
      }
      const start = fmtHH(startH) + ':00';
      const end = fmtHH(startH + 1) + ':00';

      try {
        if (demoMode) {
          events.push({
            id: nanoid(),
            external_id: null,
            title: t.title,
            date: todayEt(),
            start_time: start,
            end_time: end,
            allDay: false,
            location: '',
            calendar: '',
            color: BLOCK_COLORS[0],
            recur: null,
            source: 'manual',
          });
          renderEvents();
          showNotice(`Blocked "${t.title}" ${fmtTime12(start)}–${fmtTime12(end)}`);
          return;
        }
        const { error } = await client.from('calendar_events').insert({
          title: t.title,
          date: todayEt(),
          start_time: start,
          end_time: end,
          all_day: false,
          calendar: '',
          color: BLOCK_COLORS[0],
          location: '',
          source: 'manual',
        });
        if (error) throw error;
        await loadCalendar();
        showNotice(`Blocked "${t.title}" ${fmtTime12(start)}–${fmtTime12(end)}`);
      } catch (err) {
        setError('Could not add block: ' + err.message);
      }
    }

    async function calEventToTask(e) {
      e.preventDefault();
      const body = document.querySelector('#taskColumns [data-body="tasks"]');
      body.classList.remove('drag-over');
      const raw = e.dataTransfer.getData('application/x-cal-event');
      if (!raw) return;
      let payload;
      try { payload = JSON.parse(raw); } catch (err) { return; }
      const title = String(payload.title || 'Untitled').trim();
      if (!title) return;
      try {
        if (demoMode) {
          tasks.push({
            id: nanoid(),
            title: 'TODO: ' + title,
            status: 'pending',
            project: null,
            description: null,
            source: 'manual',
            due_date: null,
            recur: null,
            people: [],
            created_at: new Date().toISOString(),
            updated_at: new Date().toISOString(),
          });
          renderTasks();
          showNotice(`Added task "TODO: ${title}"`);
          return;
        }
        const { error } = await client.from('tasks').insert({
          id: nanoid(),
          title: 'TODO: ' + title,
          status: 'pending',
          project: null,
          description: null,
          source: 'manual',
          created_at: new Date().toISOString(),
        });
        if (error) throw error;
        await loadTasks();
        showNotice(`Added task "TODO: ${title}"`);
      } catch (err) {
        setError('Could not create task: ' + err.message);
      }
    }

    // ---------- Modal ----------
    function openEdit(t, kind = 'task') {
      modalKind = kind;
      editingId = t ? t.id : null;
      const isPerson = kind === 'person';
      const isProject = kind === 'project';
      $('modalTitle').textContent = t
        ? (isProject ? 'Edit Project' : isPerson ? 'Edit Person' : 'Edit Task')
        : (isProject ? 'New Project' : isPerson ? 'New Person' : 'New Task');
      $('fId').value = t ? t.id : '';
      $('fTitleLabel').innerHTML = (isPerson ? 'Name' : 'Title') + ' <span class="req">*</span>';
      $('fTitle').placeholder = isPerson ? "Person's name" : 'What needs doing?';
      $('fTitle').value = t ? (isPerson ? t.name : t.title) : '';
      $('fDue').value = t ? (t.due_date || '') : '';
      $('fNotes').value = t ? (t.description || '') : '';
      $('fLastContact').value = isPerson && t ? (t.last_contact || '') : '';
      $('fContact').value = isPerson && t ? (t.contact || '') : '';
      $('fPriorityField').classList.toggle('hidden', isPerson || !isProject);
      $('fDueField').classList.toggle('hidden', isProject || isPerson);
      $('fRecurField').classList.toggle('hidden', isProject || isPerson);
      $('fPeopleField').classList.toggle('hidden', isPerson);
      $('fLastContactField').classList.toggle('hidden', !isPerson);
      $('fContactField').classList.toggle('hidden', !isPerson);
      if (isProject || isPerson) {
        $('fProjectField').classList.add('hidden');
        $('fProjectSelectField').classList.add('hidden');
      } else {
        if (t) {
          // Editing an existing task: keep the free-text write-in, prefilled.
          $('fProjectField').classList.remove('hidden');
          $('fProjectSelectField').classList.add('hidden');
          $('fProject').value = t.project || '';
        } else {
        // New task: pick from the live projects list.
        $('fProjectField').classList.add('hidden');
        $('fProjectSelectField').classList.remove('hidden');
        const sel = $('fProjectSelect');
        sel.innerHTML = '<option value="">&#8212; No project &#8212;</option>';
        for (const p of [...projects].sort((a, b) => a.name.localeCompare(b.name))) {
          const opt = document.createElement('option');
          opt.value = p.name;
          opt.textContent = p.name;
          sel.appendChild(opt);
        }
        sel.value = (activeProject !== 'ALL' && projects.some(p => p.name === activeProject)) ? activeProject : '';
        }
      }
      $('fStatus').innerHTML = t
        ? (isPerson ? 'Status: <b>Saved</b>' : `Status: <b>${t.status === 'done' ? 'Completed' : 'Pending'}</b>`)
        : 'Status: <b>Pending</b> (new ' + (isProject ? 'project' : isPerson ? 'person' : 'task') + ')';
      modalPriority = t ? (t.priority || 'medium') : 'medium';
      setPriorityPill();
      modalRecur = t ? (t.recur || '') : '';
      setRecurPill();

      modalPeople = new Set((!isPerson && t && Array.isArray(t.people) ? t.people : []).filter(id => people.some(p => p.id === id)));
      $('peopleSelected').innerHTML = '';
      $('peopleSearch').value = '';
      $('peopleMenu').classList.add('hidden');
      renderPeopleChips();

      const list = $('projectList');
      list.innerHTML = '';
      for (const p of [...new Set(tasks.map(x => x.project).filter(Boolean))].sort()) {
        const opt = document.createElement('option');
        opt.value = p;
        list.appendChild(opt);
      }
      $('deleteBtn').classList.toggle('hidden', !t);
      $('overlay').classList.add('open');
    }

    function renderPeopleChips() {
      const wrap = $('peopleSelected');
      wrap.innerHTML = '';
      for (const id of [...modalPeople]) {
        const p = people.find(x => x.id === id);
        if (!p) continue;
        const chip = document.createElement('span');
        chip.className = 'sp-chip';
        chip.textContent = p.name;
        const rm = document.createElement('button');
        rm.type = 'button';
        rm.textContent = '\u2715';
        rm.title = 'Remove ' + p.name;
        rm.onclick = (e) => { e.stopPropagation(); modalPeople.delete(id); renderPeopleChips(); $('peopleSearch').focus(); };
        chip.appendChild(rm);
        wrap.appendChild(chip);
      }
      updatePeopleMenu();
    }

    let peopleHoverIdx = -1;
    function updatePeopleMenu() {
      const input = $('peopleSearch');
      const menu = $('peopleMenu');
      const q = input.value.trim().toLowerCase();
      if (!people.length) {
        menu.classList.add('hidden');
        peopleHoverIdx = -1;
        return;
      }
      if (!q) { menu.classList.add('hidden'); peopleHoverIdx = -1; return; }
      const matches = people.filter(p => !modalPeople.has(p.id) && p.name.toLowerCase().includes(q));
      if (!matches.length) {
        menu.innerHTML = '<div class="ta-empty">No matches for \u201C' + escapeHtml(input.value.trim()) + '\u201D</div>';
        menu.classList.remove('hidden');
        peopleHoverIdx = -1;
        return;
      }
      menu.innerHTML = matches.slice(0, 12).map((p, i) =>
        `<div class="ta-item${i === peopleHoverIdx ? ' hover' : ''}" data-person-id="${p.id}">${escapeHtml(p.name)}</div>`).join('');
      if (peopleHoverIdx >= menu.querySelectorAll('.ta-item').length) peopleHoverIdx = -1;
      menu.classList.remove('hidden');
      menu.querySelectorAll('.ta-item').forEach(item => {
        item.onclick = () => {
          const id = item.dataset.personId;
          if (!modalPeople.has(id)) modalPeople.add(id);
          input.value = '';
          renderPeopleChips();
          input.focus();
        };
        item.onmousemove = () => { peopleHoverIdx = matches.findIndex(m => m.id === item.dataset.personId); updatePeopleMenu(); };
      });
    }

    function setPriorityPill() {
      document.querySelectorAll('#priorityPills .tag').forEach(p => {
        p.classList.toggle('active', p.dataset.priority === modalPriority);
      });
    }
    function setRecurPill() {
      document.querySelectorAll('#recurPills .tag').forEach(p => {
        p.classList.toggle('active', p.dataset.recur === modalRecur);
      });
    }

    async function save() {
      const title = $('fTitle').value.trim();
      if (!title) { alert('Title is required.'); return; }
      if (modalKind === 'person') {
        const payload = {
          name: title,
          description: $('fNotes').value.trim() || '',
          last_contact: $('fLastContact').value.trim() || null,
          contact: $('fContact').value.trim() || null,
          updated_at: new Date().toISOString(),
        };
        try {
          if (demoMode) {
            if (editingId) {
              const i = people.findIndex(x => x.id === editingId);
              if (i >= 0) people[i] = { ...people[i], ...payload };
            } else {
              people.push({ id: nanoid(), created_at: new Date().toISOString(), ...payload });
            }
            $('overlay').classList.remove('open');
            renderTasks();
            renderProjects();
            return;
          }
          if (editingId) {
            await client.from('people').update(payload).eq('id', editingId);
          } else {
            await client.from('people').insert({
              id: nanoid(),
              created_at: new Date().toISOString(),
              ...payload,
            });
          }
          $('overlay').classList.remove('open');
          await loadPeople();
        } catch (e) {
          setError('Failed to save person: ' + e.message);
        }
        return;
      }
      if (modalKind === 'project') {
        const payload = {
          name: title,
          priority: modalPriority,
          description: $('fNotes').value.trim() || null,
          people: [...modalPeople],
          updated_at: new Date().toISOString(),
        };
        try {
          if (demoMode) {
            if (editingId) {
              const i = projects.findIndex(x => x.id === editingId);
              if (i >= 0) projects[i] = { ...projects[i], ...payload };
            } else {
              projects.push({ id: nanoid(), status: 'pending', ...payload });
            }
            $('overlay').classList.remove('open');
            renderProjects();
            return;
          }
          if (editingId) {
            await client.from('projects').update(payload).eq('id', editingId);
          } else {
            await client.from('projects').insert({
              id: nanoid(),
              status: 'pending',
              ...payload,
            });
          }
          $('overlay').classList.remove('open');
          await loadProjects();
        } catch (e) {
          setError('Failed to save project: ' + e.message);
        }
        return;
      }
      const payload = {
        title,
        due_date: $('fDue').value || null,
        recur: modalRecur || null,
        project: (editingId ? $('fProject').value : $('fProjectSelect').value).trim() || null,
        description: $('fNotes').value.trim() || null,
        people: [...modalPeople],
        updated_at: new Date().toISOString(),
      };
      try {
        if (demoMode) {
          if (editingId) {
            const i = tasks.findIndex(x => x.id === editingId);
            if (i >= 0) tasks[i] = { ...tasks[i], ...payload };
          } else {
            tasks.push({
              id: nanoid(),
              status: 'pending',
              source: 'manual',
              created_at: new Date().toISOString(),
              people: payload.people,
              ...payload,
            });
          }
          $('overlay').classList.remove('open');
          renderTasks();
          return;
        }
        if (editingId) {
          await client.from('tasks').update(payload).eq('id', editingId);
        } else {
          await client.from('tasks').insert({
            id: nanoid(),
            status: 'pending',
            source: 'manual',
            created_at: new Date().toISOString(),
            ...payload,
          });
        }
        $('overlay').classList.remove('open');
        await loadTasks();
      } catch (e) {
        setError('Failed to save task: ' + e.message);
      }
    }

    async function remove() {
      if (!editingId) return;
      if (!confirm('Delete this ' + (modalKind === 'project' ? 'project' : modalKind === 'person' ? 'person' : 'task') + '?')) return;
      if (demoMode) {
        if (modalKind === 'project') {
          projects = projects.filter(x => x.id !== editingId);
          renderProjects();
        } else if (modalKind === 'person') {
          people = people.filter(x => x.id !== editingId);
          renderTasks();
          renderProjects();
        } else {
          tasks = tasks.filter(x => x.id !== editingId);
          renderTasks();
        }
        $('overlay').classList.remove('open');
        return;
      }
      try {
        if (modalKind === 'project') {
          await client.from('projects').delete().eq('id', editingId);
        } else if (modalKind === 'person') {
          await client.from('people').delete().eq('id', editingId);
        } else {
          await client.from('tasks').delete().eq('id', editingId);
        }
        $('overlay').classList.remove('open');
        if (modalKind === 'project') await loadProjects();
        else if (modalKind === 'person') await loadPeople();
        else await loadTasks();
      } catch (e) {
        setError('Failed to delete: ' + e.message);
      }
    }

    // ---------- Wire up ----------
    const rootEl = document.documentElement;
    const storedTheme = localStorage.getItem('personalOSTheme');
    if (storedTheme === 'dark') rootEl.setAttribute('data-theme', 'dark');
    $('themeToggle').onclick = () => {
      const isDark = rootEl.getAttribute('data-theme') === 'dark';
      if (isDark) rootEl.removeAttribute('data-theme');
      else rootEl.setAttribute('data-theme', 'dark');
      localStorage.setItem('personalOSTheme', isDark ? 'light' : 'dark');
    };

    function setProjectsOpen(open) {
      $('projectsStack').classList.toggle('hidden', !open);
      $('panels').classList.toggle('projects-open', open);
      $('projectsToggle').textContent = open ? 'Hide Projects' : 'Projects';
      $('projectsToggle').classList.toggle('toggle-active', open);
      localStorage.setItem('personalOSProjectsOpen', open ? '1' : '0');
    }
    $('projectsToggle').onclick = () => setProjectsOpen($('projectsStack').classList.contains('hidden'));
    setProjectsOpen(localStorage.getItem('personalOSProjectsOpen') === '1');
    loadHiddenEvents();

    $('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('authError').textContent = '';
      const email = $('authEmail').value.trim();
      const password = $('authPass').value;
      if (!email || !password) { $('authError').textContent = 'Enter your email and password.'; return; }
      $('authPass').value = '';
      try {
        const { error } = await client.auth.signInWithPassword({ email, password });
        if (error) throw error;
        await applyAuthState();
        showNotice('Unlocked');
      } catch (err) {
        $('authError').textContent = err.message || 'Sign in failed';
      }
    });

    $('signOutBtn').onclick = async () => {
      await client.auth.signOut();
      await applyAuthState();
    };

    $('signInBtn').onclick = () => { $('loginForm').classList.add('open'); };
    $('tourBtn').onclick = startTour;
    $('tourSkip').onclick = endTour;
    $('tourBack').onclick = () => { if (tourIdx > 0) { tourIdx--; renderTour(); } };
    $('tourNext').onclick = () => {
      if (tourIdx >= TOUR_STEPS.length - 1) { endTour(); return; }
      tourIdx++; renderTour();
    };
    window.addEventListener('resize', () => {
      if (!$('tourCard').classList.contains('hidden')) positionTourBox(TOUR_STEPS[tourIdx].target, false);
    });
    $('authCloseBtn').onclick = () => { $('loginForm').classList.remove('open'); };
    $('newTaskBtn').onclick = () => openEdit(null);
    $('newProjectBtn').onclick = () => openEdit(null, 'project');
    $('refreshTasksBtn').onclick = loadTasks;
    $('newBlockBtn').onclick = () => openCalModal(null);
    $('refreshCalBtn').onclick = loadCalendar;
    $('calCancelBtn').onclick = () => $('calOverlay').classList.remove('open');
    $('calSaveBtn').onclick = saveCalBlock;
    $('calDeleteBtn').onclick = deleteCalBlock;
    $('cAllDay').onchange = () => {
      const all = $('cAllDay').checked;
      $('cStart').disabled = all;
      $('cEnd').disabled = all;
    };
    $('cancelBtn').onclick = () => { $('overlay').classList.remove('open'); $('peopleMenu').classList.add('hidden'); };
    $('saveBtn').onclick = save;
    $('deleteBtn').onclick = remove;

    const peopleSearchEl = $('peopleSearch');
    peopleSearchEl.addEventListener('input', () => { peopleHoverIdx = -1; updatePeopleMenu(); });
    peopleSearchEl.addEventListener('keydown', (e) => {
      const menu = $('peopleMenu');
      const items = [...menu.querySelectorAll('.ta-item')];
      if (e.key === 'ArrowDown' && items.length) {
        e.preventDefault();
        peopleHoverIdx = peopleHoverIdx < items.length - 1 ? peopleHoverIdx + 1 : peopleHoverIdx;
        updatePeopleMenu();
      } else if (e.key === 'ArrowUp' && items.length) {
        e.preventDefault();
        peopleHoverIdx = peopleHoverIdx > 0 ? peopleHoverIdx - 1 : 0;
        updatePeopleMenu();
      } else if (e.key === 'Enter' && items.length && peopleHoverIdx >= 0) {
        e.preventDefault();
        const item = items[peopleHoverIdx];
        const id = item.dataset.personId;
        if (!modalPeople.has(id)) modalPeople.add(id);
        peopleSearchEl.value = '';
        peopleHoverIdx = -1;
        renderPeopleChips();
        peopleSearchEl.focus();
      } else if (e.key === 'Escape') {
        menu.classList.add('hidden');
        peopleSearchEl.blur();
      }
    });
    peopleSearchEl.addEventListener('blur', () => {
      setTimeout(() => { $('peopleMenu').classList.add('hidden'); }, 120);
    });

    // Drag tasks from the tasks panel onto the calendar to create 1-hour blocks;
    // drag calendar events onto the calendar to reschedule, or onto the tasks
    // panel to create a "TODO:" task.
    const calTl = $('calTimeline');
    calTl.ondragover = (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; calTl.classList.add('drag-over'); };
    calTl.ondragleave = () => calTl.classList.remove('drag-over');
    calTl.ondrop = dropTaskOnCalendar;

    const taskBody = document.querySelector('#taskColumns [data-body="tasks"]');
    taskBody.ondragover = (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; taskBody.classList.add('drag-over'); };
    taskBody.ondragleave = () => taskBody.classList.remove('drag-over');
    taskBody.ondrop = calEventToTask;

    document.querySelectorAll('#priorityPills .tag').forEach(p => {
      p.onclick = () => { modalPriority = p.dataset.priority; setPriorityPill(); };
    });
    document.querySelectorAll('#recurPills .tag').forEach(p => {
      p.onclick = () => { modalRecur = p.dataset.recur; setRecurPill(); };
    });
    document.querySelectorAll('#cRecurPills .tag').forEach(p => {
      p.onclick = () => { calRecur = p.dataset.crecur; setCalRecurPill(); };
    });

    // ---------- Boot ----------
    async function boot() {
      client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      await applyAuthState();
      // Realtime (works if `tasks` is in the realtime publication; ignored otherwise)
      try {
        client.channel('personal-os')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'tasks' }, () => loadTasks())
          .subscribe();
      } catch (e) { /* noop */ }
      // Polling fallback
      setInterval(() => { loadTasks(); }, 60000);
      setInterval(() => { loadCalendar(); }, 300000);
      setInterval(() => { renderUpNext(); }, 30000);
    }

    boot();
  </script>
</body>
</html>
