<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal OS</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f4f5f7;
      --bg-2: #eceef1;
      --card: #ffffff;
      --panel: #fafbfc;
      --border: #dfe1e6;
      --text: #1f2933;
      --muted: #6b7280;
      --accent: #0a7e3d;
      --accent-dim: #4aa06b;
      --pending: #0a7e3d;
      --done: #b8860b;
      --warn: #d64545;
      --on-accent: #ffffff;
      --on-warn: #ffffff;
      --on-complete: #ffffff;
      --low: #8a938c;
      --calendar-google: #0a84ff;
      --calendar-outlook: #ff9f0a;
      --glow: rgba(10,126,61,0.06);
      --scanline: rgba(0,0,0,0.05);
      --shadow: 0 1px 3px rgba(0,0,0,0.12);
    }
    :root[data-theme="dark"] {
      --bg: #101310;
      --bg-2: #151a15;
      --card: #0d100d;
      --panel: #141914;
      --border: #2b352b;
      --text: #c8d6c8;
      --muted: #6f8070;
      --accent: #33ff66;
      --accent-dim: #1f7a3a;
      --pending: #33ff66;
      --done: #ffb000;
      --warn: #ff5a3c;
      --on-accent: #06100a;
      --on-warn: #1a0500;
      --on-complete: #1a1200;
      --low: #59605a;
      --calendar-google: #33aaff;
      --calendar-outlook: #ffb000;
      --glow: rgba(51,255,102,0.05);
      --scanline: rgba(0,0,0,0.14);
      --shadow: 0 0 0 1px rgba(51,255,102,0.06), 0 0 18px rgba(0,0,0,0.6);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "SFMono-Regular", ui-monospace, "Cascadia Mono", "IBM Plex Mono", Menlo, Consolas, monospace;
      background: var(--bg);
      color: var(--text);
      background-image:
        radial-gradient(circle at 50% 0%, var(--glow), transparent 60%),
        repeating-linear-gradient(0deg, var(--scanline) 0 1px, transparent 1px 3px);
      min-height: 100vh;
    }
    .hidden { display: none !important; }
    .layout {
      padding: 14px;
    }
    .main { min-width: 0; }

    /* Header */
    .topbar {
      background: var(--bg-2);
      color: var(--accent);
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }
    .topbar::before { content: "▮"; color: var(--accent); animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .topbar button {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 6px 12px;
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
    }
    .topbar button:hover { background: var(--accent); color: var(--on-accent); }
    .topbar .theme-toggle { margin-left: auto; opacity: 0.55; font-weight: 600; font-size: 10px; letter-spacing: 1px; padding: 4px 8px; }
    .topbar .theme-toggle:hover { opacity: 1; }
    .topbar .projects-toggle { font-weight: 600; font-size: 10px; letter-spacing: 1px; padding: 4px 8px; }
    .topbar .projects-toggle.toggle-active { background: var(--accent); color: var(--on-accent); }

    /* Login */
    #loginForm .lbox { margin: 0; }
    .lbox { border: 1px solid var(--border); background: var(--panel); padding: 26px; box-shadow: var(--shadow); width: 400px; max-width: 94vw; }
    .lbox h2 { margin: 0 0 18px 0; font-size: 15px; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }
    .lbox h2::before { content: "▮"; margin-right: 6px; animation: blink 1.1s steps(1) infinite; }
    .login-field { margin-bottom: 12px; }
    .login-field input {
      width: 100%; padding: 9px; background: var(--bg); color: var(--text);
      border: 1px solid var(--border); font-family: inherit; font-size: 13px;
    }
    .login-field input:focus { outline: none; border-color: var(--accent); }
    .login-btn {
      width: 100%; padding: 9px; background: var(--accent); color: var(--on-accent);
      border: 1px solid var(--accent); font-family: inherit; font-size: 12px; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
    }
    .login-btn:hover { filter: brightness(1.1); }
    .login-error { margin-top: 10px; color: var(--warn); font-size: 12px; min-height: 16px; }
    .conn-error {
      background: rgba(255,90,60,0.1); color: var(--warn); border: 1px solid var(--warn);
      padding: 10px 16px; margin: 14px 0 0 0; font-size: 13px;
    }
    .conn-error.notice {
      background: rgba(10,126,61,0.08); color: var(--accent); border-color: var(--accent-dim);
    }

    /* Panels */
    .panels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      align-items: start;
      margin-top: 14px;
    }
    .panels.projects-open { grid-template-columns: 1fr 1fr 1fr 1fr; }

    /* NOW panel — mobile only */
    .now-panel { display: none; }
    .now-panel .now-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .now-panel .now-label { font-size: 11px; font-weight: 700; letter-spacing: 2px; color: var(--accent); }
    .now-panel .now-kicker { margin-left: auto; font-size: 10px; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; }
    .now-panel .now-title { font-size: 15px; font-weight: 700; color: var(--text); word-break: break-word; }
    .now-panel .now-when { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .panel { margin-top: 0; min-width: 0; }
    .panel-head {
      padding: 10px 12px;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      border-bottom: none;
      background: var(--bg-2);
      color: var(--accent);
    }
    .panel-head .dot { width: 8px; height: 8px; background: var(--accent); }
    .panel .cal-foot {
      display: flex;
      justify-content: flex-end;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-top: none;
      background: var(--bg-2);
    }
    .panel .cal-foot .last-updated { font-size: 10px; color: var(--muted); font-weight: 600; letter-spacing: 0.5px; text-transform: none; }
    .panel-head .panel-action {
      margin-left: auto;
      border: 1px solid var(--accent); background: transparent; color: var(--accent);
      font-family: inherit; font-size: 11px; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; padding: 5px 10px; cursor: pointer;
    }
    .panel-head .panel-action:hover { background: var(--accent); color: var(--on-accent); }

    /* Tagbar */
    .tagbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      align-items: center;
    }
    .tagbar .label { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: all 0.1s ease;
    }
    .tag:hover { color: var(--text); border-color: var(--accent); }
    .tag.active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    .tag .loc-dot { flex: none; width: 8px; height: 8px; }

    /* Columns */
    .columns {
      display: grid;
      gap: 14px;
      border: 1px solid var(--border);
      border-top: none;
      padding: 14px;
      background: var(--panel);
    }
    #taskColumns { display: block; max-height: calc(100vh - 300px); overflow-y: auto; }
    #taskColumns .col-body { overflow: visible; flex: none; }
    #projectColumns { display: block; max-height: calc(100vh - 300px); overflow-y: auto; }
    #projectColumns .col-body { overflow: visible; flex: none; }
    .column {
      background: var(--panel);
      border: 1px solid var(--border);
      max-height: calc(100vh - 300px);
      display: flex;
      flex-direction: column;
    }
    .col-head {
      padding: 10px 12px;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
    }
    .col-head .dot { width: 8px; height: 8px; background: currentColor; }
    .col-head .count { color: var(--accent); font-weight: 700; margin-left: auto; }
    .col-body { padding: 8px; overflow-y: auto; flex: 1 1 auto; }
    .empty { color: var(--muted); font-size: 12px; padding: 12px; text-align: center; font-style: italic; }

    /* Calendar timeline */
    .cal-timeline {
      border: 1px solid var(--border);
      border-top: none;
      padding: 14px;
      background: var(--panel);
      max-height: calc(100vh - 300px);
      overflow: auto;
    }
    .tl-week { display: flex; gap: 12px; align-items: flex-start; min-width: 0; }
    .tl-rail { min-width: 0; }
    .tl-week .tl-rail { flex: 1 1 0; min-width: 128px; }
    .tl-head {
      display: flex; align-items: baseline; gap: 8px;
      padding: 0 0 10px 0; font-weight: 700; font-size: 12px;
      letter-spacing: 1px; color: var(--accent); white-space: nowrap;
    }
    .tl-head .tl-date { color: var(--muted); font-weight: 600; font-size: 11px; letter-spacing: 0.5px; }
    .tl-head .tl-n { margin-left: auto; color: var(--low); font-size: 10px; letter-spacing: 0; }
    .blk.allday {
      position: relative; margin-bottom: 6px; padding: 5px 8px;
      border: 1px solid var(--border); border-left-width: 3px;
      background: var(--card); font-size: 11px;
      display: flex; align-items: center; gap: 8px; overflow: hidden;
    }
    .blk.allday .b-label { color: var(--low); font-size: 9px; letter-spacing: 1px; font-weight: 700; flex: none; }
    .tl-body { display: flex; align-items: stretch; gap: 8px; }
    .tl-ticks { position: relative; flex: none; width: 46px; color: var(--low); font-size: 10px; }
    .tl-tick { position: absolute; right: 0; white-space: nowrap; }
    .tl-grid { position: relative; flex: 1 1 auto; min-width: 0; }
    .tl-hourline { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--border); }
    .blk {
      position: absolute; left: 4px; right: 4px; overflow: hidden;
      padding: 3px 6px; box-sizing: border-box;
      border-left: 3px solid var(--border);
      background: var(--card);
      font-size: 10px; line-height: 1.35; word-break: break-word;
    }
    .blk .b-title { font-weight: 700; color: var(--text); }
    .blk .b-time { color: var(--low); }
    .blk.editable { cursor: pointer; }
    .blk.editable:hover { box-shadow: var(--shadow); }
    .blk.feed { border-left-style: dashed; opacity: 0.85; }
    .ev-hide {
      position: absolute; top: 2px; right: 2px; z-index: 2;
      display: none; align-items: center; justify-content: center;
      width: 15px; height: 15px; padding: 0; border: 1px solid var(--border);
      background: var(--bg-2); color: var(--muted);
      font-size: 10px; line-height: 1; cursor: pointer;
    }
    .ev-hide:hover { background: var(--warn); border-color: var(--warn); color: var(--warn); }
    .blk:hover .ev-hide, .cal-timeline .card:hover .ev-hide { display: flex; }
    .cal-timeline .card { position: relative; }
    .tl-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--low); font-size: 11px; font-style: italic; }
    .tl-later { display: flex; flex-direction: column; gap: 10px; }
    .later-row { border: 1px solid var(--border); background: var(--panel); }
    .later-date { padding: 8px 10px; border-bottom: 1px solid var(--border); color: var(--accent); font-weight: 700; font-size: 12px; letter-spacing: 1px; }
    .later-cards { padding: 8px; }
    .tl-count { color: var(--low); font-size: 10px; margin-left: 2px; }
    .tag.active .tl-count { color: var(--on-accent); opacity: 0.75; }
    .tag.hidden-chip { margin-left: 8px; }
    .tag.hidden-chip:hover { color: var(--warn); border-color: var(--warn); }
    .cal-nav { margin-left: auto; display: inline-flex; align-items: center; gap: 2px; }
    .cal-nav button {
      border: 1px solid var(--border); background: transparent; color: var(--muted);
      font-family: inherit; font-size: 10px; line-height: 1; padding: 4px 6px; cursor: pointer;
    }
    .cal-nav button:hover { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    .cal-nav .cal-anchor { font-size: 10px; color: var(--muted); font-weight: 600; letter-spacing: 0.5px; padding: 0 4px; white-space: nowrap; }
    .cal-nav .cal-range { margin-left: 6px; color: var(--low); letter-spacing: 0.5px; }
    .cal-nav .cal-range::before { content: '· '; }

    /* Cards */
    .card.task { cursor: grab; }
    .card.task:active { cursor: grabbing; }
    .cal-timeline.drag-over { outline: 2px dashed var(--accent-dim); outline-offset: -2px; }
    .col-body.drag-over { outline: 2px dashed var(--accent-dim); outline-offset: -2px; }
    .blk { cursor: grab; }
    .blk.editable:active, .blk.feed:active, .card.editable:active, .card.feed:active { cursor: grabbing; }
    .card {
      position: relative;
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 3px solid var(--assigned, var(--border));
      padding: 10px;
      margin-bottom: 8px;
      transition: border-color 0.1s, box-shadow 0.1s;
    }
    .card.task { cursor: pointer; }
    .card.task:hover { border-color: var(--accent-dim); box-shadow: var(--shadow); }
    .card .title { font-weight: 700; font-size: 13px; margin-bottom: 8px; color: var(--text); word-break: break-word; }
    .card .meta { font-size: 11px; color: var(--muted); }
    .card .meta .row { margin: 2px 0; word-break: break-word; }
    .card .meta .row.desc { color: var(--text); }
    .card .due { font-size: 11px; font-weight: 700; color: var(--muted); }
    .card .due.overdue { color: var(--warn); }
    .badge {
      display: inline-block;
      border: 1px solid var(--border);
      padding: 1px 6px;
      margin: 2px 4px 2px 0;
      font-size: 11px;
      color: var(--accent);
      background: transparent;
    }
    .badge.p-l { color: var(--low); border-color: var(--low); }
    .badge.p-m { color: var(--accent); border-color: var(--accent); }
    .badge.p-h { color: var(--done); border-color: var(--done); }
    .badge.p-u { color: var(--warn); border-color: var(--warn); }
    .card.editable { cursor: pointer; }
    .card.editable:hover { border-color: var(--accent-dim); box-shadow: var(--shadow); }
    .card.feed { opacity: 0.85; }
    .card-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }
    .card-actions button {
      border: 1px solid var(--border); background: transparent;
      color: var(--muted); padding: 3px 10px; font-family: inherit; font-size: 10px; font-weight: 700;
      letter-spacing: 0.5px; cursor: pointer;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
    }
    .card-actions button:hover { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    .card-actions .go-back:hover { background: var(--done); border-color: var(--done); color: var(--on-complete); }

    /* Project bundles */
    .card.project .p-list { margin-top: 6px; border-top: 1px dashed var(--border); }
    .p-item {
      display: block; padding: 4px 6px; font-size: 12px; color: var(--text);
      border-bottom: 1px dotted var(--border); cursor: pointer; word-break: break-word;
    }
    .p-item:last-child { border-bottom: none; }
    .p-item.done { text-decoration: line-through; opacity: 0.6; }
    .p-empty { color: var(--muted); font-size: 11px; font-style: italic; padding: 4px 8px; }

    /* People */
    .person-circles {
      position: absolute; top: 8px; right: 8px;
      display: flex; gap: 4px;
    }
    .p-circle {
      width: 20px; height: 20px; border-radius: 50%;
      background: var(--accent); color: var(--on-accent);
      font-size: 10px; font-weight: 700; line-height: 20px; text-align: center;
      cursor: default; position: relative;
    }
    .p-circle::after {
      content: attr(data-name);
      position: absolute; top: -4px; right: 0; transform: translateY(-100%);
      background: var(--bg-2); border: 1px solid var(--border); color: var(--text);
      font-size: 11px; font-weight: 600; letter-spacing: 0; text-transform: none;
      padding: 3px 7px; white-space: nowrap; pointer-events: none; opacity: 0;
      transition: opacity 0.1s; z-index: 3;
    }
    .p-circle:hover::after { opacity: 1; }
    .p-circle.more {
      background: var(--bg-2); color: var(--muted);
      border: 1px solid var(--border); line-height: 18px;
    }
    .card.project .title, .card.task .title { padding-right: 24px; }
    #peopleColumns { display: block; max-height: calc(100vh - 300px); overflow-y: auto; }
    #peopleColumns .col-body { overflow: visible; flex: none; }
    #peopleChips { max-height: 132px; overflow-y: auto; }
    #peopleChips .hint { font-size: 11px; color: var(--muted); font-style: italic; font-weight: 400; text-transform: none; letter-spacing: 0; }

    /* Modal */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: none; align-items: center; justify-content: center; z-index: 10;
    }
    .overlay.open { display: flex; }
    .modal {
      background: var(--bg-2); border: 1px solid var(--accent-dim); width: 440px; max-width: 94vw;
      max-height: 92vh; overflow-y: auto; padding: 22px; box-shadow: var(--shadow);
    }
    .modal h2 { margin: 0 0 16px 0; font-size: 15px; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .field .req { color: var(--warn); }
    .field .hint { color: var(--muted); font-size: 11px; margin-left: 4px; font-weight: 400; text-transform: none; letter-spacing: 0; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 7px; background: var(--bg); color: var(--text);
      border: 1px solid var(--border); font-family: inherit; font-size: 13px;
    }
    .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
    .field textarea { resize: vertical; min-height: 60px; }
    .status-line { font-size: 12px; color: var(--muted); padding: 8px; border: 1px solid var(--border); background: var(--bg); }
    .status-line b { color: var(--accent); }
    .modal-actions { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; }
    .modal-actions button {
      padding: 6px 14px; border: 1px solid var(--border); background: transparent; color: var(--text);
      font-family: inherit; font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
      transition: background 0.1s, color 0.1s;
    }
    .modal-actions button:hover { border-color: var(--accent); color: var(--accent); }
    .btn-primary { background: var(--accent) !important; color: var(--on-accent) !important; border-color: var(--accent) !important; }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-danger { background: var(--warn) !important; color: var(--on-warn) !important; border-color: var(--warn) !important; }
    .status-pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .status-pills .tag { width: auto; }
    .swatch { display: inline-block; width: 22px; height: 22px; border: 2px solid var(--border); cursor: pointer; }
    .swatch.active { outline: 2px solid var(--accent); outline-offset: 1px; }
    .field .check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .field input[type="checkbox"] { width: auto; accent-color: var(--accent); }

    @media (max-width: 900px) {
      .panels, .panels.projects-open { grid-template-columns: 1fr; }
      .panel + .panel { margin-top: 14px; }
      .now-panel { display: block; }
    }
  </style>
</head>
<body>
  <!-- Password gate (shown only when signed out) -->
  <div class="overlay" id="loginForm">
    <div class="lbox">
      <h2>Personal OS</h2>
      <form id="authForm">
        <div class="login-field">
          <input type="email" id="authEmail" placeholder="Email" autocomplete="username" required />
        </div>
        <div class="login-field">
          <input type="password" id="authPass" placeholder="Password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="login-btn">Unlock</button>
        <div class="login-error" id="authError"></div>
      </form>
    </div>
  </div>

  <!-- App -->
  <div id="os">
    <header class="topbar">
      Personal OS
      <button id="themeToggle" class="theme-toggle" title="Toggle dark mode">light / dark</button>
      <button id="projectsToggle" class="projects-toggle" title="Show or hide the Projects panel">Projects</button>
      <button id="signOutBtn" class="hidden">Sign out</button>
    </header>

    <div class="layout">
      <div class="main">
        <div class="conn-error hidden" id="connError"></div>

        <div class="panels" id="panels">
        <!-- NOW PANEL (mobile only) -->
        <section class="panel now-panel" id="nowPanel">

  <script>
    // ============================================================
    // CONFIG — edit these
    // ============================================================
    const SUPABASE_URL = 'https://gzwhuwzmrrmtswyhjheu.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd6d2h1d3ptcnJtdHN3eWhqaGV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2NDQ1OTUsImV4cCI6MjEwNDIyMDU5NX0.vARmLV7ttdkTXz45IDUydwEENxFFY4d3PsI1kct08_E';
    const TZ = 'America/New_York';
    // The gate is a real Supabase Auth sign-in (email + password). There is no
    // client-side password: data is protected by RLS (authenticated role only).
    // Calendar feed sources (mirrors calendar-proxy's CALENDARS). Used to persist
    // feed events into calendar_events via sync_calendar_feed and to skip pruning
    // a feed that failed to fetch.
    const FEED_CALENDARS = ['Outlook', 'Google'];

    // ============================================================

    const PRIORITIES = ['low', 'medium', 'high', 'urgent'];
    const PRIORITY_CLASS = { low: 'p-l', medium: 'p-m', high: 'p-h', urgent: 'p-u' };

    // Calendar timeline clock: first/last hour line and pixels per hour.
    const TL_START = 7, TL_END = 23, PX_PER_HOUR = 44;

    let client = null;
    let authed = false;
    let tasks = [];
    let projects = [];
    let people = [];
    let events = [];
    let activeProject = 'ALL';
    let taskView = 'pending';
    let calMode = 'today';
    let calAnchor = null;
    let editingId = null;
    let modalKind = 'task';

    let modalRecur = '';

    let calColor = BLOCK_COLORS[0];
    let hiddenEvents = new Set();

    function loadHiddenEvents() {
      try {
        hiddenEvents = new Set(localStorage.getItem('personalOSHiddenEvents')
          ? JSON.parse(localStorage.getItem('personalOSHiddenEvents')) : []);
      } catch (e) { hiddenEvents = new Set(); }
    }
    function evKey(ev) {
      return ev.source === 'feed' ? 'ext:' + (ev.external_id || ev.id) : 'id:' + ev.id;
    }
    function isHidden(ev) { return hiddenEvents.has(evKey(ev)); }
    function persistHiddenEvents() {
      localStorage.setItem('personalOSHiddenEvents', JSON.stringify([...hiddenEvents]));
    }
    function hideEvent(key) {
      hiddenEvents.add(key);
      persistHiddenEvents();
      renderEvents();
      renderNowPanel();
    }
    function unhideAll() {
      hiddenEvents.clear();
      persistHiddenEvents();
      renderEvents();
      renderNowPanel();
    }

    const $ = (id) => document.getElementById(id);

    // ---------- Helpers ----------
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
    function todayEt() {
      return new Date().toLocaleDateString('en-CA', { timeZone: TZ });
    }
    function addDaysLocal(dateStr, n) {
      const d = new Date(dateStr + 'T12:00:00');
      d.setDate(d.getDate() + n);
      return d.toLocaleDateString('en-CA', { timeZone: TZ });
    }
    function isoToDateStr(iso) {
      return new Date(iso).toLocaleDateString('en-CA', { timeZone: TZ });
    }
    function isoToTimeStr(iso) {
      const parts = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hour12: false })
        .formatToParts(new Date(iso));
      let h = parts.find(p => p.type === 'hour').value;
      const m = parts.find(p => p.type === 'minute').value;
      if (h === '24') h = '00';
      return `${h.padStart(2, '0')}:${m.padStart(2, '0')}`;
    }
    function fmtTime12(t) {
      if (!t) return '';
      const [hh, mm] = t.split(':').map(Number);
      const ap = hh >= 12 ? 'PM' : 'AM';
      const h = hh % 12 || 12;
      return mm ? `${h}:${String(mm).padStart(2, '0')} ${ap}` : `${h} ${ap}`;
    }
    function fmtRange(s, e) {
      if (!s) return '';
      return e ? `${fmtTime12(s)} - ${fmtTime12(e)}` : fmtTime12(s);
    }
    function formatDate(dateStr) {
      if (!dateStr) return '—';
      const d = new Date(dateStr + 'T00:00:00');
      if (isNaN(d)) return '—';
      return d.toLocaleDateString('en-US', { month: 'short', day: '2-digit' });
    }
    function nanoid(size = 21) {
      const c = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz_-';
      return crypto.getRandomValues(new Uint8Array(size)).reduce((a, x) => a + c[x & 63], '');
    }
    function setError(msg) {
      const el = $('connError');
      el.className = 'conn-error';
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    // ---------- Auth ----------
    function hideError() {
      $('connError').classList.add('hidden');
    }

    function showNotice(msg) {
      const el = $('connError');
      el.className = 'conn-error notice';
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    // Boot into the OS: reuse any stored session silently. If there is no stored
    // session, show the sign-in gate. The gate validates against Supabase Auth
    // (email + password); RLS keeps tasks/calendar authenticated-only, so the
    // calendar proxy here is called with the signed-in user's token.
    async function applyAuthState() {
      const { data: { session } } = await client.auth.getSession();
      const signedIn = !!session;
      const email = session?.user?.email || '';
      authed = signedIn;
      $('loginForm').classList.toggle('open', !signedIn);
      $('os').classList.toggle('hidden', !signedIn);
      $('signOutBtn').classList.toggle('hidden', !signedIn);
      renderTaskTags();
      renderCalTags();
      if (signedIn) {
        hideError();
        await Promise.all([loadTasks(), loadCalendar(), loadProjects(), loadPeople()]);
      }
    }

    // ---------- Projects ----------
    async function loadProjects() {
      try {
        const { data, error } = await client.from('projects').select('*').order('created_at', { ascending: true });
        if (error) throw error;
        projects = data || [];
        renderProjects();
        hideError();
      } catch (e) {
        setError('Failed to load projects: ' + e.message);
      }
    }

    function renderProjects() {
      const body = document.querySelector('#projectColumns [data-body="projects"]');
      body.innerHTML = '';
      if (!projects.length) {
        body.innerHTML = '<div class="empty">No projects yet</div>';
        return;
      }
      for (const p of projects) body.appendChild(renderProjectBundle(p));
    }

    function renderProjectBundle(p) {
      const card = document.createElement('div');
      card.className = 'card project';
      card.onclick = () => openEdit(p, 'project');
      const prio = p.priority || 'medium';
      const prioColor = { low: 'var(--low)', medium: 'var(--accent-dim)', high: 'var(--done)', urgent: 'var(--warn)' }[prio] || 'var(--border)';
      card.style.borderLeftColor = prioColor;

      const items = tasks
        .filter(t => t.project === p.name)
        .sort((a, b) => (a.due_date || '9999-12-31').localeCompare(b.due_date || '9999-12-31'));

      card.innerHTML =
        personCirclesHtml(p.people) +
        `<div class="title">${escapeHtml(p.name)}</div>` +
        `<div class="meta"><div class="row">` +
          `<span class="badge">${items.length} task${items.length === 1 ? '' : 's'}</span>` +
          (p.status !== 'pending' ? `<span class="badge">${escapeHtml(p.status)}</span>` : '') +
        `</div></div>` +
        (p.description ? `<div class="meta"><div class="row desc">${escapeHtml(p.description)}</div></div>` : '') +
        (items.length
          ? `<div class="p-list">` + items.map(t => `<div class="p-item${t.status === 'done' ? ' done' : ''}" data-task-id="${t.id}">${escapeHtml(t.title)}</div>`).join('') + `</div>`
          : `<div class="p-empty">No tasks yet</div>`) +
        `<div class="card-actions">` +
          (p.status === 'done'
            ? `<button class="go-back" type="button">REOPEN</button>`
            : `<button type="button">COMPLETE</button>`) +
        `</div>`;

      card.querySelectorAll('.p-item').forEach(row => {
        row.onclick = (e) => {
          e.stopPropagation();
          const t = tasks.find(x => x.id === row.dataset.taskId);
          if (t) openEdit(t);
        };
      });

      const btn = card.querySelector('.card-actions > button');
      btn.onclick = (e) => {
        e.stopPropagation();
        setProjectStatus(p, p.status === 'done' ? 'pending' : 'done');
      };
      return card;
    }

    async function setProjectStatus(p, status) {
      try {
        await client.from('projects').update({ status, updated_at: new Date().toISOString() }).eq('id', p.id);
        await loadProjects();
      } catch (e) {
        setError('Failed to update project: ' + e.message);
      }
    }

    // ---------- People ----------
    async function loadPeople() {
      try {
        const { data, error } = await client.from('people').select('*').order('created_at', { ascending: true });
        if (error) throw error;
        people = data || [];
        renderPeople();
        renderTasks();
        renderProjects();
        hideError();
      } catch (e) {
        setError('Failed to load people: ' + e.message);
      }
    }

    function renderPeople() {
      const body = document.querySelector('#peopleColumns [data-body="people"]');
      body.innerHTML = '';
      if (!people.length) {
        body.innerHTML = '<div class="empty">No people yet</div>';
        return;
      }
      for (const person of people) body.appendChild(renderPersonCard(person));
    }

    function renderPersonCard(person) {
      const card = document.createElement('div');
      card.className = 'card person';
      card.onclick = () => openEdit(person, 'person');
      card.innerHTML =
        `<div class="title">${escapeHtml(person.name)}</div>` +
        (person.description ? `<div class="meta"><div class="row desc">${escapeHtml(person.description)}</div></div>` : '') +
        `<div class="card-actions"><span class="due">Last contact: ${escapeHtml(person.last_contact || 'never')}</span></div>`;
      return card;
    }

    function personCirclesHtml(personIds) {
      const list = (personIds || [])
        .map(id => people.find(p => p.id === id))
        .filter(Boolean);
      if (!list.length) return '';
      const shown = list.slice(0, 3);
      const more = list.length - shown.length;
      return `<div class="person-circles">` +
        shown.map(p => {
          const initial = (p.name || '?').trim().charAt(0).toUpperCase() || '?';
          return `<span class="p-circle" data-name="${escapeHtml(p.name)}" title="${escapeHtml(p.name)}">${escapeHtml(initial)}</span>`;
        }).join('') +
        (more > 0 ? `<span class="p-circle more" data-name="${more} more" title="${more} more">+${more}</span>` : '') +
        `</div>`;
    }

    // ---------- Tasks ----------
    async function loadTasks() {
      try {
        const { data, error } = await client.from('tasks').select('*').order('created_at', { ascending: true });
        if (error) throw error;
        tasks = data || [];
        renderTasks();
        hideError();
      } catch (e) {
        setError('Failed to load tasks: ' + e.message);
      }
    }

    function filteredTasks(list) {
      if (activeProject === 'ALL') return list;
      return list.filter(t => t.project === activeProject);
    }

    function renderTaskTags() {
      const projects = [...new Set(tasks.map(t => t.project).filter(Boolean))].sort();
      const doneCount = filteredTasks(tasks.filter(t => t.status === 'done')).length;
      const bar = $('taskTagbar');
      bar.innerHTML =
        `<span class="label">List:</span>` +
        `<span class="tag${taskView === 'done' ? ' active' : ''}" data-toggle="done">Completed<span class="tl-count">${doneCount}</span></span>` +
        `<span class="tag${activeProject === 'ALL' ? ' active' : ''}" data-project="ALL">All</span>` +
        projects.map(p => `<span class="tag${activeProject === p ? ' active' : ''}" data-project="${escapeHtml(p)}">${escapeHtml(p)}</span>`).join('');
      bar.querySelectorAll('.tag[data-toggle="done"]').forEach(ch => {
        ch.onclick = () => { taskView = taskView === 'done' ? 'pending' : 'done'; renderTaskTags(); renderTasks(); };
      });
      bar.querySelectorAll('.tag[data-project]').forEach(ch => {
        ch.onclick = () => { activeProject = ch.dataset.project; renderTaskTags(); renderTasks(); };
      });
    }

    function renderTasks() {
      renderTaskTags();
      const list = filteredTasks(tasks.filter(t => taskView === 'done' ? t.status === 'done' : t.status !== 'done'));
      const body = document.querySelector('#taskColumns [data-body="tasks"]');
      body.innerHTML = '';
      if (!list.length) {
        body.innerHTML = taskView === 'done' ? '<div class="empty">Nothing completed</div>' : '<div class="empty">No active tasks</div>';
        renderProjects();
        return;
      }
      list.sort((a, b) => (a.due_date || '9999-12-31').localeCompare(b.due_date || '9999-12-31'));
      for (const t of list) body.appendChild(renderTaskCard(t));
      renderProjects();
      renderNowPanel();
    }

    function renderTaskCard(t) {
      const card = document.createElement('div');
      card.className = 'card task';
      card.dataset.status = t.status;
      card.draggable = true;
      card.ondragstart = (e) => {
        e.dataTransfer.setData('text/plain', String(t.id));
        e.dataTransfer.effectAllowed = 'copy';
        dragCtx = { type: 'task', taskId: t.id };
      };
      card.ondragend = () => { dragCtx = null; };
      card.onclick = () => openEdit(t);

      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const due = t.due_date ? new Date(t.due_date + 'T00:00:00') : null;
      const overdue = due && t.status !== 'done' && due < today;
      const prio = t.priority || 'medium';
      const prioColor = { low: 'var(--low)', medium: 'var(--accent-dim)', high: 'var(--done)', urgent: 'var(--warn)' }[prio] || 'var(--border)';
      card.style.borderLeftColor = prioColor;

      card.innerHTML =
        personCirclesHtml(t.people) +
        `<div class="title">${escapeHtml(t.title)}</div>` +
        `<div class="meta">` +
          `<div class="row">` +
            (t.project ? `<span class="badge">${escapeHtml(t.project)}</span>` : '') +
            `<span class="badge ${PRIORITY_CLASS[prio] || 'p-m'}">${escapeHtml(prio)}</span>` +
          `</div>` +
          (t.description ? `<div class="row desc">${escapeHtml(t.description)}</div>` : '') +
        `</div>` +
        `<div class="card-actions">` +
          `<span class="due ${overdue ? 'overdue' : ''}">Due: ${formatDate(t.due_date)}${overdue ? ' (overdue)' : ''}</span>` +
          (t.status === 'done'
            ? `<button class="go-back" type="button">REOPEN</button>`
            : `<button type="button">COMPLETE</button>`) +
        `</div>`;

      const btn = card.querySelector('button');
      btn.onclick = (e) => {
        e.stopPropagation();
        setStatus(t, t.status === 'done' ? 'pending' : 'done');
      };
      return card;
    }

    async function setStatus(t, status) {
      try {
        const { error } = await client.from('tasks')
          .update({ status, updated_at: new Date().toISOString() })
          .eq('id', t.id);
        if (error) throw error;
        if (status === 'done' && t.recur) {
          const advance = t.recur === 'daily' ? 1 : 7;
          const base = t.due_date || todayEt();
          const nextDue = addDaysLocal(base, advance);
          const projectName = t.project || null;
          const { error: insErr } = await client.from('tasks').insert({
            id: nanoid(),
            status: 'pending',
            source: 'manual',
            created_at: new Date().toISOString(),
            title: t.title,
            due_date: nextDue,
            priority: t.priority || 'medium',
            recur: t.recur,
            project: projectName,
            people: t.people || [],
            description: t.description,
            updated_at: new Date().toISOString(),
          });
          if (insErr) throw insErr;
        }
        await loadTasks();
      } catch (e) {
        setError('Failed to update task: ' + e.message);
      }
    }

    // ---------- Calendar ----------
    function normDate(iso) {
      return /^\d{4}-\d{2}-\d{2}$/.test(iso) ? iso : isoToDateStr(iso);
    }
    function feedRow(ev) {
      const date = normDate(ev.start);
      const startTime = (ev.allDay || !ev.start) ? null : isoToTimeStr(ev.start);
      const endTime = (ev.allDay || !ev.end) ? null : isoToTimeStr(ev.end);
      return {
        external_id: [ev.calendar || '', date, startTime || 'allday', ev.title || ''].join('|'),
        title: ev.title || 'Untitled',
        date,
        start_time: startTime,
        end_time: endTime,
        all_day: !!ev.allDay,
        calendar: ev.calendar || '',
        color: ev.color || '',
        location: ev.location || '',
      };
    }
    function rowToEvent(row) {
      return {
        id: row.id,
        external_id: row.external_id || null,
        title: row.title || 'Untitled',
        date: row.date,
        start_time: row.start_time || null,
        end_time: row.end_time || null,
        allDay: !!row.all_day,
        location: row.location || '',
        calendar: row.calendar || '',
        color: row.color || 'var(--border)',
        source: row.source || 'manual',
      };
    }
    // Same external_id keying as feedRow() so table feed rows and proxy rows dedupe.
    function proxyToEvent(ev) {
      const date = normDate(ev.start);
      const startTime = (ev.allDay || !ev.start) ? null : isoToTimeStr(ev.start);
      return {
        external_id: [ev.calendar || '', date, startTime || 'allday', ev.title || ''].join('|'),
        title: ev.title || 'Untitled',
        date,
        start_time: startTime,
        end_time: (ev.allDay || !ev.end) ? null : isoToTimeStr(ev.end),
        allDay: !!ev.allDay,
        location: ev.location || '',
        calendar: ev.calendar || '',
        color: ev.color || 'var(--border)',
        source: 'feed',
      };
    }

    async function loadCalendar() {
      const { data: { session } } = await client.auth.getSession();
      const token = session?.access_token || '';
      let body = null;
      let feedErr = null;
      try {
        const r = await fetch(SUPABASE_URL + '/functions/v1/calendar-proxy', {
          headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${token}` },
        });
        if (!r.ok) throw new Error('calendar proxy HTTP ' + r.status);
        body = await r.json();
        $('calUpdated').textContent = body.last_updated
          ? 'synced ' + new Date(body.last_updated).toLocaleTimeString('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit' })
          : '';
      } catch (e) {
        feedErr = e;
        $('calUpdated').textContent = 'feed offline';
      }

      // Persist feed events into calendar_events (signed-in users only). Feed
      // rows that vanished from a successfully-fetched feed are pruned here.
      if (authed && body && Array.isArray(body.events)) {
        const errored = new Set((body.errors || []).map(err => err.calendar));
        const fetched = FEED_CALENDARS.filter(c => !errored.has(c));
        try {
          await client.rpc('sync_calendar_feed', {
            p_payload: { calendars: fetched, rows: (body.events || []).map(feedRow) },
          });
        } catch (e) { /* feed sync failure is non-fatal */ }
      }

      // Signed-in: read everything (feed + manual blocks) from the table.
      // Anonymous (gate-unlocked): merge table rows (your manual blocks) with the
      // live feed from the proxy, since anon can't run the sync RPC. Table feed
      // rows are replaced by the fresher proxy feed row for the same external_id.
      if (authed) {
        try {
          const { data, error } = await client.from('calendar_events')
            .select('*').order('date', { ascending: true }).order('start_time', { ascending: true });
          if (error) throw error;
          events = (data || []).map(rowToEvent);
        } catch (e) {
          events = (body?.events || []).map(proxyToEvent);
        }
      } else {
        let tableRows = [];
        try {
          const { data } = await client.from('calendar_events')
            .select('*').order('date', { ascending: true }).order('start_time', { ascending: true });
          tableRows = data || [];
        } catch (e) { /* table missing/offline: fall through to feed only */ }
        const feedEvt = (body?.events || []).map(proxyToEvent);
        const feedById = new Map(feedEvt.filter(e => e.external_id).map(e => [e.external_id, e]));
        const merged = [];
        for (const r of tableRows) {
          const ev = rowToEvent(r);
          if (ev.source === 'feed' && ev.external_id && feedById.has(ev.external_id)) continue;
          merged.push(ev);
        }
        events = merged.concat(feedEvt);
      }

      renderEvents();
      if (feedErr && events.length) { setError('Calendar feed offline — showing saved blocks.'); return; }
      if (feedErr && !events.length) { setError('Failed to load calendar: ' + feedErr.message); return; }
      hideError();
    }

    function renderCalTags() {
      const today = todayEt();
      const weekEnd = addDaysLocal(today, 7);
      const counts = { today: 0, week: 0 };
      for (const e of events) {
        if (isHidden(e)) continue;
        if (!e.date || e.date < today) continue;
        if (e.date === today) counts.today++;
        else if (e.date <= weekEnd) counts.week++;
      }
      const bar = $('calTagbar');
      bar.innerHTML =
        `<span class="label">Scale:</span>` +
        [['today', 'Day'], ['week', 'Week']]
          .map(([v, label]) =>
            `<span class="tag${calMode === v ? ' active' : ''}" data-mode="${v}">${label}<span class="tl-count">${counts[v]}</span></span>`
          ).join('') +
        (hiddenEvents.size ? `<span class="tag hidden-chip" data-action="unhide" title="Show all hidden events">Hidden ${hiddenEvents.size}</span>` : '') +
        `<span class="cal-nav">` +
          `<button id="calPrev" title="Previous ${calMode === 'week' ? 'week' : 'day'}">&#9664;</button>` +
          `<span class="cal-anchor">${calAnchorLabel()}</span>` +
          `<button id="calNext" title="Next ${calMode === 'week' ? 'week' : 'day'}">&#9654;</button>` +
        `</span>`;
      bar.querySelectorAll('.tag[data-mode]').forEach(ch => {
        ch.onclick = () => { calMode = ch.dataset.mode; renderEvents(); };
      });
      const unhideChip = bar.querySelector('.tag[data-action="unhide"]');
      if (unhideChip) unhideChip.onclick = unhideAll;
      $('calPrev').onclick = () => stepCal(-1);
      $('calNext').onclick = () => stepCal(1);
    }

    // ---------- NOW (mobile) ----------
    // Show the next calendar event when it's imminent (in progress now or
    // starting within the next hour); otherwise surface the next active task.
    function nextNowItem() {
      const today = todayEt();
      const nowMin = (toMin(isoToTimeStr(new Date().toISOString()))) || 0;
      const soon = nowMin + 60;
      const cand = events.filter(e => !isHidden(e) && e.date >= today).sort((a, b) => (a.date + '|' + (a.start_time || '')).localeCompare(b.date + '|' + (b.start_time || '')));
      for (const ev of cand) {
        if (ev.date !== today) break;
        if (ev.allDay || !ev.start_time) return { type: 'event', ev };
        const sm = toMin(ev.start_time);
        const em = ev.end_time ? toMin(ev.end_time) : null;
        if (sm <= nowMin && em != null && nowMin < em) return { type: 'event', ev };
        if (sm >= nowMin && sm <= soon) return { type: 'event', ev };
      }
      const list = tasks.filter(t => t.status !== 'done');
      if (!list.length) return null;
      list.sort((a, b) => (a.due_date || '9999-12-31').localeCompare(b.due_date || '9999-12-31'));
      return { type: 'task', t: list[0] };
    }

    function renderNowPanel() {
      const el = $('nowPanel');
      if (!el) return;
      const item = nextNowItem();
      if (!item) {
        $('nowKicker').textContent = 'All clear';
        $('nowTitle').textContent = '';
        $('nowWhen').textContent = 'Nothing scheduled or pending.';
        return;
      }
      if (item.type === 'event') {
        const ev = item.ev;
        const sameDay = ev.date === todayEt();
        const when = ev.allDay
          ? (sameDay ? 'All day today' : formatDate(ev.date))
          : (sameDay ? fmtRange(ev.start_time, ev.end_time) : formatDate(ev.date) + ' · ' + fmtRange(ev.start_time, ev.end_time));
        $('nowKicker').textContent = 'Next event';
        $('nowTitle').textContent = ev.title;
        $('nowWhen').textContent = when;
      } else {
        const t = item.t;
        const due = t.due_date ? 'Due ' + formatDate(t.due_date) : '';
        $('nowKicker').textContent = 'Next task';
        $('nowTitle').textContent = t.title;
        $('nowWhen').textContent = t.project ? t.project + (due ? ' · ' + due : '') : due;
      }
    }

    function toMin(t) {
      if (!t) return null;
      const [h, m] = t.split(':').map(Number);
      return h * 60 + m;
    }
    function fmtDayHead(tag, dateStr) {
      const d = new Date(dateStr + 'T12:00:00');
      const md = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }).toUpperCase();
      return `${tag} <span class="tl-date">${md}</span>`;
    }
    function humanDay(dateStr) {
      return new Date(dateStr + 'T12:00:00').toLocaleDateString('en-US',
        { weekday: 'short', month: 'short', day: 'numeric' });
    }
    function calAnchorLabel() {
      const today = todayEt();
      const anchor = calAnchor || today;
      if (calMode === 'week') {
        if (anchor === today) return 'This Week';
        const end = addDaysLocal(anchor, 6);
        return `Week of ${formatDate(anchor)}<span class="cal-range">${formatDate(anchor)} – ${formatDate(end)}</span>`;
      }
      if (anchor === today) return 'Today';
      return humanDay(anchor);
    }
    function stepCal(dir) {
      const step = calMode === 'week' ? 7 : 1;
      calAnchor = addDaysLocal(calAnchor || todayEt(), dir * step);
      renderEvents();
    }
    function tlBlock(ev) {
      const start = toMin(ev.start_time);
      const end = toMin(ev.end_time);
      const minStart = TL_START * 60, minEnd = TL_END * 60;
      const s = Math.max(start, minStart);
      const e = Math.min(end != null ? end : start + 60, minEnd);
      if (e <= minStart || s >= minEnd) return null;
      const pxPerMin = PX_PER_HOUR / 60;
      const top = (s - minStart) * pxPerMin;
      const height = Math.max((e - s) * pxPerMin, 16);
      const feed = ev.source === 'feed';
      const extra = feed ? ' feed' : ' editable';
      const did = feed ? ` data-ext="${escapeHtml(ev.external_id || '')}"` : ` data-id="${escapeHtml(ev.id)}"`;
      return `<div class="blk${extra}"${did} style="top:${top.toFixed(1)}px;height:${height.toFixed(1)}px;border-left-color:${ev.color}">` +
        `<button class="ev-hide" data-hide="${escapeHtml(evKey(ev))}" title="Hide event">&#10005;</button>` +
        `<div class="b-title">${escapeHtml(ev.title)}</div>` +
        `<div class="b-time">${escapeHtml(fmtRange(ev.start_time, ev.end_time))}</div>` +
        `</div>`;
    }
    function tlColumn(titleHtml, evs) {
      const gridH = (TL_END - TL_START) * PX_PER_HOUR;
      const allDay = evs.filter(e => e.allDay || !e.start_time);
      const timed = evs.filter(e => !e.allDay && e.start_time);
      let h = `<div class="tl-rail"><div class="tl-head">${titleHtml}<span class="tl-n">${evs.length || ''}</span></div>`;
      for (const e of allDay) {
        const feed = e.source === 'feed';
        const extra = feed ? ' feed' : ' editable';
        const did = feed ? ` data-ext="${escapeHtml(e.external_id || '')}"` : ` data-id="${escapeHtml(e.id)}"`;
        h += `<div class="blk allday${extra}"${did} style="border-left-color:${e.color}">` +
          `<button class="ev-hide" data-hide="${escapeHtml(evKey(e))}" title="Hide event">&#10005;</button>` +
          `<span class="b-label">ALL DAY</span><span class="b-title">${escapeHtml(e.title)}</span></div>`;
      }
      h += `<div class="tl-body"><div class="tl-ticks" style="height:${gridH}px">`;
      for (let k = TL_START; k <= TL_END; k++) {
        const f = (k - TL_START) / (TL_END - TL_START);
        const tr = f === 0 ? 'translateY(0)' : (f >= 1 ? 'translateY(-100%)' : 'translateY(-50%)');
        h += `<span class="tl-tick" style="top:${(f * 100).toFixed(2)}%;transform:${tr}">${fmtTime12(k + ':00')}</span>`;
      }
      h += `</div><div class="tl-grid" style="height:${gridH}px">`;
      for (let k = TL_START; k <= TL_END; k++) {
        const f = (k - TL_START) / (TL_END - TL_START);
        h += `<div class="tl-hourline" style="top:${(f * 100).toFixed(2)}%"></div>`;
      }
      const blkHtml = timed.map(e => tlBlock(e)).filter(Boolean).join('');
      h += blkHtml || (allDay.length ? '' : '<div class="tl-empty">No events</div>');
      h += `</div></div></div>`;
      return h;
    }

    function groupByDate(evs) {
      const rows = [];
      let cur = null;
      for (const e of evs) {
        if (!cur || cur.date !== e.date) { cur = { date: e.date, evs: [] }; rows.push(cur); }
        cur.evs.push(e);
      }
      return rows;
    }

    // Simple scrolling list grouped by day — used by Week and Later. Cards
    // show times inline (fmtRange) but aren't scaled onto a timeline.
    function renderDateList(evs, emptyMsg) {
      const rows = groupByDate(evs);
      if (!rows.length) return `<div class="empty">${emptyMsg}</div>`;
      const today = todayEt();
      let html = '<div class="tl-later">';
      for (const r of rows) {
        const tag = r.date === today
          ? 'TODAY'
          : new Date(r.date + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'long' }).toUpperCase();
        html += `<div class="later-row"><div class="later-date">${fmtDayHead(tag, r.date)}</div><div class="later-cards">`;
        for (const e of r.evs) html += renderEventCardHtml(e);
        html += `</div></div>`;
      }
      return html + '</div>';
    }

    function renderEvents() {
      const today = todayEt();
      if (!calAnchor) calAnchor = today;
      renderCalTags();
      const tl = $('calTimeline');
      const vis = events.filter(e => !isHidden(e));
      if (calMode === 'week') {
        const weekEnd = addDaysLocal(calAnchor, 6);
        const key = e => e.date + '|' + (e.start_time || '');
        const weekEvs = vis.filter(e => e.date >= calAnchor && e.date <= weekEnd).sort((a, b) => key(a).localeCompare(key(b)));
        tl.innerHTML = renderDateList(weekEvs, 'No events in this week');
      } else {
        // Always render the full hourly timeline (even on an empty day) so the
        // user can scroll through the day; tlColumn shows a "No events" hint.
        const headTag = calAnchor === today
          ? 'TODAY'
          : new Date(calAnchor + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'long' }).toUpperCase();
        tl.innerHTML = tlColumn(fmtDayHead(headTag, calAnchor), vis.filter(e => e.date === calAnchor));
      }
      attachEditable();
      renderNowPanel();
    }

    function attachEditable() {
      const tl = $('calTimeline');
      tl.querySelectorAll('.blk.editable, .card.editable').forEach(el => {
        el.onclick = () => {
          const ev = events.find(e => e.id === el.dataset.id);
          if (ev) openCalModal(ev);
        };
        makeCalDraggable(el);
      });
      tl.querySelectorAll('.blk.feed, .card.feed').forEach(makeCalDraggable);
      tl.querySelectorAll('.ev-hide').forEach(btn => {
        btn.onclick = (e) => { e.stopPropagation(); hideEvent(btn.dataset.hide); };
      });
    }

    function eventDurMin(ev) {
      if (ev.allDay) return null;
      const s = toMin(ev.start_time);
      const e = toMin(ev.end_time);
      if (s == null) return null;
      return Math.max((e != null && e > s) ? (e - s) : 60, 60);
    }

    function findEventForEl(el) {
      if (el.dataset.id) { const m = events.find(x => x.id === el.dataset.id); if (m) return m; }
      const ext = el.dataset.ext || '';
      if (ext) { const m = events.find(x => x.source === 'feed' && x.external_id === ext); if (m) return m; }
      const tEl = el.querySelector('.b-title, .title');
      const t = tEl && (tEl.textContent || tEl.innerHTML || '');
      return events.find(x => x.source === 'feed' && x.title === t) || null;
    }

    function makeCalDraggable(el) {
      el.draggable = true;
      el.ondragstart = (e) => {
        e.stopPropagation();
        const ev = findEventForEl(el);
        if (!ev) return;
        dragCtx = { type: 'cal' };
        e.dataTransfer.setData('application/x-cal-event', JSON.stringify({
          id: ev.id || null,
          external_id: ev.external_id || null,
          source: ev.source,
          title: ev.title,
          durMin: eventDurMin(ev),
        }));
        e.dataTransfer.effectAllowed = ev.source === 'feed' ? 'copy' : 'move';
      };
      el.ondragend = () => { dragCtx = null; };
    }

    function renderEventCardHtml(ev) {
      const timeLine = ev.allDay ? 'All day' : fmtRange(ev.start_time, ev.end_time);
      const feed = ev.source === 'feed';
      const extra = feed ? ' feed' : ' editable';
      const did = feed ? ` data-ext="${escapeHtml(ev.external_id || '')}"` : ` data-id="${escapeHtml(ev.id)}"`;
      return `<div class="card${extra}"${did} style="border-left-color:${ev.color}">` +
        `<button class="ev-hide" data-hide="${escapeHtml(evKey(ev))}" title="Hide event">&#10005;</button>` +
        `<div class="title">${escapeHtml(ev.title)}</div>` +
        `<div class="meta">` +
          `<div class="row">` +
            (ev.allDay ? `<span class="badge">All day</span>` : '') +
          `</div>` +
          `<div class="row">${escapeHtml(timeLine)}</div>` +
          (ev.location ? `<div class="row">${escapeHtml(ev.location)}</div>` : '') +
        `</div>` +
        `<div class="card-actions"><span class="due">${escapeHtml(formatDate(ev.date))}</span></div>` +
      `</div>`;
    }

    function renderEventCard(ev) {
      const card = document.createElement('div');
      card.className = 'card';
      card.style.borderLeftColor = ev.color;
      card.innerHTML = renderEventCardHtml(ev);
      return card;
    }

    // ---------- Calendar blocks ----------
    function renderColorPills() {
      $('cColorPills').innerHTML = BLOCK_COLORS.map(c =>
        `<span class="swatch${calColor === c ? ' active' : ''}" data-color="${escapeHtml(c)}" style="background:${escapeHtml(c)}"></span>`).join('');
      $('cColorPills').querySelectorAll('.swatch').forEach(s => {
        s.onclick = () => { calColor = s.dataset.color; renderColorPills(); };
      });
    }

    function openCalModal(ev) {
      editingCalId = ev ? ev.id : null;
      $('calModalTitle').textContent = ev ? 'Edit Block' : 'New Block';
      $('cId').value = ev ? ev.id : '';
      $('cTitle').value = ev ? ev.title : '';
      $('cDate').value = ev ? (ev.date || todayEt()) : todayEt();
      $('cStart').value = ev ? (ev.start_time || '09:00') : '09:00';
      $('cEnd').value = ev ? (ev.end_time || '10:00') : '10:00';
      $('cLocation').value = ev ? (ev.location || '') : '';
      $('cAllDay').checked = ev ? !!ev.allDay : false;
      $('cStart').disabled = $('cAllDay').checked;
      $('cEnd').disabled = $('cAllDay').checked;
      calColor = ev && ev.color && BLOCK_COLORS.includes(ev.color) ? ev.color : BLOCK_COLORS[0];
      renderColorPills();
      $('calDeleteBtn').classList.toggle('hidden', !editingCalId);
      $('calOverlay').classList.add('open');
    }

    async function saveCalBlock() {
      const title = $('cTitle').value.trim();
      if (!title) { $('cTitle').focus(); return; }
      const date = $('cDate').value || todayEt();
      const allDay = $('cAllDay').checked;
      const start = allDay ? null : ($('cStart').value || null);
      const end = allDay ? null : ($('cEnd').value || null);
      if (start && end && end <= start) { setError('End time must be after start time.'); return; }
      const rec = {
        title,
        date,
        start_time: start,
        end_time: end,
        all_day: allDay,
        color: calColor,
        location: $('cLocation').value.trim(),
        source: 'manual',
      };
      try {
        if (editingCalId) {
          const { error } = await client.from('calendar_events').update(rec).eq('id', editingCalId);
          if (error) throw error;
        } else {
          const { error } = await client.from('calendar_events').insert(rec);
          if (error) throw error;
        }
        $('calOverlay').classList.remove('open');
        await loadCalendar();
      } catch (e) {
        setError('Failed to save block: ' + e.message);
      }
    }

    async function deleteCalBlock() {
      if (!editingCalId) return;
      try {
        const { error } = await client.from('calendar_events').delete().eq('id', editingCalId);
        if (error) throw error;
        $('calOverlay').classList.remove('open');
        await loadCalendar();
      } catch (e) {
        setError('Failed to delete block: ' + e.message);
      }
    }

    // ---------- Drag task → calendar block ----------
    function fmtHH(h) { return String(h).padStart(2, '0'); }
    function nextHourH() {
      const h = +new Date().toLocaleString('en-US', { timeZone: TZ, hour: 'numeric', hour12: false });
      return h + 1;
    }
    function hourFromDrop(e) {
      const tl = $('calTimeline');
      const grid = tl.querySelector('.tl-grid');
      const r = grid ? grid.getBoundingClientRect() : null;
      if (!r || e.clientY < r.top || e.clientY > r.bottom) return null;
      const relMin = ((e.clientY - r.top) / Math.max(r.height, 1)) * (TL_END - TL_START) * 60;
      return Math.max(TL_START, Math.min(TL_END - 1, TL_START + Math.floor(relMin / 60)));
    }

    function fmtHM(min) {
      return fmtHH(Math.floor(min / 60)) + ':' + String(min % 60).padStart(2, '0');
    }

    async function rescheduleEvent(payload, startH) {
      const durMin = payload.durMin;
      const startMin = startH * 60;
      const endMin = Math.max(startMin + 60, Math.min(startMin + durMin, TL_END * 60));
      const start = fmtHM(startMin);
      const end = fmtHM(endMin);
      try {
        const { error } = await client.from('calendar_events')
          .update({ start_time: start, end_time: end })
          .eq('id', payload.id);
        if (error) throw error;
        await loadCalendar();
        showNotice(`Moved "${payload.title}" to ${fmtTime12(start)}–${fmtTime12(end)}`);
      } catch (err) {
        setError('Could not reschedule: ' + err.message);
      }
    }

    async function dropTaskOnCalendar(e) {
      e.preventDefault();
      const tl = $('calTimeline');
      tl.classList.remove('drag-over');
      // Calendar event dragged onto the timeline → reschedule it (manual blocks only).
      const rawCal = e.dataTransfer.getData('application/x-cal-event');
      if (rawCal) {
        let payload;
        try { payload = JSON.parse(rawCal); } catch (err) { return; }
        if (!payload.id || payload.source !== 'manual' || !payload.durMin) return;
        if (calMode !== 'today') return;
        const h = hourFromDrop(e);
        if (h == null) return;
        await rescheduleEvent(payload, h);
        return;
      }

      // Task dragged onto the calendar → create a 1-hour manual block.
      const id = e.dataTransfer.getData('text/plain');
      const t = tasks.find(x => x.id === id);
      if (!t) return;

      let startH;
      if (calMode === 'today') {
        const h = hourFromDrop(e);
        startH = (h != null) ? h : nextHourH();
      } else {
        startH = nextHourH();
      }
      const start = fmtHH(startH) + ':00';
      const end = fmtHH(startH + 1) + ':00';

      try {
        const { error } = await client.from('calendar_events').insert({
          title: t.title,
          date: todayEt(),
          start_time: start,
          end_time: end,
          all_day: false,
          calendar: '',
          color: BLOCK_COLORS[0],
          location: '',
          source: 'manual',
        });
        if (error) throw error;
        await loadCalendar();
        showNotice(`Blocked "${t.title}" ${fmtTime12(start)}–${fmtTime12(end)}`);
      } catch (err) {
        setError('Could not add block: ' + err.message);
      }
    }

    async function calEventToTask(e) {
      e.preventDefault();
      const body = document.querySelector('#taskColumns [data-body="tasks"]');
      body.classList.remove('drag-over');
      const raw = e.dataTransfer.getData('application/x-cal-event');
      if (!raw) return;
      let payload;
      try { payload = JSON.parse(raw); } catch (err) { return; }
      const title = String(payload.title || 'Untitled').trim();
      if (!title) return;
      try {
        const { error } = await client.from('tasks').insert({
          id: nanoid(),
          title: 'TODO: ' + title,
          status: 'pending',
          priority: 'medium',
          project: null,
          description: null,
          source: 'manual',
          created_at: new Date().toISOString(),
        });
        if (error) throw error;
        await loadTasks();
        showNotice(`Added task "TODO: ${title}"`);
      } catch (err) {
        setError('Could not create task: ' + err.message);
      }
    }

    // ---------- Modal ----------
    function openEdit(t, kind = 'task') {
      modalKind = kind;
      editingId = t ? t.id : null;
      const isPerson = kind === 'person';
      const isProject = kind === 'project';
      $('modalTitle').textContent = t
        ? (isProject ? 'Edit Project' : isPerson ? 'Edit Person' : 'Edit Task')
        : (isProject ? 'New Project' : isPerson ? 'New Person' : 'New Task');
      $('fId').value = t ? t.id : '';
      $('fTitle').value = t ? t.title : '';
      $('fDue').value = t ? (t.due_date || '') : '';
      $('fNotes').value = t ? (t.description || '') : '';
      $('fLastContact').value = isPerson && t ? (t.last_contact || '') : '';
      $('fPriorityField').classList.toggle('hidden', isPerson);
      $('fDueField').classList.toggle('hidden', isProject || isPerson);
      $('fRecurField').classList.toggle('hidden', isProject || isPerson);
      $('fPeopleField').classList.toggle('hidden', isPerson);
      $('fLastContactField').classList.toggle('hidden', !isPerson);
      if (isProject || isPerson) {
        $('fProjectField').classList.add('hidden');
        $('fProjectSelectField').classList.add('hidden');
      } else {
        if (t) {
          // Editing an existing task: keep the free-text write-in, prefilled.
          $('fProjectField').classList.remove('hidden');
          $('fProjectSelectField').classList.add('hidden');
          $('fProject').value = t.project || '';
        } else {
        // New task: pick from the live projects list.
        $('fProjectField').classList.add('hidden');
        $('fProjectSelectField').classList.remove('hidden');
        const sel = $('fProjectSelect');
        sel.innerHTML = '<option value="">&#8212; No project &#8212;</option>';
        for (const p of [...projects].sort((a, b) => a.name.localeCompare(b.name))) {
          const opt = document.createElement('option');
          opt.value = p.name;
          opt.textContent = p.name;
          sel.appendChild(opt);
        }
        sel.value = (activeProject !== 'ALL' && projects.some(p => p.name === activeProject)) ? activeProject : '';
        }
      }
      $('fStatus').innerHTML = t
        ? (isPerson ? 'Status: <b>Saved</b>' : `Status: <b>${t.status === 'done' ? 'Completed' : 'Pending'}</b>`)
        : 'Status: <b>Pending</b> (new ' + (isProject ? 'project' : isPerson ? 'person' : 'task') + ')';
      modalPriority = t ? (t.priority || 'medium') : 'medium';
      setPriorityPill();
      modalRecur = t ? (t.recur || '') : '';
      setRecurPill();

      modalPeople = new Set((!isPerson && t && Array.isArray(t.people) ? t.people : []).filter(id => people.some(p => p.id === id)));
      renderPeopleChips();

      const list = $('projectList');
      list.innerHTML = '';
      for (const p of [...new Set(tasks.map(x => x.project).filter(Boolean))].sort()) {
        const opt = document.createElement('option');
        opt.value = p;
        list.appendChild(opt);
      }
      $('deleteBtn').classList.toggle('hidden', !t);
      $('overlay').classList.add('open');
    }

    function renderPeopleChips() {
      const wrap = $('peopleChips');
      if (!people.length) {
        wrap.innerHTML = '<span class="hint">No people yet</span>';
        return;
      }
      wrap.innerHTML = people.map(p =>
        `<span class="tag${modalPeople.has(p.id) ? ' active' : ''}" data-person-id="${p.id}">${escapeHtml(p.name)}</span>`).join('');
      wrap.querySelectorAll('.tag').forEach(ch => {
        ch.onclick = () => {
          const id = ch.dataset.personId;
          if (modalPeople.has(id)) modalPeople.delete(id); else modalPeople.add(id);
          renderPeopleChips();
        };
      });
    }

    function setPriorityPill() {
      document.querySelectorAll('#priorityPills .tag').forEach(p => {
        p.classList.toggle('active', p.dataset.priority === modalPriority);
      });
    }
    function setRecurPill() {
      document.querySelectorAll('#recurPills .tag').forEach(p => {
        p.classList.toggle('active', p.dataset.recur === modalRecur);
      });
    }

    async function save() {
      const title = $('fTitle').value.trim();
      if (!title) { alert('Title is required.'); return; }
      if (modalKind === 'person') {
        const payload = {
          name: title,
          description: $('fNotes').value.trim() || '',
          last_contact: $('fLastContact').value.trim() || null,
          updated_at: new Date().toISOString(),
        };
        try {
          if (editingId) {
            await client.from('people').update(payload).eq('id', editingId);
          } else {
            await client.from('people').insert({
              id: nanoid(),
              created_at: new Date().toISOString(),
              ...payload,
            });
          }
          $('overlay').classList.remove('open');
          await loadPeople();
        } catch (e) {
          setError('Failed to save person: ' + e.message);
        }
        return;
      }
      if (modalKind === 'project') {
        const payload = {
          name: title,
          priority: modalPriority,
          description: $('fNotes').value.trim() || null,
          people: [...modalPeople],
          updated_at: new Date().toISOString(),
        };
        try {
          if (editingId) {
            await client.from('projects').update(payload).eq('id', editingId);
          } else {
            await client.from('projects').insert({
              id: nanoid(),
              status: 'pending',
              ...payload,
            });
          }
          $('overlay').classList.remove('open');
          await loadProjects();
        } catch (e) {
          setError('Failed to save project: ' + e.message);
        }
        return;
      }
      const payload = {
        title,
        due_date: $('fDue').value || null,
        priority: modalPriority,
        recur: modalRecur || null,
        project: (editingId ? $('fProject').value : $('fProjectSelect').value).trim() || null,
        description: $('fNotes').value.trim() || null,
        people: [...modalPeople],
        updated_at: new Date().toISOString(),
      };
      try {
        if (editingId) {
          await client.from('tasks').update(payload).eq('id', editingId);
        } else {
          await client.from('tasks').insert({
            id: nanoid(),
            status: 'pending',
            source: 'manual',
            created_at: new Date().toISOString(),
            ...payload,
          });
        }
        $('overlay').classList.remove('open');
        await loadTasks();
      } catch (e) {
        setError('Failed to save task: ' + e.message);
      }
    }

    async function remove() {
      if (!editingId) return;
      if (!confirm('Delete this ' + (modalKind === 'project' ? 'project' : modalKind === 'person' ? 'person' : 'task') + '?')) return;
      try {
        if (modalKind === 'project') {
          await client.from('projects').delete().eq('id', editingId);
        } else if (modalKind === 'person') {
          await client.from('people').delete().eq('id', editingId);
        } else {
          await client.from('tasks').delete().eq('id', editingId);
        }
        $('overlay').classList.remove('open');
        if (modalKind === 'project') await loadProjects();
        else if (modalKind === 'person') await loadPeople();
        else await loadTasks();
      } catch (e) {
        setError('Failed to delete: ' + e.message);
      }
    }

    // ---------- Wire up ----------
    const rootEl = document.documentElement;
    const storedTheme = localStorage.getItem('personalOSTheme');
    if (storedTheme === 'dark') rootEl.setAttribute('data-theme', 'dark');
    $('themeToggle').onclick = () => {
      const isDark = rootEl.getAttribute('data-theme') === 'dark';
      if (isDark) rootEl.removeAttribute('data-theme');
      else rootEl.setAttribute('data-theme', 'dark');
      localStorage.setItem('personalOSTheme', isDark ? 'light' : 'dark');
    };

    function setProjectsOpen(open) {
      $('projectsPanel').classList.toggle('hidden', !open);
      $('peoplePanel').classList.toggle('hidden', !open);
      $('panels').classList.toggle('projects-open', open);
      $('projectsToggle').textContent = open ? 'Hide Projects' : 'Projects';
      $('projectsToggle').classList.toggle('toggle-active', open);
      localStorage.setItem('personalOSProjectsOpen', open ? '1' : '0');
    }
    $('projectsToggle').onclick = () => setProjectsOpen($('projectsPanel').classList.contains('hidden'));
    setProjectsOpen(localStorage.getItem('personalOSProjectsOpen') === '1');
    loadHiddenEvents();

    $('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('authError').textContent = '';
      const email = $('authEmail').value.trim();
      const password = $('authPass').value;
      if (!email || !password) { $('authError').textContent = 'Enter your email and password.'; return; }
      $('authPass').value = '';
      try {
        const { error } = await client.auth.signInWithPassword({ email, password });
        if (error) throw error;
        await applyAuthState();
        showNotice('Unlocked');
      } catch (err) {
        $('authError').textContent = err.message || 'Sign in failed';
      }
    });

    $('signOutBtn').onclick = async () => {
      await client.auth.signOut();
      await applyAuthState();
    };

    $('newTaskBtn').onclick = () => openEdit(null);
    $('newProjectBtn').onclick = () => openEdit(null, 'project');
    $('newPersonBtn').onclick = () => openEdit(null, 'person');
    $('refreshTasksBtn').onclick = loadTasks;
    $('newBlockBtn').onclick = () => openCalModal(null);
    $('refreshCalBtn').onclick = loadCalendar;
    $('calCancelBtn').onclick = () => $('calOverlay').classList.remove('open');
    $('calSaveBtn').onclick = saveCalBlock;
    $('calDeleteBtn').onclick = deleteCalBlock;
    $('cAllDay').onchange = () => {
      const all = $('cAllDay').checked;
      $('cStart').disabled = all;
      $('cEnd').disabled = all;
    };
    $('cancelBtn').onclick = () => $('overlay').classList.remove('open');
    $('saveBtn').onclick = save;
    $('deleteBtn').onclick = remove;

    // Drag tasks from the tasks panel onto the calendar to create 1-hour blocks;
    // drag calendar events onto the calendar to reschedule, or onto the tasks
    // panel to create a "TODO:" task.
    const calTl = $('calTimeline');
    calTl.ondragover = (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; calTl.classList.add('drag-over'); };
    calTl.ondragleave = () => calTl.classList.remove('drag-over');
    calTl.ondrop = dropTaskOnCalendar;

    const taskBody = document.querySelector('#taskColumns [data-body="tasks"]');
    taskBody.ondragover = (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; taskBody.classList.add('drag-over'); };
    taskBody.ondragleave = () => taskBody.classList.remove('drag-over');
    taskBody.ondrop = calEventToTask;

    document.querySelectorAll('#priorityPills .tag').forEach(p => {
      p.onclick = () => { modalPriority = p.dataset.priority; setPriorityPill(); };
    });
    document.querySelectorAll('#recurPills .tag').forEach(p => {
      p.onclick = () => { modalRecur = p.dataset.recur; setRecurPill(); };
    });

    // ---------- Boot ----------
    async function boot() {
      client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      await applyAuthState();
      // Realtime (works if `tasks` is in the realtime publication; ignored otherwise)
      try {
        client.channel('personal-os')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'tasks' }, () => loadTasks())
          .subscribe();
      } catch (e) { /* noop */ }
      // Polling fallback
      setInterval(() => { loadTasks(); }, 60000);
      setInterval(() => { loadCalendar(); }, 300000);
    }

    boot();
  </script>
</body>
</html>
