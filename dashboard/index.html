<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: #070707;
      color: #fff;
      min-height: 100vh;
    }
    body.light-mode {
      background: #f4f5f7;
      color: #111;
    }

    /* ── Login ─────────────────────────────── */
    #loginForm {
      max-width: 320px;
      margin: 120px auto;
      padding: 0 20px;
    }
    #loginForm h2 {
      font-size: 13px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 24px;
      color: #888;
    }
    .login-field { margin-bottom: 12px; }
    .login-field input {
      width: 100%;
      padding: 10px 12px;
      background: #111;
      border: 1px solid #222;
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color .2s;
    }
    .login-field input:focus { border-color: #0a84ff; }
    .login-btn {
      width: 100%;
      padding: 10px;
      background: #0a84ff;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: opacity .2s;
    }
    .login-btn:hover { opacity: .85; }
    .login-error {
      margin-top: 12px;
      color: #ff453a;
      font-size: 12px;
      min-height: 18px;
    }
    body.light-mode #loginForm h2 { color: #555; }
    body.light-mode .login-field input { background: #fff; border-color: #e3e4e8; color: #111; }

    /* ── Header ─────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid #1a1a1a;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .day-nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .day-nav-btn {
      background: none;
      border: 1px solid #222;
      border-radius: 6px;
      color: #888;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
      transition: all .15s;
    }
    .day-nav-btn:hover { border-color: #fff; color: #fff; }
    .day-label {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      min-width: 200px;
      text-align: center;
    }
    .today-btn {
      background: none;
      border: 1px solid #222;
      border-radius: 6px;
      color: #888;
      padding: 4px 10px;
      font-size: 11px;
      font-family: inherit;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all .15s;
    }
    .today-btn:hover { border-color: #0a84ff; color: #0a84ff; }
    .today-btn.hidden { display: none; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .logout-btn {
      background: none;
      border: 1px solid #222;
      border-radius: 6px;
      color: #555;
      padding: 5px 12px;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      transition: all .15s;
    }
    .logout-btn:hover { border-color: #ff453a; color: #ff453a; }
    body.light-mode .header { border-bottom-color: #e3e4e8; }
    body.light-mode .day-nav-btn { border-color: #e3e4e8; color: #888; }
    body.light-mode .day-nav-btn:hover { border-color: #111; color: #111; }
    body.light-mode .today-btn { border-color: #e3e4e8; color: #888; }
    body.light-mode .today-btn:hover { border-color: #0a84ff; color: #0a84ff; }
    body.light-mode .logout-btn { border-color: #e3e4e8; color: #888; }

    /* ── Layout ─────────────────────────────── */
    .layout {
      display: grid;
      grid-template-columns: minmax(300px, 420px) 1fr;
      height: calc(100vh - 57px);
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; grid-template-rows: 50vh 1fr; }
    }

    /* ── Timeline Panel ─────────────────────── */
    .timeline-panel {
      border-right: 1px solid #1a1a1a;
      overflow-y: auto;
      position: relative;
    }
    body.light-mode .timeline-panel { border-right-color: #e3e4e8; }
    .timeline-hours { position: relative; }
    .hour-slot {
      position: relative;
      height: 60px;
      border-bottom: 1px solid #1a1a1a;
    }
    body.light-mode .hour-slot { border-bottom-color: #eceef1; }
    .hour-label {
      position: absolute;
      top: -7px;
      left: 12px;
      font-size: 10px;
      font-weight: 500;
      color: #444;
      letter-spacing: 0.5px;
      font-variant-numeric: tabular-nums;
      user-select: none;
      z-index: 2;
      background: #070707;
      padding: 0 4px;
    }
    body.light-mode .hour-label { background: #f4f5f7; color: #999; }
    .hour-slot:first-child .hour-label { top: 2px; }

    /* ── Now Indicator ──────────────────────── */
    .now-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: #ff453a;
      z-index: 10;
      pointer-events: none;
    }
    .now-line::before {
      content: '';
      position: absolute;
      left: 6px;
      top: -4px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff453a;
    }

    /* ── Timeline Blocks ────────────────────── */
    .time-block {
      position: absolute;
      left: 48px;
      right: 8px;
      border-radius: 6px;
      padding: 4px 8px;
      overflow: hidden;
      cursor: grab;
      z-index: 5;
      transition: box-shadow .15s;
      user-select: none;
    }
    .time-block:hover { box-shadow: 0 2px 12px rgba(0,0,0,.4); }
    .time-block.dragging { opacity: .5; cursor: grabbing; }
    .time-block.manual {
      background: rgba(10, 132, 255, .2);
      border: 1px solid rgba(10, 132, 255, .4);
    }
    .time-block.calendar-block {
      background: rgba(148, 130, 220, .15);
      border: 1px solid rgba(148, 130, 220, .35);
    }
    .time-block.completed {
      opacity: .4;
    }
    .time-block.completed .block-title {
      text-decoration: line-through;
    }
    .block-title {
      font-size: 11px;
      font-weight: 500;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .block-time {
      font-size: 9px;
      color: #888;
      margin-top: 1px;
      font-variant-numeric: tabular-nums;
    }
    .block-handle {
      position: absolute;
      left: 0;
      right: 0;
      height: 6px;
      cursor: ns-resize;
      z-index: 6;
    }
    .block-handle-top { top: 0; }
    .block-handle-bottom { bottom: 0; }
    .block-check {
      position: absolute;
      top: 4px;
      right: 6px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1.5px solid #555;
      background: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s;
      z-index: 7;
      padding: 0;
    }
    .block-check:hover { border-color: #0a84ff; }
    .block-check.checked {
      background: #0a84ff;
      border-color: #0a84ff;
    }
    .block-check svg { width: 8px; height: 8px; display: none; }
    .block-check.checked svg { display: block; }
    body.light-mode .time-block.manual { background: rgba(10, 132, 255, .1); border-color: rgba(10, 132, 255, .3); }
    body.light-mode .time-block.calendar-block { background: rgba(148, 130, 220, .08); border-color: rgba(148, 130, 220, .25); }

    /* ── Drop Zone Indicator ────────────────── */
    .hour-slot.drag-over {
      background: rgba(10, 132, 255, .06);
    }

    /* ── Backlog Panel ──────────────────────── */
    .backlog-panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .backlog-header {
      padding: 14px 20px 0;
      flex-shrink: 0;
    }
    .backlog-header h2 {
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #555;
      margin-bottom: 10px;
    }
    .filter-tabs {
      display: flex;
      gap: 4px;
    }
    .filter-tab {
      background: none;
      border: 1px solid #222;
      border-radius: 6px;
      color: #555;
      padding: 4px 10px;
      font-size: 11px;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: all .15s;
    }
    .filter-tab:hover { border-color: #888; color: #888; }
    .filter-tab.active { border-color: #0a84ff; color: #0a84ff; }
    body.light-mode .filter-tab { border-color: #e3e4e8; color: #999; }
    body.light-mode .filter-tab.active { border-color: #0a84ff; color: #0a84ff; }
    .backlog-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 20px 20px;
    }
    .backlog-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: #111;
      border: 1px solid #222;
      border-radius: 8px;
      margin-bottom: 6px;
      cursor: grab;
      transition: all .15s;
      user-select: none;
    }
    .backlog-item:hover { border-color: #444; }
    .backlog-item.dragging { opacity: .4; }
    body.light-mode .backlog-item { background: #fff; border-color: #e3e4e8; }
    body.light-mode .backlog-item:hover { border-color: #ccc; }
    .backlog-item-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .backlog-item-dot.manual { background: #0a84ff; }
    .backlog-item-dot.calendar { background: #9482dc; }
    .backlog-item-title {
      font-size: 13px;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .backlog-item-time {
      font-size: 10px;
      color: #555;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }
    .backlog-item-delete {
      background: none;
      border: none;
      color: #333;
      cursor: pointer;
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: all .15s;
    }
    .backlog-item:hover .backlog-item-delete { opacity: 1; }
    .backlog-item-delete:hover { color: #ff453a; }

    /* ── Add Actionable ─────────────────────── */
    .add-row {
      padding: 0 20px 12px;
      flex-shrink: 0;
    }
    .add-btn {
      width: 100%;
      padding: 8px;
      background: none;
      border: 1px dashed #333;
      border-radius: 8px;
      color: #555;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: all .15s;
    }
    .add-btn:hover { border-color: #0a84ff; color: #0a84ff; }
    body.light-mode .add-btn { border-color: #ddd; color: #999; }
    body.light-mode .add-btn:hover { border-color: #0a84ff; color: #0a84ff; }
    .add-input-row {
      display: flex;
      gap: 6px;
    }
    .add-input-row input {
      flex: 1;
      padding: 8px 10px;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color .2s;
    }
    .add-input-row input:focus { border-color: #0a84ff; }
    .add-input-row button {
      padding: 8px 12px;
      background: #0a84ff;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 12px;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
    }
    body.light-mode .add-input-row input { background: #fff; border-color: #e3e4e8; color: #111; }

    /* ── Block Editor Modal ─────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.6);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.hidden { display: none; }
    .modal {
      background: #111;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 20px;
      width: 320px;
      max-width: 90vw;
    }
    body.light-mode .modal { background: #fff; border-color: #e3e4e8; }
    .modal h3 {
      font-size: 13px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #555;
      margin-bottom: 14px;
    }
    .modal-field {
      margin-bottom: 10px;
    }
    .modal-field label {
      display: block;
      font-size: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #555;
      margin-bottom: 4px;
    }
    .modal-field input {
      width: 100%;
      padding: 8px 10px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color .2s;
    }
    .modal-field input:focus { border-color: #0a84ff; }
    body.light-mode .modal-field input { background: #f4f5f7; border-color: #e3e4e8; color: #111; }
    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    .modal-actions button {
      flex: 1;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: opacity .15s;
    }
    .modal-actions button:hover { opacity: .85; }
    .modal-save { background: #0a84ff; color: #fff; }
    .modal-delete { background: #ff453a; color: #fff; }
    .modal-cancel { background: #222; color: #888; border: 1px solid #333; }
    body.light-mode .modal-cancel { background: #f0f0f0; border-color: #ddd; color: #555; }

    /* ── Theme Toggle ───────────────────────── */
    #themeToggle {
      position: fixed;
      bottom: 16px;
      right: 16px;
      background: #111;
      border: 1px solid #222;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      color: #555;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      transition: all .2s;
    }
    #themeToggle:hover { border-color: #555; color: #fff; }
    body.light-mode #themeToggle { background: #fff; border-color: #e3e4e8; color: #999; }

    /* ── Scrollbar ──────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #222; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #333; }
    body.light-mode ::-webkit-scrollbar-thumb { background: #ddd; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="loginForm">
    <h2>Dashboard</h2>
    <form id="authForm">
      <div class="login-field">
        <input type="email" id="authEmail" placeholder="Email" required />
      </div>
      <div class="login-field">
        <input type="password" id="authPass" placeholder="Password" required />
      </div>
      <button type="submit" class="login-btn">Sign in</button>
      <div class="login-error" id="authError"></div>
    </form>
  </div>

  <div id="authGate" class="hidden">
    <div class="header">
      <div class="header-left">
        <div class="day-nav">
          <button class="day-nav-btn" id="prevDay">&larr;</button>
          <span class="day-label" id="dayLabel"></span>
          <button class="day-nav-btn" id="nextDay">&rarr;</button>
        </div>
        <button class="today-btn hidden" id="todayBtn">Today</button>
      </div>
      <div class="header-right">
        <button class="logout-btn" id="logoutBtn">Sign out</button>
      </div>
    </div>

    <div class="layout">
      <div class="timeline-panel" id="timelinePanel">
        <div class="timeline-hours" id="timelineHours"></div>
      </div>

      <div class="backlog-panel">
        <div class="backlog-header">
          <h2>Actionables</h2>
          <div class="filter-tabs">
            <button class="filter-tab active" data-filter="all">All</button>
            <button class="filter-tab" data-filter="scheduled">Scheduled</button>
            <button class="filter-tab" data-filter="pending">Pending</button>
          </div>
        </div>
        <div class="add-row" id="addRow">
          <button class="add-btn" id="addBtn">+ New actionable</button>
          <div class="add-input-row hidden" id="addInputRow">
            <input type="text" id="addInput" placeholder="What needs doing?" />
            <button id="addSubmit">Add</button>
          </div>
        </div>
        <div class="backlog-list" id="backlogList"></div>
      </div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal">
      <h3>Edit Actionable</h3>
      <div class="modal-field">
        <label>Title</label>
        <input type="text" id="modalTitle" />
      </div>
      <div class="modal-field">
        <label>Start Time (HH:MM)</label>
        <input type="time" id="modalStart" />
      </div>
      <div class="modal-field">
        <label>End Time (HH:MM)</label>
        <input type="time" id="modalEnd" />
      </div>
      <div class="modal-actions">
        <button class="modal-save" id="modalSave">Save</button>
        <button class="modal-delete" id="modalDelete">Delete</button>
        <button class="modal-cancel" id="modalCancel">Cancel</button>
      </div>
    </div>
  </div>

  <button id="themeToggle" title="Toggle color scheme">&#9681;</button>

  <script>
    const SUPABASE_URL = "https://heyrtjzntnicqsfemcmi.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhleXJ0anpudG5pY3FzZmVtY21pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3OTU3NDksImV4cCI6MjA5OTM3MTc0OX0.MwivwC-MUgI7J4-bH5ahjuL8YLQYPsR1vzcRVlpoTNo";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const TZ = "America/New_York";

    const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const DAY_NAMES_FULL = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

    const HOUR_START = 6;
    const HOUR_END = 22;
    const HOUR_PX = 60;

    let state = {
      actionables: [],
      calendar: [],
      selectedDate: todayEt(),
      filter: "all",
      editingId: null,
    };

    /* ── Helpers ─────────────────────────────── */

    function esc(s) {
      if (s === null || s === undefined) return "";
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
    }

    function todayEt() {
      return new Date().toLocaleDateString("en-CA", { timeZone: TZ });
    }

    function generateId() {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
      const values = crypto.getRandomValues(new Uint8Array(21));
      return values.reduce((acc, x) => acc + chars[x & 63], "");
    }

    function addDays(dateStr, days) {
      const d = new Date(dateStr + "T12:00:00");
      d.setDate(d.getDate() + days);
      return d.toLocaleDateString("en-CA", { timeZone: TZ });
    }

    function formatDateLabel(dateStr) {
      const d = new Date(dateStr + "T12:00:00");
      const day = d.getDate();
      const suffix = (n) => {
        if (n > 3 && n < 21) return "th";
        switch (n % 10) {
          case 1: return "st"; case 2: return "nd"; case 3: return "rd"; default: return "th";
        }
      };
      return `${DAY_NAMES_FULL[d.getDay()]}, ${MONTH_NAMES[d.getMonth()]} ${day}${suffix(day)}`;
    }

    function timeToMinutes(t) {
      if (!t) return null;
      const [h, m] = t.split(":").map(Number);
      return h * 60 + m;
    }

    function minutesToTime(mins) {
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
    }

    function formatTimeRange(start, end) {
      if (!start || !end) return "";
      const fmt = (t) => {
        const [h, m] = t.split(":").map(Number);
        const ampm = h >= 12 ? "PM" : "AM";
        const h12 = h % 12 || 12;
        return m === 0 ? `${h12} ${ampm}` : `${h12}:${String(m).padStart(2,"0")} ${ampm}`;
      };
      return `${fmt(start)} – ${fmt(end)}`;
    }

    function parseIsoToTime(isoStr) {
      const d = new Date(isoStr);
      const h = d.toLocaleString("en-US", { timeZone: TZ, hour: "numeric", hour12: false });
      const m = d.toLocaleString("en-US", { timeZone: TZ, minute: "2-digit" });
      return `${String(+h).padStart(2,"0")}:${m}`;
    }

    function parseIsoToDate(isoStr) {
      return new Date(isoStr).toLocaleDateString("en-CA", { timeZone: TZ });
    }

    function checkSvg() {
      return '<svg viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2"><polyline points="2 6 5 9 10 3"/></svg>';
    }

    function trashSvg() {
      return '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5h10M5.5 4.5V3a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v1.5M6.5 7v4M9.5 7v4M4.5 4.5l.5 8.5a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1l.5-8.5"/></svg>';
    }

    /* ── Data Loading ────────────────────────── */

    async function loadAll() {
      const { data: { session } } = await db.auth.getSession();
      const token = session?.access_token || "";

      const [actRes, icsRes] = await Promise.all([
        db.from("actionables").select("*"),
        fetch(SUPABASE_URL + "/functions/v1/calendar-proxy", {
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: `Bearer ${token}`,
          }
        }).then(r => r.ok ? r.json() : { events: [] }).catch(() => ({ events: [] })),
      ]);
      if (actRes.error) throw actRes.error;
      state.actionables = actRes.data || [];
      state.calendar = (icsRes.events || []).map(e => ({
        id: "cal_" + btoa(e.title + e.start).replace(/[^a-zA-Z0-9]/g,"").slice(0,21),
        title: e.title,
        date: parseIsoToDate(e.start),
        start_time: parseIsoToTime(e.start),
        end_time: null,
        completed: false,
        source: "calendar",
      }));
    }

    /* ── Render ──────────────────────────────── */

    function renderHeader() {
      document.getElementById("dayLabel").textContent = formatDateLabel(state.selectedDate);
      const today = todayEt();
      document.getElementById("todayBtn").classList.toggle("hidden", state.selectedDate === today);
    }

    function renderTimeline() {
      const container = document.getElementById("timelineHours");
      const date = state.selectedDate;

      const dayActionables = state.actionables.filter(a => a.date === date);
      const dayCal = state.calendar.filter(c => c.date === date);
      const allBlocks = [...dayActionables, ...dayCal];

      let html = "";
      for (let h = HOUR_START; h <= HOUR_END; h++) {
        const label = h === 0 ? "12 AM" : h < 12 ? `${h} AM` : h === 12 ? "12 PM" : `${h-12} PM`;
        html += `<div class="hour-slot" data-hour="${h}">
          <span class="hour-label">${label}</span>
        </div>`;
      }
      container.innerHTML = html;

      allBlocks.forEach(block => {
        if (!block.start_time) return;
        const startMin = timeToMinutes(block.start_time);
        const endMin = block.end_time ? timeToMinutes(block.end_time) : startMin + 60;
        if (startMin < HOUR_START * 60 || startMin >= HOUR_END * 60) return;

        const top = (startMin - HOUR_START * 60) * (HOUR_PX / 60);
        const height = Math.max((endMin - startMin) * (HOUR_PX / 60), 20);
        const src = block.source === "calendar" ? "calendar-block" : "manual";
        const comp = block.completed ? " completed" : "";

        const slot = container.querySelector(`[data-hour="${Math.floor(startMin / 60)}"]`);
        if (!slot) return;

        const blockEl = document.createElement("div");
        blockEl.className = `time-block ${src}${comp}`;
        blockEl.dataset.id = block.id;
        blockEl.dataset.source = block.source || "manual";
        blockEl.draggable = block.source !== "calendar";
        blockEl.style.top = top + "px";
        blockEl.style.height = height + "px";

        const canEdit = block.source !== "calendar";
        const checkClass = block.completed ? " checked" : "";

        blockEl.innerHTML = `
          <div class="block-handle block-handle-top"></div>
          <div class="block-handle block-handle-bottom"></div>
          ${canEdit ? `<button class="block-check${checkClass}" data-id="${block.id}">${checkSvg()}</button>` : ""}
          <div class="block-title">${esc(block.title)}</div>
          <div class="block-time">${formatTimeRange(block.start_time, block.end_time)}</div>
        `;

        if (canEdit) {
          blockEl.addEventListener("dblclick", () => openModal(block.id));
          blockEl.querySelector(".block-check").addEventListener("click", (e) => {
            e.stopPropagation();
            toggleComplete(block.id);
          });
          setupBlockDrag(blockEl);
          setupBlockResize(blockEl);
        }

        slot.appendChild(blockEl);
      });

      renderNowLine();
    }

    function renderNowLine() {
      document.querySelectorAll(".now-line").forEach(el => el.remove());
      if (state.selectedDate !== todayEt()) return;

      const now = new Date();
      const h = now.getHours();
      const m = now.getMinutes();
      if (h < HOUR_START || h > HOUR_END) return;

      const slot = document.querySelector(`[data-hour="${h}"]`);
      if (!slot) return;

      const line = document.createElement("div");
      line.className = "now-line";
      line.style.top = (m * HOUR_PX / 60) + "px";
      slot.appendChild(line);
    }

    function renderBacklog() {
      const list = document.getElementById("backlogList");
      let items = state.actionables.filter(a => !a.date);

      if (state.filter === "scheduled") items = items.filter(a => a.start_time);
      else if (state.filter === "pending") items = items.filter(a => !a.start_time);

      if (items.length === 0) {
        list.innerHTML = `<div style="text-align:center;color:#333;font-size:12px;padding:40px 0;">No actionables</div>`;
        return;
      }

      list.innerHTML = items.map(a => `
        <div class="backlog-item" draggable="true" data-id="${a.id}">
          <div class="backlog-item-dot ${a.source || "manual"}"></div>
          <span class="backlog-item-title">${esc(a.title)}</span>
          ${a.start_time ? `<span class="backlog-item-time">${esc(a.start_time)}</span>` : ""}
          <button class="backlog-item-delete" data-id="${a.id}">${trashSvg()}</button>
        </div>
      `).join("");

      list.querySelectorAll(".backlog-item").forEach(el => {
        el.addEventListener("dragstart", (e) => {
          e.dataTransfer.setData("text/plain", el.dataset.id);
          e.dataTransfer.effectAllowed = "move";
          el.classList.add("dragging");
        });
        el.addEventListener("dragend", () => el.classList.remove("dragging"));
      });

      list.querySelectorAll(".backlog-item-delete").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          deleteActionable(btn.dataset.id);
        });
      });
    }

    function render() {
      renderHeader();
      renderTimeline();
      renderBacklog();
    }

    /* ── Drag & Drop: Backlog → Timeline ────── */

    function setupDropZones() {
      document.querySelectorAll(".hour-slot").forEach(slot => {
        slot.addEventListener("dragover", (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
          slot.classList.add("drag-over");
        });
        slot.addEventListener("dragleave", () => slot.classList.remove("drag-over"));
        slot.addEventListener("drop", (e) => {
          e.preventDefault();
          slot.classList.remove("drag-over");
          const id = e.dataTransfer.getData("text/plain");
          if (!id) return;

          const rect = slot.getBoundingClientRect();
          const yInSlot = e.clientY - rect.top;
          const hour = +slot.dataset.hour;
          const totalMins = hour * 60 + Math.round(yInSlot / HOUR_PX * 60 / 15) * 15;
          const clamped = Math.max(HOUR_START * 60, Math.min(totalMins, HOUR_END * 60 - 60));

          scheduleActionable(id, state.selectedDate, minutesToTime(clamped), minutesToTime(clamped + 60));
        });
      });
    }

    /* ── Drag: Move block on timeline ───────── */

    function setupBlockDrag(blockEl) {
      let startY, startTop, startMin, blockHeight;

      blockEl.addEventListener("mousedown", (e) => {
        if (e.target.closest(".block-check") || e.target.closest(".block-handle")) return;
        e.preventDefault();
        startY = e.clientY;
        startTop = parseFloat(blockEl.style.top);
        blockHeight = parseFloat(blockEl.style.height);
        startMin = startTop / HOUR_PX * 60 + HOUR_START * 60;

        const onMove = (e2) => {
          const dy = e2.clientY - startY;
          let newTop = Math.max(0, Math.min(startTop + dy, HOUR_END * 60 * HOUR_PX / 60 - blockHeight));
          newTop = Math.round(newTop / (15 * HOUR_PX / 60)) * (15 * HOUR_PX / 60);
          blockEl.style.top = newTop + "px";
          blockEl.classList.add("dragging");
        };

        const onUp = (e2) => {
          document.removeEventListener("mousemove", onMove);
          document.removeEventListener("mouseup", onUp);
          blockEl.classList.remove("dragging");

          const finalTop = parseFloat(blockEl.style.top);
          const newStartMin = Math.round(finalTop / HOUR_PX * 60 + HOUR_START * 60);
          const duration = blockHeight / HOUR_PX * 60;
          const id = blockEl.dataset.id;
          moveActionable(id, minutesToTime(newStartMin), minutesToTime(newStartMin + duration));
        };

        document.addEventListener("mousemove", onMove);
        document.addEventListener("mouseup", onUp);
      });
    }

    /* ── Resize: drag block edges ────────────── */

    function setupBlockResize(blockEl) {
      blockEl.querySelectorAll(".block-handle").forEach(handle => {
        handle.addEventListener("mousedown", (e) => {
          e.preventDefault();
          e.stopPropagation();
          const isTop = handle.classList.contains("block-handle-top");
          const startY = e.clientY;
          const origTop = parseFloat(blockEl.style.top);
          const origHeight = parseFloat(blockEl.style.height);

          const onMove = (e2) => {
            const dy = e2.clientY - startY;
            if (isTop) {
              let newTop = Math.max(0, origTop + dy);
              let newHeight = origHeight - (newTop - origTop);
              newHeight = Math.max(newHeight, 15);
              newTop = Math.round(newTop / (15 * HOUR_PX / 60)) * (15 * HOUR_PX / 60);
              blockEl.style.top = newTop + "px";
              blockEl.style.height = newHeight + "px";
            } else {
              let newHeight = Math.max(15, origHeight + dy);
              newHeight = Math.round(newHeight / (15 * HOUR_PX / 60)) * (15 * HOUR_PX / 60);
              blockEl.style.height = newHeight + "px";
            }
            blockEl.classList.add("dragging");
          };

          const onUp = () => {
            document.removeEventListener("mousemove", onMove);
            document.removeEventListener("mouseup", onUp);
            blockEl.classList.remove("dragging");

            const finalTop = parseFloat(blockEl.style.top);
            const finalHeight = parseFloat(blockEl.style.height);
            const newStartMin = Math.round(finalTop / HOUR_PX * 60 + HOUR_START * 60);
            const newEndMin = Math.round((finalTop + finalHeight) / HOUR_PX * 60 + HOUR_START * 60);
            const id = blockEl.dataset.id;
            moveActionable(id, minutesToTime(newStartMin), minutesToTime(newEndMin));
          };

          document.addEventListener("mousemove", onMove);
          document.addEventListener("mouseup", onUp);
        });
      });
    }

    /* ── Mutations ───────────────────────────── */

    async function addActionable(title) {
      const id = generateId();
      const optimistic = { id, title, date: null, start_time: null, end_time: null, completed: false, source: "manual" };
      state.actionables.push(optimistic);
      render();
      const res = await db.from("actionables").insert(optimistic);
      if (res.error) {
        state.actionables = state.actionables.filter(a => a.id !== id);
        render();
      }
    }

    async function scheduleActionable(id, date, startTime, endTime) {
      const item = state.actionables.find(a => a.id === id);
      if (!item) return;
      const prev = { date: item.date, start_time: item.start_time, end_time: item.end_time };
      item.date = date;
      item.start_time = startTime;
      item.end_time = endTime;
      render();
      const res = await db.from("actionables").update({ date, start_time: startTime, end_time: endTime }).eq("id", id);
      if (res.error) {
        Object.assign(item, prev);
        render();
      }
    }

    async function moveActionable(id, startTime, endTime) {
      const item = state.actionables.find(a => a.id === id);
      if (!item) return;
      const prev = { start_time: item.start_time, end_time: item.end_time };
      item.start_time = startTime;
      item.end_time = endTime;
      render();
      const res = await db.from("actionables").update({ start_time: startTime, end_time: endTime }).eq("id", id);
      if (res.error) {
        Object.assign(item, prev);
        render();
      }
    }

    async function toggleComplete(id) {
      const item = state.actionables.find(a => a.id === id);
      if (!item) return;
      const prev = item.completed;
      item.completed = !item.completed;
      render();
      const res = await db.from("actionables").update({ completed: item.completed }).eq("id", id);
      if (res.error) {
        item.completed = prev;
        render();
      }
    }

    async function deleteActionable(id) {
      const idx = state.actionables.findIndex(a => a.id === id);
      if (idx === -1) return;
      const removed = state.actionables.splice(idx, 1)[0];
      render();
      const res = await db.from("actionables").delete().eq("id", id);
      if (res.error) {
        state.actionables.splice(idx, 0, removed);
        render();
      }
    }

    async function updateActionable(id, fields) {
      const item = state.actionables.find(a => a.id === id);
      if (!item) return;
      const prev = {};
      for (const k in fields) { prev[k] = item[k]; item[k] = fields[k]; }
      render();
      const res = await db.from("actionables").update(fields).eq("id", id);
      if (res.error) {
        Object.assign(item, prev);
        render();
      }
    }

    /* ── Modal ───────────────────────────────── */

    function openModal(id) {
      const item = state.actionables.find(a => a.id === id);
      if (!item || item.source === "calendar") return;
      state.editingId = id;
      document.getElementById("modalTitle").value = item.title;
      document.getElementById("modalStart").value = item.start_time || "";
      document.getElementById("modalEnd").value = item.end_time || "";
      document.getElementById("modalOverlay").classList.remove("hidden");
      document.getElementById("modalTitle").focus();
    }

    function closeModal() {
      state.editingId = null;
      document.getElementById("modalOverlay").classList.add("hidden");
    }

    /* ── Init ────────────────────────────────── */

    document.getElementById("authForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("authEmail").value;
      const pass = document.getElementById("authPass").value;
      const { error } = await db.auth.signInWithPassword({ email, password: pass });
      if (error) {
        document.getElementById("authError").textContent = error.message;
        return;
      }
      showDashboard();
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await db.auth.signOut();
      document.getElementById("authGate").classList.add("hidden");
      document.getElementById("loginForm").style.display = "";
    });

    function showDashboard() {
      document.getElementById("loginForm").style.display = "none";
      document.getElementById("authGate").classList.remove("hidden");
      loadAll().then(() => {
        render();
        setupDropZones();
      }).catch(e => console.error("loadAll failed:", e));
    }

    /* ── Event Listeners ─────────────────────── */

    document.getElementById("prevDay").addEventListener("click", () => {
      state.selectedDate = addDays(state.selectedDate, -1);
      render();
      setupDropZones();
    });

    document.getElementById("nextDay").addEventListener("click", () => {
      state.selectedDate = addDays(state.selectedDate, 1);
      render();
      setupDropZones();
    });

    document.getElementById("todayBtn").addEventListener("click", () => {
      state.selectedDate = todayEt();
      render();
      setupDropZones();
    });

    document.querySelectorAll(".filter-tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".filter-tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        state.filter = tab.dataset.filter;
        renderBacklog();
      });
    });

    document.getElementById("addBtn").addEventListener("click", () => {
      document.getElementById("addBtn").classList.add("hidden");
      document.getElementById("addInputRow").classList.remove("hidden");
      document.getElementById("addInput").focus();
    });

    document.getElementById("addSubmit").addEventListener("click", () => {
      const input = document.getElementById("addInput");
      const val = input.value.trim();
      if (val) {
        addActionable(val);
        input.value = "";
      }
    });

    document.getElementById("addInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const val = e.target.value.trim();
        if (val) { addActionable(val); e.target.value = ""; }
      }
      if (e.key === "Escape") {
        e.target.value = "";
        document.getElementById("addBtn").classList.remove("hidden");
        document.getElementById("addInputRow").classList.add("hidden");
      }
    });

    document.getElementById("addInput").addEventListener("blur", () => {
      setTimeout(() => {
        document.getElementById("addBtn").classList.remove("hidden");
        document.getElementById("addInputRow").classList.add("hidden");
      }, 150);
    });

    document.getElementById("modalSave").addEventListener("click", () => {
      if (!state.editingId) return;
      const title = document.getElementById("modalTitle").value.trim();
      const start = document.getElementById("modalStart").value || null;
      const end = document.getElementById("modalEnd").value || null;
      if (title) updateActionable(state.editingId, { title, start_time: start, end_time: end });
      closeModal();
    });

    document.getElementById("modalDelete").addEventListener("click", () => {
      if (state.editingId) deleteActionable(state.editingId);
      closeModal();
    });

    document.getElementById("modalCancel").addEventListener("click", closeModal);

    document.getElementById("modalOverlay").addEventListener("click", (e) => {
      if (e.target === e.currentTarget) closeModal();
    });

    document.getElementById("themeToggle").addEventListener("click", () => {
      document.body.classList.toggle("light-mode");
      localStorage.setItem("theme", document.body.classList.contains("light-mode") ? "light" : "dark");
    });

    /* ── Auto-refresh ────────────────────────── */
    setInterval(() => {
      if (!document.getElementById("authGate").classList.contains("hidden")) {
        loadAll().then(() => { render(); setupDropZones(); }).catch(e => console.error("refresh failed:", e));
      }
    }, 60000);

    /* ── Boot ────────────────────────────────── */
    if (localStorage.getItem("theme") === "light") document.body.classList.add("light-mode");

    (async () => {
      const { data: { session } } = await db.auth.getSession();
      if (session) showDashboard();
    })();
  </script>
</body>
</html>
