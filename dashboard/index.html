<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal OS</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f4f5f7;
      --bg-2: #eceef1;
      --card: #ffffff;
      --panel: #fafbfc;
      --border: #dfe1e6;
      --text: #1f2933;
      --muted: #6b7280;
      --accent: #0a7e3d;
      --accent-dim: #4aa06b;
      --pending: #0a7e3d;
      --done: #b8860b;
      --warn: #d64545;
      --on-accent: #ffffff;
      --on-warn: #ffffff;
      --on-complete: #ffffff;
      --low: #8a938c;
      --calendar-google: #0a84ff;
      --calendar-outlook: #ff9f0a;
      --glow: rgba(10,126,61,0.06);
      --scanline: rgba(0,0,0,0.05);
      --shadow: 0 1px 3px rgba(0,0,0,0.12);
    }
    :root[data-theme="dark"] {
      --bg: #101310;
      --bg-2: #151a15;
      --card: #0d100d;
      --panel: #141914;
      --border: #2b352b;
      --text: #c8d6c8;
      --muted: #6f8070;
      --accent: #33ff66;
      --accent-dim: #1f7a3a;
      --pending: #33ff66;
      --done: #ffb000;
      --warn: #ff5a3c;
      --on-accent: #06100a;
      --on-warn: #1a0500;
      --on-complete: #1a1200;
      --low: #59605a;
      --calendar-google: #33aaff;
      --calendar-outlook: #ffb000;
      --glow: rgba(51,255,102,0.05);
      --scanline: rgba(0,0,0,0.14);
      --shadow: 0 0 0 1px rgba(51,255,102,0.06), 0 0 18px rgba(0,0,0,0.6);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "SFMono-Regular", ui-monospace, "Cascadia Mono", "IBM Plex Mono", Menlo, Consolas, monospace;
      background: var(--bg);
      color: var(--text);
      background-image:
        radial-gradient(circle at 50% 0%, var(--glow), transparent 60%),
        repeating-linear-gradient(0deg, var(--scanline) 0 1px, transparent 1px 3px);
      min-height: 100vh;
    }
    .hidden { display: none !important; }
    .layout {
      padding: 14px;
      max-width: 1440px;
      margin: 0 auto;
    }
    .main { min-width: 0; }

    /* Header */
    .topbar {
      background: var(--bg-2);
      color: var(--accent);
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }
    .topbar::before { content: "▮"; color: var(--accent); animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .topbar .who { color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 1px; }
    .topbar button {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 6px 12px;
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
    }
    .topbar button:hover { background: var(--accent); color: var(--on-accent); }
    .topbar .theme-toggle { margin-left: auto; opacity: 0.55; font-weight: 600; font-size: 10px; letter-spacing: 1px; padding: 4px 8px; }
    .topbar .theme-toggle:hover { opacity: 1; }

    /* Login */
    #loginForm .lbox { margin: 0; }
    .lbox { border: 1px solid var(--border); background: var(--panel); padding: 26px; box-shadow: var(--shadow); width: 400px; max-width: 94vw; }
    .lbox h2 { margin: 0 0 18px 0; font-size: 15px; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }
    .lbox h2::before { content: "▮"; margin-right: 6px; animation: blink 1.1s steps(1) infinite; }
    .login-field { margin-bottom: 12px; }
    .login-field input {
      width: 100%; padding: 9px; background: var(--bg); color: var(--text);
      border: 1px solid var(--border); font-family: inherit; font-size: 13px;
    }
    .login-field input:focus { outline: none; border-color: var(--accent); }
    .login-btn {
      width: 100%; padding: 9px; background: var(--accent); color: var(--on-accent);
      border: 1px solid var(--accent); font-family: inherit; font-size: 12px; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
    }
    .login-btn:hover { filter: brightness(1.1); }
    .login-error { margin-top: 10px; color: var(--warn); font-size: 12px; min-height: 16px; }
    .conn-error {
      background: rgba(255,90,60,0.1); color: var(--warn); border: 1px solid var(--warn);
      padding: 10px 16px; margin: 14px 0 0 0; font-size: 13px;
    }
    .conn-error.notice {
      background: rgba(10,126,61,0.08); color: var(--accent); border-color: var(--accent-dim);
    }

    /* Panels */
    .panels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      align-items: start;
      margin-top: 14px;
    }
    .panel { margin-top: 0; min-width: 0; }
    .panel-head {
      padding: 10px 12px;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      border-bottom: none;
      background: var(--bg-2);
      color: var(--accent);
    }
    .panel-head .dot { width: 8px; height: 8px; background: var(--accent); }
    .panel-head .last-updated { font-size: 10px; color: var(--muted); font-weight: 600; letter-spacing: 0.5px; text-transform: none; }
    .panel-head .panel-action {
      margin-left: auto;
      border: 1px solid var(--accent); background: transparent; color: var(--accent);
      font-family: inherit; font-size: 11px; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; padding: 5px 10px; cursor: pointer;
    }
    .panel-head .panel-action:hover { background: var(--accent); color: var(--on-accent); }

    /* Tagbar */
    .tagbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      align-items: center;
    }
    .tagbar .label { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: all 0.1s ease;
    }
    .tag:hover { color: var(--text); border-color: var(--accent); }
    .tag.active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    .tag .loc-dot { flex: none; width: 8px; height: 8px; }
    .completed-toggle {
      padding: 4px 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: all 0.1s ease;
    }
    .completed-toggle:hover { color: var(--text); border-color: var(--done); }
    .completed-toggle.active { background: var(--done); border-color: var(--done); color: var(--on-complete); }

    /* Columns */
    .columns {
      display: grid;
      gap: 14px;
      border: 1px solid var(--border);
      border-top: none;
      padding: 14px;
      background: var(--panel);
    }
    #taskColumns { grid-template-columns: 1fr; }
    #taskColumns.show-completed { grid-template-columns: repeat(2, 1fr); }
    #taskColumns .column.completed-col { display: none; }
    #taskColumns.show-completed .column.completed-col { display: flex; }
    .column {
      background: var(--panel);
      border: 1px solid var(--border);
      max-height: calc(100vh - 300px);
      display: flex;
      flex-direction: column;
    }
    .col-head {
      padding: 10px 12px;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
    }
    .col-head .dot { width: 8px; height: 8px; background: currentColor; }
    .col-head .count { color: var(--accent); font-weight: 700; margin-left: auto; }
    .col-body { padding: 8px; overflow-y: auto; flex: 1 1 auto; }
    .empty { color: var(--muted); font-size: 12px; padding: 12px; text-align: center; font-style: italic; }

    /* Calendar timeline */
    .cal-timeline {
      border: 1px solid var(--border);
      border-top: none;
      padding: 14px;
      background: var(--panel);
      max-height: calc(100vh - 300px);
      overflow: auto;
    }
    .tl-week { display: flex; gap: 12px; align-items: flex-start; min-width: 0; }
    .tl-rail { min-width: 0; }
    .tl-week .tl-rail { flex: 1 1 0; min-width: 128px; }
    .tl-head {
      display: flex; align-items: baseline; gap: 8px;
      padding: 0 0 10px 0; font-weight: 700; font-size: 12px;
      letter-spacing: 1px; color: var(--accent); white-space: nowrap;
    }
    .tl-head .tl-date { color: var(--muted); font-weight: 600; font-size: 11px; letter-spacing: 0.5px; }
    .tl-head .tl-n { margin-left: auto; color: var(--low); font-size: 10px; letter-spacing: 0; }
    .blk.allday {
      position: relative; margin-bottom: 6px; padding: 5px 8px;
      border: 1px solid var(--border); border-left-width: 3px;
      background: var(--card); font-size: 11px;
      display: flex; align-items: center; gap: 8px; overflow: hidden;
    }
    .blk.allday .b-label { color: var(--low); font-size: 9px; letter-spacing: 1px; font-weight: 700; flex: none; }
    .tl-body { display: flex; align-items: stretch; gap: 8px; }
    .tl-ticks { position: relative; flex: none; width: 46px; color: var(--low); font-size: 10px; }
    .tl-tick { position: absolute; right: 0; white-space: nowrap; }
    .tl-grid { position: relative; flex: 1 1 auto; min-width: 0; }
    .tl-hourline { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--border); }
    .blk {
      position: absolute; left: 4px; right: 4px; overflow: hidden;
      padding: 3px 6px; box-sizing: border-box;
      border-left: 3px solid var(--border);
      background: var(--card);
      font-size: 10px; line-height: 1.35; word-break: break-word;
    }
    .blk .b-title { font-weight: 700; color: var(--text); }
    .blk .b-time { color: var(--low); }
    .tl-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--low); font-size: 11px; font-style: italic; }
    .tl-later { display: flex; flex-direction: column; gap: 10px; }
    .later-row { border: 1px solid var(--border); background: var(--panel); }
    .later-date { padding: 8px 10px; border-bottom: 1px solid var(--border); color: var(--accent); font-weight: 700; font-size: 12px; letter-spacing: 1px; }
    .later-cards { padding: 8px; }
    .tl-count { color: var(--low); font-size: 10px; margin-left: 2px; }
    .tag.active .tl-count { color: var(--on-accent); opacity: 0.75; }

    /* Cards */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 3px solid var(--assigned, var(--border));
      padding: 10px;
      margin-bottom: 8px;
      transition: border-color 0.1s, box-shadow 0.1s;
    }
    .card.task { cursor: pointer; }
    .card.task:hover { border-color: var(--accent-dim); box-shadow: var(--shadow); }
    .card .title { font-weight: 700; font-size: 13px; margin-bottom: 8px; color: var(--text); word-break: break-word; }
    .card .meta { font-size: 11px; color: var(--muted); }
    .card .meta .row { margin: 2px 0; word-break: break-word; }
    .card .meta .row.desc { color: var(--text); }
    .card .due { font-size: 11px; font-weight: 700; color: var(--muted); }
    .card .due.overdue { color: var(--warn); }
    .badge {
      display: inline-block;
      border: 1px solid var(--border);
      padding: 1px 6px;
      margin: 2px 4px 2px 0;
      font-size: 11px;
      color: var(--accent);
      background: transparent;
    }
    .badge.p-l { color: var(--low); border-color: var(--low); }
    .badge.p-m { color: var(--accent); border-color: var(--accent); }
    .badge.p-h { color: var(--done); border-color: var(--done); }
    .badge.p-u { color: var(--warn); border-color: var(--warn); }
    .card-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }
    .card-actions button {
      border: 1px solid var(--border); background: transparent;
      color: var(--muted); padding: 3px 10px; font-family: inherit; font-size: 10px; font-weight: 700;
      letter-spacing: 0.5px; cursor: pointer;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
    }
    .card-actions button:hover { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    .card-actions .go-back:hover { background: var(--done); border-color: var(--done); color: var(--on-complete); }

    /* Modal */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: none; align-items: center; justify-content: center; z-index: 10;
    }
    .overlay.open { display: flex; }
    .modal {
      background: var(--bg-2); border: 1px solid var(--accent-dim); width: 440px; max-width: 94vw;
      max-height: 92vh; overflow-y: auto; padding: 22px; box-shadow: var(--shadow);
    }
    .modal h2 { margin: 0 0 16px 0; font-size: 15px; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .field .req { color: var(--warn); }
    .field .hint { color: var(--muted); font-size: 11px; margin-left: 4px; font-weight: 400; text-transform: none; letter-spacing: 0; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 7px; background: var(--bg); color: var(--text);
      border: 1px solid var(--border); font-family: inherit; font-size: 13px;
    }
    .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
    .field textarea { resize: vertical; min-height: 60px; }
    .status-line { font-size: 12px; color: var(--muted); padding: 8px; border: 1px solid var(--border); background: var(--bg); }
    .status-line b { color: var(--accent); }
    .modal-actions { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; }
    .modal-actions button {
      padding: 6px 14px; border: 1px solid var(--border); background: transparent; color: var(--text);
      font-family: inherit; font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
      transition: background 0.1s, color 0.1s;
    }
    .modal-actions button:hover { border-color: var(--accent); color: var(--accent); }
    .btn-primary { background: var(--accent) !important; color: var(--on-accent) !important; border-color: var(--accent) !important; }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-danger { background: var(--warn) !important; color: var(--on-warn) !important; border-color: var(--warn) !important; }
    .status-pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .status-pills .tag { width: auto; }

    @media (max-width: 900px) {
      .panels { grid-template-columns: 1fr; }
      .panel + .panel { margin-top: 14px; }
      #taskColumns.show-completed { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <!-- Login (overlay, only when signed out) -->
  <div class="overlay" id="loginForm">
    <div class="lbox">
      <h2>Personal OS</h2>
      <form id="authForm">
        <div class="login-field">
          <input type="email" id="authEmail" placeholder="Email" autocomplete="email" required />
        </div>
        <div class="login-field">
          <input type="password" id="authPass" placeholder="Password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="login-btn">Sign in</button>
        <div class="login-error" id="authError"></div>
      </form>
      <div class="modal-actions" style="margin-top:8px;padding:0">
        <button id="loginCancelBtn" style="width:100%">Cancel</button>
      </div>
    </div>
  </div>

  <!-- App -->
  <div id="os">
    <header class="topbar">
      Personal OS
      <span class="who" id="whoAmI"></span>
      <button id="themeToggle" class="theme-toggle" title="Toggle dark mode">light / dark</button>
      <button id="signInBtn" class="hidden">Sign in</button>
      <button id="signOutBtn" class="hidden">Sign out</button>
    </header>

    <div class="layout">
      <div class="main">
        <div class="conn-error hidden" id="connError"></div>

        <div class="panels">
        <!-- TASKS PANEL -->
        <section class="panel">
          <div class="panel-head">
            <span class="dot"></span>
            Tasks
            <button class="panel-action" id="refreshTasksBtn">&#8635; Refresh</button>
            <button class="panel-action" id="newTaskBtn" style="margin-left:0">+ New Task</button>
          </div>
          <div class="tagbar" id="taskTagbar"></div>
          <div class="columns" id="taskColumns">
            <div class="column" data-status="pending">
              <div class="col-head">
                <span class="dot" style="background:var(--pending)"></span>
                PENDING <span class="count" data-count="pending"></span>
              </div>
              <div class="col-body" data-body="pending"></div>
            </div>
            <div class="column completed-col" data-status="done">
              <div class="col-head">
                <span class="dot" style="background:var(--done)"></span>
                COMPLETED <span class="count" data-count="done"></span>
              </div>
              <div class="col-body" data-body="done"></div>
            </div>
          </div>
        </section>

        <!-- CALENDAR PANEL -->
        <section class="panel">
          <div class="panel-head">
            <span class="dot" style="background:var(--done)"></span>
            Calendar
            <span class="last-updated" id="calUpdated"></span>
            <button class="panel-action" id="refreshCalBtn">&#8635; Refresh</button>
          </div>
          <div class="tagbar" id="calTagbar"></div>
          <div class="cal-timeline" id="calTimeline"><div class="empty">Loading calendar…</div></div>
        </section>
        </div>
      </div>
    </div>
  </div>

  <!-- Task modal -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <h2 id="modalTitle">New Task</h2>
      <input type="hidden" id="fId" />
      <div class="field">
        <label>Title <span class="req">*</span></label>
        <input id="fTitle" placeholder="What needs doing?" />
      </div>
      <div class="field">
        <label>Due Date</label>
        <input id="fDue" type="date" />
      </div>
      <div class="field">
        <label>Priority</label>
        <div class="status-pills" id="priorityPills">
          <span class="tag" data-priority="low">Low</span>
          <span class="tag" data-priority="medium">Medium</span>
          <span class="tag" data-priority="high">High</span>
          <span class="tag" data-priority="urgent">Urgent</span>
        </div>
      </div>
      <div class="field">
        <label>Project <span class="hint">(optional)</span></label>
        <input id="fProject" list="projectList" placeholder="e.g. Fall 2026" />
        <datalist id="projectList"></datalist>
      </div>
      <div class="field">
        <label>Description <span class="hint">(optional)</span></label>
        <textarea id="fNotes" placeholder="Details..."></textarea>
      </div>
      <div class="field">
        <div class="status-line" id="fStatus"></div>
      </div>
      <div class="modal-actions">
        <button id="deleteBtn" class="btn-danger hidden">Delete</button>
        <button id="cancelBtn">Cancel</button>
        <button id="saveBtn" class="btn-primary">Save</button>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // CONFIG — edit these
    // ============================================================
    const SUPABASE_URL = 'https://heyrtjzntnicqsfemcmi.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhleXJ0anpudG5pY3FzZmVtY21pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3OTU3NDksImV4cCI6MjA5OTM3MTc0OX0.MwivwC-MUgI7J4-bH5ahjuL8YLQYPsR1vzcRVlpoTNo';
    const TZ = 'America/New_York';
    // ============================================================
    // END CONFIG
    // ============================================================

    const PRIORITIES = ['low', 'medium', 'high', 'urgent'];
    const PRIORITY_CLASS = { low: 'p-l', medium: 'p-m', high: 'p-h', urgent: 'p-u' };

    // Calendar timeline clock: first/last hour line and pixels per hour.
    const TL_START = 7, TL_END = 23, PX_PER_HOUR = 44;

    let client = null;
    let authed = false;
    let tasks = [];
    let events = [];
    let activeProject = 'ALL';
    let showCompleted = false;
    let calMode = 'today';
    let editingId = null;
    let modalPriority = 'medium';

    const $ = (id) => document.getElementById(id);

    // ---------- Helpers ----------
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
    function todayEt() {
      return new Date().toLocaleDateString('en-CA', { timeZone: TZ });
    }
    function addDaysLocal(dateStr, n) {
      const d = new Date(dateStr + 'T12:00:00');
      d.setDate(d.getDate() + n);
      return d.toLocaleDateString('en-CA', { timeZone: TZ });
    }
    function isoToDateStr(iso) {
      return new Date(iso).toLocaleDateString('en-CA', { timeZone: TZ });
    }
    function isoToTimeStr(iso) {
      const d = new Date(iso);
      const h = d.toLocaleString('en-US', { timeZone: TZ, hour: 'numeric', hour12: false });
      const m = d.toLocaleString('en-US', { timeZone: TZ, minute: '2-digit' });
      return `${String(+h).padStart(2, '0')}:${m}`;
    }
    function fmtTime12(t) {
      if (!t) return '';
      const [hh, mm] = t.split(':').map(Number);
      const ap = hh >= 12 ? 'PM' : 'AM';
      const h = hh % 12 || 12;
      return mm ? `${h}:${String(mm).padStart(2, '0')} ${ap}` : `${h} ${ap}`;
    }
    function fmtRange(s, e) {
      if (!s) return '';
      return e ? `${fmtTime12(s)}–${fmtTime12(e)}` : fmtTime12(s);
    }
    function formatDate(dateStr) {
      if (!dateStr) return '—';
      const d = new Date(dateStr + 'T00:00:00');
      if (isNaN(d)) return '—';
      return d.toLocaleDateString('en-US', { month: 'short', day: '2-digit' });
    }
    function nanoid(size = 21) {
      const c = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz_-';
      return crypto.getRandomValues(new Uint8Array(size)).reduce((a, x) => a + c[x & 63], '');
    }
    function setError(msg) {
      const el = $('connError');
      el.className = 'conn-error';
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    // ---------- Auth ----------
    function hideError() {
      $('connError').classList.add('hidden');
    }

    function showNotice(msg) {
      const el = $('connError');
      el.className = 'conn-error notice';
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    // Boot straight into the OS. If a session is stored (previous sign-in), it is
    // reused silently so tasks load without prompting. Signed-out users still see
    // the calendar (the edge function allows anon) and can sign in via the topbar.
    async function applyAuthState() {
      $('os').classList.remove('hidden');
      const { data: { session } } = await client.auth.getSession();
      const signedIn = !!session;
      const email = session?.user?.email || '';
      authed = signedIn;
      $('whoAmI').textContent = email;
      $('whoAmI').classList.toggle('hidden', !email);
      $('signInBtn').classList.toggle('hidden', signedIn);
      $('signOutBtn').classList.toggle('hidden', !signedIn);
      renderTaskTags();
      renderCalTags();
      if (signedIn) {
        hideError();
        await Promise.all([loadTasks(), loadCalendar()]);
      } else {
        await loadCalendar();
        showNotice('Not signed in — calendar is live. Sign in for tasks.');
      }
    }

    // ---------- Tasks ----------
    async function loadTasks() {
      if (!authed) return;
      try {
        const { data, error } = await client.from('tasks').select('*').order('created_at', { ascending: true });
        if (error) throw error;
        tasks = data || [];
        renderTasks();
        hideError();
      } catch (e) {
        setError('Failed to load tasks: ' + e.message);
      }
    }

    function filteredTasks(list) {
      if (activeProject === 'ALL') return list;
      return list.filter(t => t.project === activeProject);
    }

    function renderTaskTags() {
      const projects = [...new Set(tasks.map(t => t.project).filter(Boolean))].sort();
      const bar = $('taskTagbar');
      bar.innerHTML =
        `<span class="label">Filter:</span>` +
        `<button class="completed-toggle${showCompleted ? ' active' : ''}" id="completedToggle">${showCompleted ? 'Hide Completed' : 'Show Completed'}</button>` +
        `<span class="tag${activeProject === 'ALL' ? ' active' : ''}" data-project="ALL">All</span>` +
        projects.map(p => `<span class="tag${activeProject === p ? ' active' : ''}" data-project="${escapeHtml(p)}">${escapeHtml(p)}</span>`).join('');
      $('completedToggle').onclick = () => {
        showCompleted = !showCompleted;
        $('taskColumns').classList.toggle('show-completed', showCompleted);
        renderTaskTags();
      };
      bar.querySelectorAll('.tag').forEach(ch => {
        ch.onclick = () => { activeProject = ch.dataset.project; renderTaskTags(); renderTasks(); };
      });
    }

    function renderTasks() {
      renderTaskTags();
      const pending = filteredTasks(tasks.filter(t => t.status !== 'done'));
      const donec = filteredTasks(tasks.filter(t => t.status === 'done'));
      fillTaskColumn('pending', pending);
      fillTaskColumn('done', donec);
    }

    function fillTaskColumn(status, list) {
      const body = document.querySelector(`#taskColumns [data-body="${status}"]`);
      const countEl = document.querySelector(`#taskColumns [data-count="${status}"]`);
      countEl.textContent = list.length;
      body.innerHTML = '';
      if (!list.length) { body.innerHTML = '<div class="empty">No tasks</div>'; return; }
      list.sort((a, b) => (a.due_date || '9999-12-31').localeCompare(b.due_date || '9999-12-31'));
      for (const t of list) body.appendChild(renderTaskCard(t));
    }

    function renderTaskCard(t) {
      const card = document.createElement('div');
      card.className = 'card task';
      card.dataset.status = t.status;
      card.onclick = () => openEdit(t);

      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const due = t.due_date ? new Date(t.due_date + 'T00:00:00') : null;
      const overdue = due && t.status !== 'done' && due < today;
      const prio = t.priority || 'medium';
      const prioColor = { low: 'var(--low)', medium: 'var(--accent-dim)', high: 'var(--done)', urgent: 'var(--warn)' }[prio] || 'var(--border)';
      card.style.borderLeftColor = prioColor;

      card.innerHTML =
        `<div class="title">${escapeHtml(t.title)}</div>` +
        `<div class="meta">` +
          `<div class="row">` +
            (t.project ? `<span class="badge">${escapeHtml(t.project)}</span>` : '') +
            `<span class="badge ${PRIORITY_CLASS[prio] || 'p-m'}">${escapeHtml(prio)}</span>` +
            (t.source ? `<span class="badge">${escapeHtml(t.source)}</span>` : '') +
          `</div>` +
          (t.description ? `<div class="row desc">${escapeHtml(t.description)}</div>` : '') +
        `</div>` +
        `<div class="card-actions">` +
          `<span class="due ${overdue ? 'overdue' : ''}">Due: ${formatDate(t.due_date)}${overdue ? ' (overdue)' : ''}</span>` +
          (t.status === 'done'
            ? `<button class="go-back" type="button">REOPEN</button>`
            : `<button type="button">COMPLETE</button>`) +
        `</div>`;

      const btn = card.querySelector('button');
      btn.onclick = (e) => {
        e.stopPropagation();
        setStatus(t, t.status === 'done' ? 'pending' : 'done');
      };
      return card;
    }

    async function setStatus(t, status) {
      try {
        const { error } = await client.from('tasks')
          .update({ status, updated_at: new Date().toISOString() })
          .eq('id', t.id);
        if (error) throw error;
        await loadTasks();
      } catch (e) {
        setError('Failed to update task: ' + e.message);
      }
    }

    // ---------- Calendar ----------
    async function loadCalendar() {
      const { data: { session } } = await client.auth.getSession();
      const token = session?.access_token || '';
      try {
        const r = await fetch(SUPABASE_URL + '/functions/v1/calendar-proxy', {
          headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${token}`, }
        });
        if (!r.ok) throw new Error('calendar proxy HTTP ' + r.status);
        const body = await r.json();
        events = (body.events || []).map(ev => ({
          title: ev.title || 'Untitled',
          date: ev.start ? isoToDateStr(ev.start) : null,
          start_time: (ev.allDay || !ev.start) ? null : isoToTimeStr(ev.start),
          end_time: (ev.allDay || !ev.end) ? null : isoToTimeStr(ev.end),
          allDay: !!ev.allDay,
          location: ev.location || '',
          calendar: ev.calendar || '',
          color: ev.color || 'var(--border)',
        }));
        $('calUpdated').textContent = body.last_updated
          ? 'fetched ' + new Date(body.last_updated).toLocaleTimeString('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit' })
          : '';
        renderEvents();
        hideError();
      } catch (e) {
        setError('Failed to load calendar: ' + e.message);
      }
    }

    function renderCalTags() {
      const today = todayEt();
      const weekEnd = addDaysLocal(today, 7);
      const counts = { today: 0, week: 0, later: 0 };
      for (const e of events) {
        if (!e.date || e.date < today) continue;
        if (e.date === today) counts.today++;
        else if (e.date <= weekEnd) counts.week++;
        else counts.later++;
      }
      const bar = $('calTagbar');
      bar.innerHTML =
        `<span class="label">Scale:</span>` +
        [['today', 'Today'], ['week', 'This Week'], ['later', 'Later']]
          .map(([v, label]) =>
            `<span class="tag${calMode === v ? ' active' : ''}" data-mode="${v}">${label}<span class="tl-count">${counts[v]}</span></span>`
          ).join('');
      bar.querySelectorAll('.tag').forEach(ch => {
        ch.onclick = () => { calMode = ch.dataset.mode; renderEvents(); };
      });
    }

    function toMin(t) {
      if (!t) return null;
      const [h, m] = t.split(':').map(Number);
      return h * 60 + m;
    }
    function fmtDayHead(tag, dateStr) {
      const d = new Date(dateStr + 'T12:00:00');
      const md = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }).toUpperCase();
      return `${tag} <span class="tl-date">${md}</span>`;
    }
    function tlBlock(ev) {
      const start = toMin(ev.start_time);
      const end = toMin(ev.end_time);
      const minStart = TL_START * 60, minEnd = TL_END * 60;
      const s = Math.max(start, minStart);
      const e = Math.min(end != null ? end : start + 60, minEnd);
      if (e <= minStart || s >= minEnd) return null;
      const pxPerMin = PX_PER_HOUR / 60;
      const top = (s - minStart) * pxPerMin;
      const height = Math.max((e - s) * pxPerMin, 16);
      return `<div class="blk" style="top:${top.toFixed(1)}px;height:${height.toFixed(1)}px;border-left-color:${ev.color}">` +
        `<div class="b-title">${escapeHtml(ev.title)}</div>` +
        `<div class="b-time">${escapeHtml(fmtRange(ev.start_time, ev.end_time))}</div>` +
        `</div>`;
    }
    function tlColumn(titleHtml, evs) {
      const gridH = (TL_END - TL_START) * PX_PER_HOUR;
      const allDay = evs.filter(e => e.allDay || !e.start_time);
      const timed = evs.filter(e => !e.allDay && e.start_time);
      let h = `<div class="tl-rail"><div class="tl-head">${titleHtml}<span class="tl-n">${evs.length || ''}</span></div>`;
      for (const e of allDay) {
        h += `<div class="blk allday" style="border-left-color:${e.color}">` +
          `<span class="b-label">ALL DAY</span><span class="b-title">${escapeHtml(e.title)}</span></div>`;
      }
      h += `<div class="tl-body"><div class="tl-ticks" style="height:${gridH}px">`;
      for (let k = TL_START; k <= TL_END; k++) {
        const f = (k - TL_START) / (TL_END - TL_START);
        const tr = f === 0 ? 'translateY(0)' : (f >= 1 ? 'translateY(-100%)' : 'translateY(-50%)');
        h += `<span class="tl-tick" style="top:${(f * 100).toFixed(2)}%;transform:${tr}">${fmtTime12(k + ':00')}</span>`;
      }
      h += `</div><div class="tl-grid" style="height:${gridH}px">`;
      for (let k = TL_START; k <= TL_END; k++) {
        const f = (k - TL_START) / (TL_END - TL_START);
        h += `<div class="tl-hourline" style="top:${(f * 100).toFixed(2)}%"></div>`;
      }
      const blkHtml = timed.map(e => tlBlock(e)).filter(Boolean).join('');
      h += blkHtml || (allDay.length ? '' : '<div class="tl-empty">No events</div>');
      h += `</div></div></div>`;
      return h;
    }

    function renderEvents() {
      renderCalTags();
      const tl = $('calTimeline');
      const today = todayEt();
      if (calMode === 'week') {
        const html = '<div class="tl-week">' + [0, 1, 2, 3, 4, 5, 6].map(i => {
          const d = addDaysLocal(today, i);
          const dayEvs = events.filter(e => e.date === d);
          const wd = new Date(d + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short' }).toUpperCase();
          return tlColumn(fmtDayHead(i === 0 ? 'TODAY' : wd, d), dayEvs);
        }).join('') + '</div>';
        tl.innerHTML = events.some(e => e.date >= today && e.date <= addDaysLocal(today, 7))
          ? html
          : '<div class="empty">No events this week</div>';
      } else if (calMode === 'later') {
        const future = events.filter(e => e.date > today).sort((a, b) => a.date.localeCompare(b.date));
        if (!future.length) { tl.innerHTML = '<div class="empty">No later events</div>'; return; }
        const rows = [];
        let cur = null;
        for (const e of future) {
          if (!cur || cur.date !== e.date) { cur = { date: e.date, evs: [] }; rows.push(cur); }
          cur.evs.push(e);
        }
        let html = '<div class="tl-later">';
        for (const r of rows) {
          const wd = new Date(r.date + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'long' }).toUpperCase();
          html += `<div class="later-row"><div class="later-date">${fmtDayHead(wd, r.date)}</div><div class="later-cards">`;
          for (const e of r.evs) html += renderEventCardHtml(e);
          html += `</div></div>`;
        }
        tl.innerHTML = html + '</div>';
      } else {
        const dayEvs = events.filter(e => e.date === today);
        tl.innerHTML = dayEvs.length
          ? tlColumn(fmtDayHead('TODAY', today), dayEvs)
          : '<div class="empty">No events today</div>';
      }
    }

    function renderEventCardHtml(ev) {
      const timeLine = ev.allDay ? 'All day' : fmtRange(ev.start_time, ev.end_time);
      return `<div class="card" style="border-left-color:${ev.color}">` +
        `<div class="title">${escapeHtml(ev.title)}</div>` +
        `<div class="meta">` +
          `<div class="row">` +
            (ev.calendar ? `<span class="badge" style="color:${escapeHtml(ev.color)};border-color:${escapeHtml(ev.color)}">${escapeHtml(ev.calendar)}</span>` : '') +
            (ev.allDay ? `<span class="badge">All day</span>` : '') +
          `</div>` +
          `<div class="row">${escapeHtml(timeLine)}</div>` +
          (ev.location ? `<div class="row">${escapeHtml(ev.location)}</div>` : '') +
        `</div>` +
        `<div class="card-actions"><span class="due">${escapeHtml(formatDate(ev.date))}</span></div>` +
      `</div>`;
    }

    function renderEventCard(ev) {
      const card = document.createElement('div');
      card.className = 'card';
      card.style.borderLeftColor = ev.color;
      card.innerHTML = renderEventCardHtml(ev);
      return card;
    }

    // ---------- Modal ----------
    function openEdit(t) {
      editingId = t ? t.id : null;
      $('modalTitle').textContent = t ? 'Edit Task' : 'New Task';
      $('fId').value = t ? t.id : '';
      $('fTitle').value = t ? t.title : '';
      $('fDue').value = t ? (t.due_date || '') : '';
      $('fProject').value = t ? (t.project || '') : '';
      $('fNotes').value = t ? (t.description || '') : '';
      $('fStatus').innerHTML = t
        ? `Status: <b>${t.status === 'done' ? 'Completed' : 'Pending'}</b>`
        : 'Status: <b>Pending</b> (new task)';
      modalPriority = t ? (t.priority || 'medium') : 'medium';
      setPriorityPill();

      const list = $('projectList');
      list.innerHTML = '';
      for (const p of [...new Set(tasks.map(x => x.project).filter(Boolean))].sort()) {
        const opt = document.createElement('option');
        opt.value = p;
        list.appendChild(opt);
      }
      $('deleteBtn').classList.toggle('hidden', !t);
      $('overlay').classList.add('open');
    }

    function setPriorityPill() {
      document.querySelectorAll('#priorityPills .tag').forEach(p => {
        p.classList.toggle('active', p.dataset.priority === modalPriority);
      });
    }

    async function save() {
      const title = $('fTitle').value.trim();
      if (!title) { alert('Title is required.'); return; }
      const payload = {
        title,
        due_date: $('fDue').value || null,
        priority: modalPriority,
        project: $('fProject').value.trim() || null,
        description: $('fNotes').value.trim() || null,
        updated_at: new Date().toISOString(),
      };
      try {
        if (editingId) {
          await client.from('tasks').update(payload).eq('id', editingId);
        } else {
          await client.from('tasks').insert({
            id: nanoid(),
            status: 'pending',
            source: 'manual',
            created_at: new Date().toISOString(),
            ...payload,
          });
        }
        $('overlay').classList.remove('open');
        await loadTasks();
      } catch (e) {
        setError('Failed to save task: ' + e.message);
      }
    }

    async function remove() {
      if (!editingId) return;
      if (!confirm('Delete this task?')) return;
      try {
        await client.from('tasks').delete().eq('id', editingId);
        $('overlay').classList.remove('open');
        await loadTasks();
      } catch (e) {
        setError('Failed to delete task: ' + e.message);
      }
    }

    // ---------- Wire up ----------
    const rootEl = document.documentElement;
    const storedTheme = localStorage.getItem('personalOSTheme');
    if (storedTheme === 'dark') rootEl.setAttribute('data-theme', 'dark');
    $('themeToggle').onclick = () => {
      const isDark = rootEl.getAttribute('data-theme') === 'dark';
      if (isDark) rootEl.removeAttribute('data-theme');
      else rootEl.setAttribute('data-theme', 'dark');
      localStorage.setItem('personalOSTheme', isDark ? 'light' : 'dark');
    };

    $('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('authError').textContent = '';
      const { error } = await client.auth.signInWithPassword({
        email: $('authEmail').value,
        password: $('authPass').value,
      });
      if (error) { $('authError').textContent = error.message; return; }
      $('loginForm').classList.remove('open');
      await applyAuthState();
    });

    $('signInBtn').onclick = () => {
      $('authError').textContent = '';
      $('loginForm').classList.add('open');
    };
    $('loginCancelBtn').onclick = () => $('loginForm').classList.remove('open');
    $('loginForm').addEventListener('mousedown', (e) => {
      if (e.target === $('loginForm')) $('loginForm').classList.remove('open');
    });

    $('signOutBtn').onclick = async () => {
      await client.auth.signOut();
      await applyAuthState();
    };

    $('newTaskBtn').onclick = () => openEdit(null);
    $('refreshTasksBtn').onclick = loadTasks;
    $('refreshCalBtn').onclick = loadCalendar;
    $('cancelBtn').onclick = () => $('overlay').classList.remove('open');
    $('saveBtn').onclick = save;
    $('deleteBtn').onclick = remove;

    document.querySelectorAll('#priorityPills .tag').forEach(p => {
      p.onclick = () => { modalPriority = p.dataset.priority; setPriorityPill(); };
    });

    // ---------- Boot ----------
    async function boot() {
      client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      await applyAuthState();
      // Realtime (works if `tasks` is in the realtime publication; ignored otherwise)
      try {
        client.channel('personal-os')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'tasks' }, () => loadTasks())
          .subscribe();
      } catch (e) { /* noop */ }
      // Polling fallback
      setInterval(() => { if (authed) loadTasks(); }, 60000);
      setInterval(() => { loadCalendar(); }, 300000);
    }

    boot();
  </script>
</body>
</html>
